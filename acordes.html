<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACORDES E PARTITURAS (Pro Edition - Bug Fix & Melody)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    
    <style>
        :root {
            --bg: #09090b; --surface: #18181b; --border: #27272a; 
            --text: #f4f4f5; --text-muted: #a1a1aa;
            --accent: #10b981; --accent-hover: #059669; 
            --key-white: #f8fafc; --key-black: #0f172a;
            --active-white: #a7f3d0; --active-black: #10b981;
            --chord-bg: #064e3b;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px 10px; background: var(--bg); color: var(--text); margin: 0; }
        h1 { font-size: clamp(20px, 4vw, 26px); font-weight: 800; margin-bottom: 20px; color: #fff; letter-spacing: -0.5px;}

        .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 8px; flex-wrap: wrap; }
        .tab-btn { background: var(--surface); color: var(--text-muted); padding: 12px 16px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; flex: 1 1 140px; max-width: 200px; }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .controls { background: var(--surface); padding: 20px; border-radius: 12px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 12px; border: 1px solid var(--border); margin-bottom: 25px; max-width: 1050px; margin-left: auto; margin-right: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .control-group { display: flex; flex-direction: column; text-align: left; gap: 5px; flex: 1 1 130px; min-width: 120px; }
        .control-group label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px;}
        select, input { padding: 12px; font-size: 13px; border-radius: 8px; border: 1px solid var(--border); outline: none; background: var(--bg); color: var(--text); cursor: pointer; transition: all 0.2s; width: 100%; font-weight: 500;}
        select:hover { border-color: var(--accent); }

        .playback-controls { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
        .playback-controls button { flex: 1 1 110px; max-width: 200px; font-weight: bold; padding: 14px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s;}
        
        button.primary-btn { background: var(--accent); color: #fff;}
        button.primary-btn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);}
        button.primary-btn.error { background: #eab308; border-color: #ca8a04; color: #000;}
        button.secondary-btn { background: var(--surface); color: var(--text); border: 1px solid var(--accent); }
        button.secondary-btn:hover:not(:disabled) { background: rgba(16, 185, 129, 0.2); transform: translateY(-2px); }
        button.stop-btn { background: #ef4444; color: #fff; }
        button.stop-btn:hover:not(:disabled) { background: #dc2626; transform: translateY(-2px); }
        button:disabled { background: var(--border); border-color: var(--border); color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none;}

        .progression-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; min-height: 100px; flex-wrap: wrap;}
        .chord-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 130px; padding: 20px 5px; transition: all 0.2s; position: relative;}
        .chord-box.playing { background: var(--chord-bg); border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);}
        .chord-name { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-top: 5px;}
        .chord-voicing { font-size: 11px; color: var(--text-muted); margin-top: 5px; font-weight: 600;}
        .chord-duration { position: absolute; top: 8px; right: 8px; font-size: 10px; color: var(--accent); font-weight: bold;}
        .chord-function { font-size: 12px; color: var(--accent); font-weight: 700; margin-top: 8px; }

        .score-header { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        #score-container { margin: 0 auto 25px auto; width: 100%; max-width: 900px; overflow-x: auto; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); padding: 10px 0;}
        #score svg path, #score svg rect { stroke: #d4d4d8; fill: #d4d4d8; }
        #score svg text { fill: #f4f4f5; font-family: 'Segoe UI', sans-serif !important; stroke: none;}

        .piano-wrapper { width: 100%; max-width: 1000px; margin: 0 auto; overflow-x: auto; padding-bottom: 15px; background: #000; border-radius: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        #piano { position: relative; height: 120px; width: 1260px; margin: 0 auto; }
        .key { position: absolute; top: 0; border-radius: 0 0 4px 4px; transition: background 0.1s; box-sizing: border-box; }
        .key.white { width: 36px; height: 120px; background: var(--key-white); z-index: 1; border: 1px solid #ccc; }
        .key.black { width: 22px; height: 75px; background: var(--key-black); z-index: 2; border: 1px solid #000;}
        .key.white.active { background: var(--active-white); border-color: var(--accent); z-index: 3;}
        .key.black.active { background: var(--active-black); z-index: 4;}

        #export-zone { display: none; flex-direction: column; gap: 10px; margin: 25px auto; width: 100%; max-width: 500px; }
        #drag-pad { padding: 15px 30px; background: rgba(16, 185, 129, 0.1); border: 1px dashed var(--accent); border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 600; cursor: grab; transition: 0.2s; text-align: center; }
        #drag-pad:hover { background: rgba(16, 185, 129, 0.2); }
        #btn-download-midi { padding: 18px 30px; background: #3b82f6; color: #fff; font-size: 16px; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); transition: 0.2s; width: 100%; }
        #btn-download-midi:hover { background: #2563eb; transform: translateY(-2px);}
    </style>
</head>
<body onload="initializeApp()">
    <h1>ACORDES E PARTITURAS</h1>

    <div class="tabs">
        <button class="tab-btn active" id="tab-scale" onclick="switchMode('scale')">Escala Livre</button>
        <button class="tab-btn" id="tab-style" onclick="switchMode('style')">Composição por Estilo</button>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <label>Tônica</label>
            <select id="root-note">
                <option value="0">C</option><option value="1">C# / Db</option><option value="2">D</option>
                <option value="3">D# / Eb</option><option value="4">E</option><option value="5">F</option>
                <option value="6">F# / Gb</option><option value="7">G</option><option value="8">G# / Ab</option>
                <option value="9">A</option><option value="10">A# / Bb</option><option value="11">B</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Tonalidade (Escalas Restauradas)</label>
            <select id="scale-type">
                <optgroup label="Tradicionais">
                    <option value="major">Maior (Jônio)</option>
                    <option value="minor" selected>Menor Natural (Eólio)</option>
                    <option value="harmonic_minor">Menor Harmônica</option>
                    <option value="melodic_minor">Menor Melódica</option>
                </optgroup>
                <optgroup label="Modos Gregos">
                    <option value="dorian">Dórico</option>
                    <option value="phrygian">Frígio</option>
                    <option value="lydian">Lídio</option>
                    <option value="mixolydian">Mixolídio</option>
                    <option value="locrian">Lócrio</option>
                </optgroup>
            </select>
        </div>

        <div class="control-group" id="group-style" style="display: none;">
            <label>Gênero Base</label>
            <select id="music-style">
                <option value="pop_rock">Pop / Rock</option>
                <option value="jazz_functional">Jazz / R&B</option>
                <option value="hiphop_trap">Hip-Hop / Trap</option>
                <option value="electronic_modern">Electronic / Dance</option>
                <option value="metal_rock">Metal / Hard Rock</option>
                <option value="latin_bossa">Latin / Bossa</option>
                <option value="reggae_dub">Reggae / Dub</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Arranjo / Ritmo</label>
            <select id="arrangement-pattern">
                <option value="auto">Automático (Pelo Estilo)</option>
                <option value="block_bass">Blocos Retos (Pop)</option>
                <option value="fingerpick">Arpejo / Dedilhado</option>
                <option value="jazz_comping">Comping Sincopado (Jazz)</option>
                <option value="bossa_nova">Bossa Nova (Clave)</option>
                <option value="reggae_skank">Reggae (Skank)</option>
                <option value="synth_pulse">Pulsante</option>
                <option value="metal_gallop">Palhetada Rápida</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>BPM</label>
            <select id="bpm-control">
                <option value="75">75 (Lento / Reggae)</option>
                <option value="90">90 (Médio-Lento / Bossa)</option>
                <option value="120" selected>120 (Padrão / Pop)</option>
                <option value="140">140 (Rápido / Rock)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Baixo</label>
            <select id="bass-control">
                <option value="on" selected>Com Baixo (Isolado)</option>
                <option value="off">Sem Baixo</option>
            </select>
        </div>

        <div class="control-group">
            <label>Melodia (Lead)</label>
            <select id="melody-control">
                <option value="on" selected>Com Melodia (AABA)</option>
                <option value="off">Sem Melodia</option>
            </select>
        </div>

        <div class="playback-controls">
            <button id="btn-prev" class="secondary-btn" onclick="playPrevious()" disabled>⏮ Anterior</button>
            <button id="btn-generate" class="primary-btn" onclick="generateNew()" disabled>Carregando...</button>
            <button id="btn-stop" class="stop-btn" onclick="stopPlayback()" disabled>⏹ Parar</button>
            <button id="btn-repeat" class="secondary-btn" onclick="repeatCurrent()" disabled>🔁 Repetir</button>
        </div>
    </div>

    <div class="score-header">Leitura Harmônica Simplificada</div>
    <div id="score-container"><div id="score"></div></div>
    
    <div class="progression-container" id="progression-display"></div>
    <div class="piano-wrapper"><div id="piano"></div></div>
    
    <div id="export-zone">
        <div id="drag-pad" draggable="true" title="Arraste direto para a DAW (Para Windows, salve no desktop primeiro)">🖱️ ARRASTAR MIDI PARA DAW (MAC/Chrome)</div>
        <button id="btn-download-midi">⬇️ BAIXAR ARQUIVO MIDI (Para Windows/Ableton)</button>
    </div>

    <script>
        const VF = Vex.Flow;
        const NOTES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
        const VEX_KEYS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const ACC_MAP = ['', '#', '', 'b', '', '', '#', '', 'b', '', 'b', ''];
        const NOTE_COLORS = ["#ef4444", "#f97316", "#f59e0b", "#eab308", "#84cc16", "#22c55e", "#10b981", "#06b6d4", "#3b82f6", "#6366f1", "#a855f7", "#ec4899"];

        // BUG CORRIGIDO: Todas as escalas mapeadas perfeitamente
        const SCALES = {
            'major':          [0, 2, 4, 5, 7, 9, 11],
            'minor':          [0, 2, 3, 5, 7, 8, 10],
            'harmonic_minor': [0, 2, 3, 5, 7, 8, 11],
            'melodic_minor':  [0, 2, 3, 5, 7, 9, 11],
            'dorian':         [0, 2, 3, 5, 7, 9, 10],
            'phrygian':       [0, 1, 3, 5, 7, 8, 10],
            'lydian':         [0, 2, 4, 6, 7, 9, 11],
            'mixolydian':     [0, 2, 4, 5, 7, 9, 10],
            'locrian':        [0, 1, 3, 5, 6, 8, 10]
        };

        const STYLE_PATTERNS = {
            'pop_rock': 'block_bass',
            'jazz_functional': 'jazz_comping',
            'hiphop_trap': 'synth_pulse',
            'electronic_modern': 'synth_pulse',
            'metal_rock': 'metal_gallop',
            'latin_bossa': 'bossa_nova',
            'reggae_dub': 'reggae_skank'
        };

        let currentMode = 'scale'; 
        let currentBlobUrl = null;
        let playTimeouts = [];
        let progressionHistory = [];
        let historyIndex = -1;
        let musicDatabase = null; 

        const eq = new Tone.EQ3({ low: 0, mid: 2, high: -4 }).toDestination();
        const compressor = new Tone.Compressor({ threshold: -20, ratio: 3, attack: 0.05, release: 0.1 }).connect(eq);
        const sampler = new Tone.Sampler({
            urls: {
                "C2": "C2.mp3", "D#2": "Ds2.mp3", "F#2": "Fs2.mp3", "A2": "A2.mp3",
                "C3": "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3", "A3": "A3.mp3",
                "C4": "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", "A4": "A4.mp3"
            },
            release: 1.5,
            baseUrl: "https://tonejs.github.io/audio/salamander/",
            onload: checkReady
        }).connect(compressor);
        sampler.volume.value = 1;

        async function initializeApp() {
            buildPiano();
            musicDatabase = {
                'pop_rock': { progressions: [[0,4,5,3], [0,3,4,0], [5,3,0,4], [0,5,3,4]] },
                'jazz_functional': { progressions: [[1,4,0,5], [2,5,1,4], [0,5,3,4]] },
                'metal_rock': { progressions: [[0,5,6,0], [0,4,6,3], [0,2,5,6]] },
                'latin_bossa': { progressions: [[0,5,1,4], [2,5,0,0], [1,4,2,5]] },
                'reggae_dub': { progressions: [[0,3,0,4], [0,6,5,0]] },
                'hiphop_trap': { progressions: [[0,5,6,0], [0,4,5,3]] },
                'electronic_modern': { progressions: [[0,6,5,4], [0,4,5,3]] }
            };
            checkReady();
        }

        let isReady = 0;
        function checkReady() {
            isReady++;
            if(isReady >= 1 || sampler.loaded) {
                const btn = document.getElementById('btn-generate');
                btn.disabled = false;
                btn.innerText = "Gerar Sequência Midi";
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');
            document.getElementById('group-style').style.display = mode === 'scale' ? 'none' : 'flex';
        }

        function buildPiano() {
            const piano = document.getElementById('piano');
            piano.innerHTML = ''; 
            let whiteIndex = 0;
            const isBlack = [false, true, false, true, false, false, true, false, true, false, true, false];
            for (let i = 36; i <= 96; i++) {
                const noteIdx = i % 12;
                const el = document.createElement('div');
                el.className = 'key ' + (isBlack[noteIdx] ? 'black' : 'white');
                el.id = 'note-' + i;
                if (!isBlack[noteIdx]) { el.style.left = `${whiteIndex * 36}px`; whiteIndex++; } 
                else { el.style.left = `${(whiteIndex * 36) - 11}px`; }
                piano.appendChild(el);
            }
        }

        function getVexFlowKeySignature(rootIdx, scaleType) {
            const offsets = { 'major': 0, 'minor': 3, 'harmonic_minor': 3, 'melodic_minor': 3, 'dorian': -2, 'phrygian': -4, 'lydian': -5, 'mixolydian': 5, 'locrian': 1 };
            return VEX_KEYS[(rootIdx + (offsets[scaleType] || 0) + 12) % 12];
        }

        function buildAbsoluteVoicing(rootMidiAbs, quality) {
            let intervals = [0, 4, 7]; 
            switch(quality) {
                case 'maj9': intervals = [0, 4, 7, 11, 14]; break;
                case 'm9': intervals = [0, 3, 7, 10, 14]; break;
                case 'dom9': intervals = [0, 4, 7, 10, 14]; break;
                case 'dom7b9': intervals = [0, 4, 7, 10, 13]; break; 
                case 'dom13': intervals = [0, 4, 10, 14, 21]; break; 
                case 'm7b5': intervals = [0, 3, 6, 10]; break; 
                case 'dim7': intervals = [0, 3, 6, 9]; break; 
                case 'dom7': intervals = [0, 4, 7, 10]; break;
                case 'm7': intervals = [0, 3, 7, 10]; break;
                case 'maj7': intervals = [0, 4, 7, 11]; break;
                case 'sus2': intervals = [0, 2, 7]; break;
                case 'sus4': intervals = [0, 5, 7]; break;
                case 'power': intervals = [0, 7]; break;
                case 'minor': intervals = [0, 3, 7]; break;
                case 'triad': intervals = [0, 4, 7]; break;
            }
            if (intervals.length > 4) intervals.splice(2, 1); 
            return intervals.map(i => rootMidiAbs + i);
        }

        function applyVoiceLeading(targetNotes, previousNotes, baseOctaveMidi) {
            if (!previousNotes || previousNotes.length === 0) {
                return targetNotes.map(n => {
                    let note = n;
                    while(note < baseOctaveMidi) note += 12;
                    while(note >= baseOctaveMidi + 12) note -= 12;
                    return note;
                }).sort((a,b) => a - b);
            }

            const prevCenter = previousNotes.reduce((a, b) => a + b, 0) / previousNotes.length;
            const targetCenter = targetNotes.reduce((a, b) => a + b, 0) / targetNotes.length;
            const diff = prevCenter - targetCenter;
            
            let ledNotes = [...targetNotes];
            if (diff > 6) ledNotes = targetNotes.map(n => n + 12);
            if (diff < -6) ledNotes = targetNotes.map(n => n - 12);
            
            return ledNotes.map(n => {
                let note = n;
                while(note < 48) note += 12; 
                return note;
            }).sort((a,b) => a - b);
        }

        function renderScore(progressionData, keySignatureString) {
            const div = document.getElementById("score");
            div.innerHTML = ""; 
            const scoreWidth = Math.max(800, progressionData.length * 150);
            const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
            renderer.resize(scoreWidth, 240);
            const context = renderer.getContext();
            const topStave = new VF.Stave(30, 20, scoreWidth - 50).addClef("treble").addKeySignature(keySignatureString).setContext(context).draw();
            const bottomStave = new VF.Stave(30, 110, scoreWidth - 50).addClef("bass").addKeySignature(keySignatureString).setContext(context).draw();
            new VF.StaveConnector(topStave, bottomStave).setType(VF.StaveConnector.type.BRACE).setContext(context).draw();
            new VF.StaveConnector(topStave, bottomStave).setType(VF.StaveConnector.type.SINGLE_LEFT).setContext(context).draw();

            let trebleNotes = [], bassNotes = [];
            const keysMap = ['c', 'c', 'd', 'e', 'e', 'f', 'f', 'g', 'a', 'a', 'b', 'b'];

            progressionData.forEach(chord => {
                let tKeys = [], bKeys = [], tAcc = [], bAcc = [];
                let tColors = [], bColors = [];
                
                let visualNotes = [...new Set(chord.midiNotes)];
                if (chord.bassNote !== null) visualNotes.push(chord.bassNote);

                visualNotes.forEach(m => {
                    const noteIdx = m % 12;
                    const oct = Math.floor(m / 12) - 1;
                    const key = `${keysMap[noteIdx]}/${oct}`;
                    const color = NOTE_COLORS[noteIdx];

                    if (m >= 48) { 
                        tKeys.push(key); tColors.push(color);
                        if (ACC_MAP[noteIdx]) tAcc.push({ index: tKeys.length - 1, type: ACC_MAP[noteIdx], color });
                    } else { 
                        bKeys.push(key); bColors.push(color);
                        if (ACC_MAP[noteIdx]) bAcc.push({ index: bKeys.length - 1, type: ACC_MAP[noteIdx], color });
                    }
                });

                const bDur = "w";
                if (tKeys.length === 0) trebleNotes.push(new VF.StaveNote({ keys: ["b/4"], duration: bDur+"r", clef: "treble" })); 
                else {
                    let tn = new VF.StaveNote({ keys: tKeys, duration: bDur, clef: "treble" });
                    tAcc.forEach(a => { let acc = new VF.Accidental(a.type); acc.setStyle({fillStyle: a.color, strokeStyle: a.color}); tn.addModifier(acc, a.index); });
                    tn.keyProps.forEach((_, idx) => tn.setKeyStyle(idx, { fillStyle: tColors[idx], strokeStyle: tColors[idx] }));
                    trebleNotes.push(tn);
                }

                if (bKeys.length === 0) bassNotes.push(new VF.StaveNote({ keys: ["d/3"], duration: bDur+"r", clef: "bass" })); 
                else {
                    let bn = new VF.StaveNote({ keys: bKeys, duration: bDur, clef: "bass" });
                    bAcc.forEach(a => { let acc = new VF.Accidental(a.type); acc.setStyle({fillStyle: a.color, strokeStyle: a.color}); bn.addModifier(acc, a.index); });
                    bn.keyProps.forEach((_, idx) => bn.setKeyStyle(idx, { fillStyle: bColors[idx], strokeStyle: bColors[idx] }));
                    bassNotes.push(bn);
                }
            });

            const totalBeats = progressionData.reduce((acc, curr) => acc + curr.beats, 0);
            const trebleVoice = new VF.Voice({ num_beats: totalBeats, beat_value: 4 }).setStrict(false);
            const bassVoice = new VF.Voice({ num_beats: totalBeats, beat_value: 4 }).setStrict(false);
            trebleVoice.addTickables(trebleNotes); 
            bassVoice.addTickables(bassNotes);
            new VF.Formatter().joinVoices([trebleVoice]).joinVoices([bassVoice]).format([trebleVoice, bassVoice], scoreWidth - 100);
            trebleVoice.draw(context, topStave); 
            bassVoice.draw(context, bottomStave);
        }

        function generateScheduledNotes(progressionData, styleId, patternType, playBass, playMelody) {
            let scheduledNotes = []; 
            let currentBeat = 0;

            const grooveTemplates = {
                'jazz_functional': { bass: [{t:0, d:1, v:85}, {t:1, d:1, v:75}, {t:2, d:1, v:85}, {t:3, d:1, v:75}], chord: [{t:0.5, d:0.5, v:80}, {t:2.5, d:0.25, v:75}, {t:3.0, d:0.5, v:85}] },
                'latin_bossa': { bass: [{t:0, d:1.5, v:95}, {t:1.5, d:0.5, v:80, shift: 7}, {t:2, d:1.5, v:90}, {t:3.5, d:0.5, v:80, shift: 7}], chord: [{t:0.5, d:0.5, v:80}, {t:1.5, d:0.5, v:85}, {t:2.5, d:0.5, v:75}, {t:3.5, d:0.5, v:80}] },
                'reggae_dub': { bass: [{t:0, d:1, v:95}, {t:2, d:1, v:95}], chord: [{t:1, d:0.5, v:90}, {t:1.5, d:0.25, v:70}, {t:3, d:0.5, v:90}, {t:3.5, d:0.25, v:70}] },
                'hiphop_trap': { bass: [{t:0, d:1.5, v:100}, {t:2.5, d:1.5, v:95}], chord: [{t:0, d:0.75, v:85}, {t:0.75, d:0.75, v:75}, {t:1.5, d:0.5, v:85}, {t:2, d:0.5, v:75}, {t:3, d:1, v:80}] },
                'metal_rock': { bass: [{t:0, d:0.25, v:100}, {t:0.5, d:0.25, v:90}, {t:1, d:0.25, v:100}, {t:1.5, d:0.25, v:90}, {t:2, d:0.25, v:100}, {t:2.5, d:0.25, v:90}, {t:3, d:0.25, v:100}, {t:3.5, d:0.25, v:90}], chord: [{t:0, d:0.25, v:100}, {t:0.5, d:0.25, v:90}, {t:1, d:0.25, v:100}, {t:1.5, d:0.25, v:90}, {t:2, d:0.25, v:100}, {t:2.5, d:0.25, v:90}, {t:3, d:0.25, v:100}, {t:3.5, d:0.25, v:90}] },
                'electronic_modern': { bass: [{t:0, d:0.25, v:95}, {t:0.75, d:0.25, v:85}, {t:1.5, d:0.25, v:95}, {t:2.25, d:0.25, v:85}, {t:3, d:0.25, v:95}], chord: [{t:0, d:4, v:80}] },
                'pop_rock': { bass: [{t:0, d:1.5, v:95}, {t:1.5, d:0.5, v:85}, {t:2.5, d:1.5, v:90}], chord: [{t:0, d:1, v:85}, {t:1, d:0.5, v:75}, {t:1.5, d:1, v:85}, {t:2.5, d:1.5, v:80}] }
            };

            const motifATimes = [];
            for (let t = 0; t < 4; t += 0.5) { if (Math.random() > 0.5) motifATimes.push(t); }
            if (motifATimes.length === 0) motifATimes.push(0, 1.5, 2.5); 
            const motifBTimes = motifATimes.map(t => (t + 0.5) % 4).sort((a,b)=>a-b); 

            const contourA = motifATimes.map(() => Math.floor(Math.random() * 3));
            const contourB = motifBTimes.map(() => Math.floor(Math.random() * 3));

            progressionData.forEach((chord, compassIndex) => {
                const notes = chord.midiNotes.sort((a,b) => a-b);
                const bassNote = chord.bassNote;
                const template = grooveTemplates[styleId] || grooveTemplates['pop_rock']; 

                function addNote(midi, timeOffset, duration, baseVelocity, isMelody = false) {
                    if (midi === null) return;
                    let targetVel = baseVelocity;
                    if (midi >= 67 && !isMelody) targetVel *= 0.85; 
                    let finalVel = Math.min(127, Math.max(0, targetVel + (Math.random() * 6 - 3))); 
                    scheduledNotes.push({ midi: midi, timeOffset: timeOffset, duration: duration, velocity: Math.round(finalVel) });
                }

                if (playBass && bassNote !== null) {
                    if (patternType === 'fingerpick') {
                        addNote(bassNote, currentBeat, 4, 90);
                    } else if (patternType === 'auto' || patternType === STYLE_PATTERNS[styleId]) {
                        template.bass.forEach(step => {
                            let finalMidi = bassNote;
                            if (step.shift) finalMidi += step.shift; 
                            addNote(finalMidi, currentBeat + step.t, step.d, step.v);
                        });
                    } else {
                        addNote(bassNote, currentBeat, 4, 95);
                    }
                }

                if (patternType === 'fingerpick') {
                    let step = 0;
                    let noteIndex = 0;
                    while (step < 4) {
                        let n = notes[noteIndex % notes.length];
                        addNote(n, currentBeat + step, 1.0, 80);
                        step += 0.5; 
                        noteIndex++;
                    }
                } else if (patternType === 'auto' || patternType === STYLE_PATTERNS[styleId]) {
                    template.chord.forEach(step => {
                        notes.forEach((n, idx) => {
                            let strumDelay = idx * 0.015;
                            addNote(n, currentBeat + step.t + strumDelay, step.d, step.v);
                        });
                    });
                } else {
                    notes.forEach((n, idx) => {
                        addNote(n, currentBeat + (idx * 0.015), 4, 85);
                    });
                }

                if (playMelody) {
                    let isBPart = (compassIndex % 4 === 2); 
                    let activeTimes = isBPart ? motifBTimes : motifATimes;
                    let activeContour = isBPart ? contourB : contourA;

                    activeTimes.forEach((t, stepIdx) => {
                        let noteIdx = activeContour[stepIdx] % notes.length;
                        let melNote = notes[noteIdx] + 12; 
                        let melVel = (t % 1 === 0) ? 95 : 80;
                        addNote(melNote, currentBeat + t, 0.25, melVel, true);
                    });
                }
                
                currentBeat += 4; 
            });
            return { notes: scheduledNotes, totalBeats: currentBeat };
        }

        function createMidiBlob(scheduledNotesArr, totalBeats, bpm) {
            const track = [];
            const ticksPerBeat = 480;
            track.push(0x00, 0xFF, 0x51, 0x03);
            const microSecsPerBeat = Math.round(60000000 / bpm);
            track.push((microSecsPerBeat >> 16) & 0xFF, (microSecsPerBeat >> 8) & 0xFF, microSecsPerBeat & 0xFF);
            function vlq(n) {
                if (n === 0) return [0]; let res = [];
                while (n > 0) { res.unshift(n & 0x7F); n >>= 7; }
                for (let i = 0; i < res.length - 1; i++) res[i] |= 0x80;
                return res;
            }
            let events = [];
            scheduledNotesArr.forEach(n => {
                events.push({ type: 0x90, midi: n.midi, ticks: Math.round(n.timeOffset * ticksPerBeat), velocity: n.velocity });
                events.push({ type: 0x80, midi: n.midi, ticks: Math.round((n.timeOffset + n.duration) * ticksPerBeat), velocity: 0 });
            });
            events.sort((a,b) => a.ticks - b.ticks);
            let lastTicks = 0;
            events.forEach(e => {
                const delta = e.ticks - lastTicks;
                track.push(...vlq(delta)); track.push(e.type, e.midi, e.velocity); lastTicks = e.ticks;
            });
            const endDelta = Math.max(0, (totalBeats * ticksPerBeat) - lastTicks);
            track.push(...vlq(endDelta)); track.push(0xFF, 0x2F, 0x00);
            
            const header = [0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x01, 0xE0];
            const mtrk = [0x4D, 0x54, 0x72, 0x6B];
            const len = track.length;
            mtrk.push((len >> 24) & 0xFF, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF);
            const midiBytes = new Uint8Array(header.length + mtrk.length + track.length);
            midiBytes.set(header, 0); midiBytes.set(mtrk, header.length); midiBytes.set(track, header.length + mtrk.length);
            return new Blob([midiBytes], { type: 'audio/midi' });
        }

        function setButtonsState(disabled) {
            document.getElementById('btn-generate').disabled = disabled;
            document.getElementById('btn-stop').disabled = !disabled;
            document.getElementById('btn-prev').disabled = disabled || historyIndex <= 0;
            document.getElementById('btn-repeat').disabled = disabled || historyIndex < 0;
        }

        function stopPlayback() {
            playTimeouts.forEach(clearTimeout);
            playTimeouts = [];
            sampler.releaseAll();
            document.querySelectorAll('.chord-box').forEach(b => b.classList.remove('playing'));
            document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));
            setButtonsState(false);
        }

        async function generateNew() {
            if (Tone.context.state !== 'running') await Tone.start();
            stopPlayback();
            setButtonsState(true);

            const rootIdx = parseInt(document.getElementById('root-note').value);
            const scaleType = document.getElementById('scale-type').value;
            const baseOctaveMidi = parseInt(document.getElementById('octave-select').value); 
            const arrOverride = document.getElementById('arrangement-pattern').value;
            const bpmValue = parseInt(document.getElementById('bpm-control').value) || 120;
            const playBass = document.getElementById('bass-control').value === 'on';
            const playMelody = document.getElementById('melody-control').value === 'on';
            const scaleIntervals = SCALES[scaleType];
            
            const progressionData = [];
            let previousNotes = [];
            let styleId = document.getElementById('music-style').value;
            let patternType = 'block_bass';
            const ALL_P = ['block_bass', 'fingerpick', 'jazz_comping', 'reggae_skank', 'bossa_nova', 'synth_pulse', 'metal_gallop'];
            
            if (currentMode === 'scale') {
                patternType = arrOverride === 'auto' ? 'block_bass' : (arrOverride === 'random' ? ALL_P[Math.floor(Math.random()*ALL_P.length)] : arrOverride);
                const voicings = ['triad', 'add9', 'seventh', 'sus2', 'sus4'];
                for (let i = 0; i < 4; i++) {
                    const degree = Math.floor(Math.random() * scaleIntervals.length);
                    const voicing = voicings[Math.floor(Math.random() * voicings.length)];
                    let rootMidiAbs = 48 + rootIdx + scaleIntervals[degree];
                    const intervals = buildAbsoluteVoicing(rootMidiAbs, voicing);
                    
                    let ledMidiNotes = applyVoiceLeading(intervals, previousNotes, 48);
                    previousNotes = [...ledMidiNotes];

                    let rootNoteAbs = ((rootIdx + scaleIntervals[degree]) % 12 + 12) % 12;
                    let bassNote = playBass ? (rootNoteAbs + 36) : null; 

                    progressionData.push({ chordName: NOTES[rootNoteAbs], midiNotes: ledMidiNotes, bassNote: bassNote, rootMidi: rootMidiAbs, functionLabel: `Grau ${degree+1}`, voicing, beats: 4 });
                }
            } else {
                const styleData = musicDatabase[styleId] || musicDatabase['pop_rock'];
                patternType = arrOverride === 'auto' ? 'auto' : (arrOverride === 'random' ? ALL_P[Math.floor(Math.random()*ALL_P.length)] : arrOverride);
                let degreesArray = [];
                let seqLength = 4; 

                if (styleData && styleData.progressions) {
                    let seedProg = styleData.progressions[Math.floor(Math.random() * styleData.progressions.length)];
                    while(degreesArray.length < seqLength) {
                         degreesArray = degreesArray.concat(seedProg);
                    }
                    degreesArray = degreesArray.slice(0, seqLength);
                }

                let isMinor = scaleType.includes('minor') || scaleType === 'dorian' || scaleType === 'phrygian';

                for (let i = 0; i < degreesArray.length; i++) {
                    const degree = degreesArray[i] % scaleIntervals.length;
                    let rootMidiAbs = 48 + rootIdx + scaleIntervals[degree];
                    let chordQuality = 'triad';

                    if (styleId === 'jazz_functional' || styleId === 'latin_bossa') {
                        if (degree === 0) chordQuality = isMinor ? 'm9' : 'maj9';
                        else if (degree === 1) chordQuality = isMinor ? 'm7b5' : 'm9'; 
                        else if (degree === 3) chordQuality = isMinor ? 'm7' : 'maj9';
                        else if (degree === 4) chordQuality = isMinor ? 'dom7b9' : 'dom13'; 
                        else if (degree === 5) chordQuality = 'm9';
                        else if (degree === 6) chordQuality = 'dim7';
                        else chordQuality = 'm7';
                    }
                    else if (styleId === 'hiphop_trap') chordQuality = [0, 1, 3, 5].includes(degree) ? 'm9' : 'minor';
                    else if (styleId === 'electronic_modern') chordQuality = [0, 3, 4, 5].includes(degree) ? 'sus2' : 'power';
                    else if (styleId === 'reggae_dub') chordQuality = [0, 3, 4].includes(degree) ? (isMinor ? 'm7' : 'maj7') : 'minor';
                    else if (styleId === 'metal_rock') chordQuality = 'power';
                    else {
                        let third = (scaleIntervals[(degree+2)%7] - scaleIntervals[degree] + 12) % 12;
                        chordQuality = (third === 3) ? 'minor' : 'triad';
                        if (Math.random() > 0.5) chordQuality = (third === 3) ? 'm7' : 'maj7';
                    }

                    const intervals = buildAbsoluteVoicing(rootMidiAbs, chordQuality);
                    
                    let ledMidiNotes = applyVoiceLeading(intervals, previousNotes, 48);
                    previousNotes = [...ledMidiNotes];

                    let rootNoteAbs = ((rootIdx + scaleIntervals[degree]) % 12 + 12) % 12;
                    let chordName = NOTES[rootNoteAbs];
                    
                    if (chordQuality.includes('sus')) chordName += 'sus2';
                    if (chordQuality === 'power') chordName += '5';
                    if (chordQuality === 'dom7') chordName += '7';
                    if (chordQuality === 'm7') chordName += 'm7';
                    if (chordQuality === 'maj9') chordName += 'maj9';
                    if (chordQuality === 'm9') chordName += 'm9';
                    if (chordQuality === 'dom9') chordName += '9';
                    if (chordQuality === 'dom7b9') chordName += '7b9';
                    if (chordQuality === 'dom13') chordName += '13';
                    if (chordQuality === 'm7b5') chordName += 'm7b5';
                    if (chordQuality === 'dim7') chordName += 'dim';

                    let bassNote = playBass ? (rootNoteAbs + 36) : null;

                    progressionData.push({ chordName, midiNotes: ledMidiNotes, bassNote: bassNote, rootMidi: rootMidiAbs, functionLabel: `Grau ${degree+1}`, voicing: chordQuality, beats: 4 });
                }
            }

            const state = { progressionData, patternType, styleId, rootIdx, scaleIntervals, keySigString: getVexFlowKeySignature(rootIdx, scaleType), baseOctaveMidi, bpmValue, playBass, playMelody };
            historyIndex++;
            progressionHistory = progressionHistory.slice(0, historyIndex);
            progressionHistory.push(state);
            executeState(state);
        }

        async function playPrevious() {
            if (Tone.context.state !== 'running') await Tone.start();
            if (historyIndex > 0) { historyIndex--; executeState(progressionHistory[historyIndex]); }
        }

        async function repeatCurrent() {
            if (Tone.context.state !== 'running') await Tone.start();
            if (historyIndex >= 0) executeState(progressionHistory[historyIndex]);
        }

        function executeState(state) {
            stopPlayback();
            setButtonsState(true);
            
            document.getElementById('bpm-control').value = state.bpmValue;
            document.getElementById('bass-control').value = state.playBass ? "on" : "off";
            document.getElementById('melody-control').value = state.playMelody ? "on" : "off";
            document.getElementById('octave-select').value = state.baseOctaveMidi;
            document.getElementById('arrangement-pattern').value = state.patternType;
            if(state.styleId) document.getElementById('music-style').value = state.styleId;
            
            const container = document.getElementById('progression-display');
            container.innerHTML = '';
            
            renderScore(state.progressionData, state.keySigString);

            state.progressionData.forEach((data, i) => {
                const box = document.createElement('div');
                box.className = 'chord-box';
                box.id = `chord-box-${i}`;
                box.innerHTML = `
                    <div class="chord-duration">1 Compasso</div>
                    <div class="chord-name">${data.chordName}</div>
                    <div class="chord-voicing">${data.voicing}</div>
                    <div class="chord-function">${data.functionLabel}</div>
                `;
                container.appendChild(box);
            });

            const schedule = generateScheduledNotes(state.progressionData, state.styleId, state.patternType, state.playBass, state.playMelody);
            const beatToSeconds = 60 / state.bpmValue;

            schedule.notes.forEach(noteData => {
                const freq = Tone.Frequency(noteData.midi, "midi").toNote();
                const delaySecs = noteData.timeOffset * beatToSeconds;
                const durSecs = noteData.duration * beatToSeconds;
                
                playTimeouts.push(setTimeout(() => {
                    sampler.triggerAttackRelease(freq, durSecs, Tone.now(), noteData.velocity / 127);
                    const keyEl = document.getElementById(`note-${noteData.midi}`);
                    if(keyEl) keyEl.classList.add('active');
                }, delaySecs * 1000));
                
                playTimeouts.push(setTimeout(() => {
                    const keyEl = document.getElementById(`note-${noteData.midi}`);
                    if(keyEl) keyEl.classList.remove('active');
                }, (delaySecs + durSecs) * 1000));
            });

            let cumulativeBeats = 0;
            state.progressionData.forEach((chord, index) => {
                const delaySecs = cumulativeBeats * beatToSeconds;
                playTimeouts.push(setTimeout(() => {
                    document.querySelectorAll('.chord-box').forEach(b => b.classList.remove('playing'));
                    document.getElementById(`chord-box-${index}`).classList.add('playing');
                }, delaySecs * 1000));
                cumulativeBeats += chord.beats;
            });
            
            playTimeouts.push(setTimeout(() => {
                document.querySelectorAll('.chord-box').forEach(b => b.classList.remove('playing'));
                setButtonsState(false);
            }, schedule.totalBeats * beatToSeconds * 1000));

            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            const blob = createMidiBlob(schedule.notes, schedule.totalBeats, state.bpmValue);
            currentBlobUrl = URL.createObjectURL(blob);
            const fileString = state.progressionData.map(d => d.chordName.replace(/#/g, 's')).join('-');
            const finalFileName = `Progressao_${state.patternType}_${fileString}.mid`;
            
            const exportZone = document.getElementById('export-zone');
            exportZone.style.display = 'flex';
            
            const dragPad = document.getElementById('drag-pad');
            dragPad.setAttribute('data-downloadurl', `audio/midi:${finalFileName}:${currentBlobUrl}`);

            const downloadBtn = document.getElementById('btn-download-midi');
            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = currentBlobUrl;
                a.download = finalFileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
        }

        document.getElementById('drag-pad').addEventListener('dragstart', function(e) {
            const url = this.getAttribute('data-downloadurl');
            if (url) e.dataTransfer.setData('DownloadURL', url);
        });
    </script>
