<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACORDES, PROGRESSÕES E PARTITURAS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    
    <style>
        :root {
            --bg: #09090b; --surface: #18181b; --border: #27272a; 
            --text: #f4f4f5; --text-muted: #a1a1aa;
            --accent: #6366f1; --accent-hover: #4f46e5; 
            --key-white: #f8fafc; --key-black: #0f172a;
            --active-white: #c7d2fe; --active-black: #6366f1;
            --chord-bg: #1e1b4b;
        }

        * { box-sizing: border-box; }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px 10px; background: var(--bg); color: var(--text); margin: 0; }
        h1 { font-size: clamp(20px, 4vw, 26px); font-weight: 800; margin-bottom: 20px; color: #fff; letter-spacing: -0.5px;}

        .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 8px; flex-wrap: wrap; }
        .tab-btn { background: var(--surface); color: var(--text-muted); padding: 12px 16px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; flex: 1 1 140px; max-width: 200px; }
        .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .controls { background: var(--surface); padding: 20px; border-radius: 12px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 12px; border: 1px solid var(--border); margin-bottom: 25px; max-width: 950px; margin-left: auto; margin-right: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .control-group { display: flex; flex-direction: column; text-align: left; gap: 5px; flex: 1 1 140px; min-width: 130px; }
        .control-group label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px;}
        select { padding: 12px; font-size: 13px; border-radius: 8px; border: 1px solid var(--border); outline: none; background: var(--bg); color: var(--text); cursor: pointer; transition: all 0.2s; width: 100%; font-weight: 500;}
        select:hover { border-color: var(--accent); }

        .playback-controls { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
        .playback-controls button { flex: 1 1 120px; max-width: 250px; font-weight: bold; padding: 14px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s;}
        
        button.primary-btn { background: var(--accent); color: #fff;}
        button.primary-btn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);}
        button.secondary-btn { background: var(--surface); color: var(--text); border: 1px solid var(--accent); }
        button.secondary-btn:hover:not(:disabled) { background: rgba(99, 102, 241, 0.2); transform: translateY(-2px); }
        button:disabled { background: var(--border); border-color: var(--border); color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none;}

        .progression-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; min-height: 100px; flex-wrap: wrap;}
        .chord-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 130px; padding: 20px 5px; transition: all 0.2s; position: relative;}
        .chord-box.playing { background: var(--chord-bg); border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);}
        .chord-name { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-top: 5px;}
        .chord-voicing { font-size: 11px; color: var(--text-muted); margin-top: 5px; }
        .chord-duration { position: absolute; top: 8px; right: 8px; font-size: 10px; color: var(--accent); font-weight: bold;}
        .chord-function { font-size: 12px; color: var(--accent); font-weight: 700; margin-top: 8px; }

        .score-header { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        #score-container { margin: 0 auto 25px auto; width: 100%; max-width: 800px; overflow-x: auto; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); padding: 10px 0;}
        #score svg path, #score svg rect { stroke: #d4d4d8; fill: #d4d4d8; }
        #score svg text { fill: #f4f4f5; font-family: 'Segoe UI', sans-serif !important; stroke: none;}

        #scale-display { margin: 15px auto 25px auto; display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; max-width: 800px; padding: 12px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border);}
        .scale-note-pill { padding: 4px 10px; border-radius: 15px; font-weight: 700; font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);}

        .piano-wrapper { width: 100%; max-width: 1000px; margin: 0 auto; overflow-x: auto; padding-bottom: 15px; background: #000; border-radius: 8px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        #piano { position: relative; height: 120px; width: 1260px; margin: 0 auto; }
        .key { position: absolute; top: 0; border-radius: 0 0 4px 4px; transition: background 0.1s; box-sizing: border-box; }
        .key.white { width: 36px; height: 120px; background: var(--key-white); z-index: 1; border: 1px solid #ccc; }
        .key.black { width: 22px; height: 75px; background: var(--key-black); z-index: 2; border: 1px solid #000;}
        .key.white.active { background: var(--active-white); border-color: var(--accent); z-index: 3;}
        .key.black.active { background: var(--active-black); z-index: 4;}

        #drag-pad { display: none; margin: 20px auto; padding: 15px 30px; width: fit-content; background: rgba(99, 102, 241, 0.1); border: 1px dashed var(--accent); border-radius: 8px; color: var(--text); font-size: 14px; font-weight: 600; cursor: grab; transition: 0.2s;}
        #drag-pad:hover { background: rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body>
    <h1>ACORDES E PARTITURAS</h1>

    <div class="tabs">
        <button class="tab-btn active" id="tab-scale" onclick="switchMode('scale')">Escala Livre</button>
        <button class="tab-btn" id="tab-style" onclick="switchMode('style')">Composição por Estilo</button>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <label>Tônica</label>
            <select id="root-note">
                <option value="0">C</option><option value="1">C# / Db</option><option value="2">D</option>
                <option value="3">D# / Eb</option><option value="4">E</option><option value="5">F</option>
                <option value="6">F# / Gb</option><option value="7">G</option><option value="8">G# / Ab</option>
                <option value="9">A</option><option value="10">A# / Bb</option><option value="11">B</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Escala / Modo</label>
            <select id="scale-type">
                <optgroup label="Tradicionais">
                    <option value="major">Maior (Jônio)</option>
                    <option value="minor" selected>Menor (Eólio)</option>
                    <option value="harmonic_minor">Menor Harmônica</option>
                    <option value="melodic_minor">Menor Melódica</option>
                </optgroup>
                <optgroup label="Modos Gregos">
                    <option value="dorian">Dórico</option>
                    <option value="phrygian">Frígio</option>
                    <option value="lydian">Lídio</option>
                    <option value="mixolydian">Mixolídio</option>
                    <option value="locrian">Lócrio</option>
                </optgroup>
            </select>
        </div>

        <div class="control-group" id="group-style" style="display: none;">
            <label>Harmonia (Acordes)</label>
            <select id="music-style">
                <option value="random">🎲 Surpresa (Aleatório)</option>
                <option value="pop">Pop Mainstream</option>
                <option value="acoustic_blues">Acoustic & Blues</option>
                <option value="alt_emo">Alt Rock & Emo</option>
                <option value="hiphop_trap">Hip-Hop & Trap</option>
                <option value="rnb_jazz">R&B, Soul & Jazz</option>
                <option value="edm_house">EDM & House</option>
            </select>
        </div>

        <div class="control-group">
            <label>Arranjo (Como Tocar)</label>
            <select id="arrangement-pattern">
                <option value="auto">Auto (Estilo Base)</option>
                <option value="block_bass">Blocos (Mínimas/Semibreves)</option>
                <option value="fingerpick">Dedilhado (Colcheias)</option>
                <option value="fast_pluck">Pluck (Semicolcheias)</option>
                <option value="syncopated">Sincopado (Trap/R&B)</option>
                <option value="roll_arpeggio">Arpejo Longo (Soul)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Oitava Base</label>
            <select id="octave-select">
                <option value="36">Oitava 2</option>
                <option value="48" selected>Oitava 3</option>
                <option value="60">Oitava 4</option>
            </select>
        </div>

        <div class="playback-controls">
            <button id="btn-prev" class="secondary-btn" onclick="playPrevious()" disabled>Anterior</button>
            <button id="btn-generate" class="primary-btn" onclick="generateNew()" disabled>Gerar Sequência 🎲</button>
            <button id="btn-repeat" class="secondary-btn" onclick="repeatCurrent()" disabled>Repetir</button>
        </div>
    </div>

    <!-- UI -->
    <div class="score-header">Leitura Harmônica (Base)</div>
    <div id="score-container"><div id="score"></div></div>
    
    <div class="progression-container" id="progression-display"></div>
    <div class="piano-wrapper"><div id="piano"></div></div>
    <div id="scale-display"></div>
    <div id="drag-pad" draggable="true" title="Arraste para a Timeline">↓ Arraste o MIDI para a sua DAW</div>

    <script>
        const VF = Vex.Flow;
        const NOTES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
        const VEX_KEYS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const ACC_MAP = ['', '#', '', 'b', '', '', '#', '', 'b', '', 'b', ''];
        const NOTE_COLORS = ["#ef4444", "#f97316", "#f59e0b", "#eab308", "#84cc16", "#22c55e", "#10b981", "#06b6d4", "#3b82f6", "#6366f1", "#a855f7", "#ec4899"];

        const SCALES = {
            'major':          [0, 2, 4, 5, 7, 9, 11],
            'minor':          [0, 2, 3, 5, 7, 8, 10],
            'harmonic_minor': [0, 2, 3, 5, 7, 8, 11],
            'melodic_minor':  [0, 2, 3, 5, 7, 9, 11],
            'dorian':         [0, 2, 3, 5, 7, 9, 10],
            'phrygian':       [0, 1, 3, 5, 7, 8, 10],
            'lydian':         [0, 2, 4, 6, 7, 9, 11],
            'mixolydian':     [0, 2, 4, 5, 7, 9, 10],
            'locrian':        [0, 1, 3, 5, 6, 8, 10]
        };

        // BANCO DE DADOS MACIÇO (Para acabar com a repetição)
        const STYLES_CONFIG = {
            'pop': {
                pattern: 'block_bass',
                templates: [
                    { degrees: [0, 4, 5, 3], voicings: ['add9', 'triad', 'seventh', 'sus2'], beats: [4, 4, 2, 2], labels: ["I", "V", "vi", "IV"] },
                    { degrees: [5, 3, 0, 4], voicings: ['seventh', 'add9', 'add9', 'triad'], beats: [2, 2, 2, 2], labels: ["vi", "IV", "I", "V"] },
                    { degrees: [0, 5, 3, 4], voicings: ['triad', 'm9', 'sus2', 'seventh'], beats: [2, 2, 2, 2], labels: ["I", "vi", "IV", "V"] },
                    { degrees: [3, 0, 4, 5], voicings: ['add9', 'triad', 'sus4', 'm9'], beats: [2, 2, 2, 2], labels: ["IV", "I", "V", "vi"] },
                    { degrees: [0, 3, 0, 4], voicings: ['triad', 'sus2', 'add9', 'seventh'], beats: [4, 2, 2, 4], labels: ["I", "IV", "I", "V"] },
                    { degrees: [1, 4, 0, 5], voicings: ['m9', 'triad', 'add9', 'seventh'], beats: [2, 2, 4, 4], labels: ["ii", "V", "I", "vi"] },
                    { degrees: [0, 5, 1, 4], voicings: ['add9', 'm9', 'm9', 'sus4'], beats: [2, 2, 2, 2], labels: ["I", "vi", "ii", "V"] },
                    { degrees: [3, 4, 5, 5], voicings: ['sus2', 'triad', 'm9', 'seventh'], beats: [2, 2, 2, 2], labels: ["IV", "V", "vi", "vi"] },
                    { degrees: [5, 0, 4, 4], voicings: ['m9', 'add9', 'triad', 'sus4'], beats: [2, 2, 2, 2], labels: ["vi", "I", "V", "V"] }
                ]
            },
            'acoustic_blues': {
                pattern: 'fingerpick',
                templates: [
                    { degrees: [0, 5, 3, 4], voicings: ['add9', 'm9', 'add9', 'sus4'], beats: [2, 2, 2, 2], labels: ["I", "vi", "IV", "V"] },
                    { degrees: [0, 3, 0, 4], voicings: ['seventh', 'seventh', 'seventh', 'seventh'], beats: [2, 2, 2, 2], labels: ["I7", "IV7", "I7", "V7"] },
                    { degrees: [3, 2, 1, 0], voicings: ['add9', 'm9', 'm9', 'add9'], beats: [2, 2, 2, 2], labels: ["IV", "iii", "ii", "I"] },
                    { degrees: [0, 2, 3, 4], voicings: ['add9', 'm9', 'sus2', 'seventh'], beats: [2, 2, 2, 2], labels: ["I", "iii", "IV", "V"] },
                    { degrees: [5, 4, 3, 3], voicings: ['m9', 'triad', 'add9', 'sus2'], beats: [2, 2, 2, 2], labels: ["vi", "V", "IV", "IV"] }
                ]
            },
            'alt_emo': {
                pattern: 'block_bass',
                templates: [
                    { degrees: [5, 3, 0, 4], voicings: ['sus2', 'power', 'power', 'sus4'], beats: [4, 2, 2, 4], labels: ["vi", "IV", "I", "V"] },
                    { degrees: [0, 5, 3, 4], voicings: ['power', 'power', 'sus2', 'power'], beats: [2, 2, 2, 2], labels: ["I", "VI", "IV", "V"] },
                    { degrees: [5, 4, 0, 3], voicings: ['power', 'power', 'power', 'sus2'], beats: [2, 2, 4, 4], labels: ["vi", "V", "I", "IV"] },
                    { degrees: [0, 6, 3, 0], voicings: ['power', 'power', 'sus2', 'power'], beats: [2, 2, 2, 2], labels: ["I", "bVII", "IV", "I"] },
                    { degrees: [5, 0, 3, 4], voicings: ['sus2', 'power', 'power', 'power'], beats: [2, 2, 2, 2], labels: ["vi", "I", "IV", "V"] },
                    { degrees: [3, 5, 0, 4], voicings: ['sus2', 'power', 'power', 'power'], beats: [2, 2, 2, 2], labels: ["IV", "vi", "I", "V"] }
                ]
            },
            'hiphop_trap': { 
                pattern: 'syncopated',
                templates: [
                    { degrees: [0, 5, 4, 0], voicings: ['m9', 'seventh', 'seventh', 'm9'], beats: [4, 2, 2, 4], labels: ["i", "VI", "V7", "i"] },
                    { degrees: [0, 3, 4, 0], voicings: ['m9', 'm9', 'seventh', 'eleventh'], beats: [2, 2, 2, 2], labels: ["i", "iv", "V", "i"] },
                    { degrees: [0, 1, 0, 1], voicings: ['triad', 'triad', 'm9', 'm9'], beats: [2, 2, 2, 2], labels: ["i", "bII", "i", "bII"] },
                    { degrees: [5, 6, 0, 0], voicings: ['add9', 'add9', 'm9', 'm9'], beats: [2, 2, 2, 2], labels: ["VI", "VII", "i", "i"] },
                    { degrees: [0, 2, 5, 5], voicings: ['m9', 'm9', 'seventh', 'seventh'], beats: [2, 2, 2, 2], labels: ["i", "III", "VI", "VI"] },
                    { degrees: [0, 6, 5, 0], voicings: ['m9', 'seventh', 'seventh', 'm9'], beats: [2, 2, 2, 2], labels: ["i", "VII", "VI", "i"] },
                    { degrees: [0, 7, 0, 7], voicings: ['m9', 'seventh', 'm9', 'seventh'], beats: [4, 4, 4, 4], labels: ["i", "v", "i", "v"] }
                ]
            },
            'rnb_jazz': {
                pattern: 'roll_arpeggio',
                templates: [
                    { degrees: [1, 4, 0, 5], voicings: ['ninth', 'eleventh', 'ninth', 'seventh'], beats: [2, 2, 4, 4], labels: ["ii9", "V11", "Imaj9", "VI7"] },
                    { degrees: [0, 5, 1, 4], voicings: ['ninth', 'seventh', 'ninth', 'eleventh'], beats: [2, 2, 2, 2], labels: ["Imaj9", "vi7", "ii9", "V11"] },
                    { degrees: [3, 4, 2, 5], voicings: ['ninth', 'eleventh', 'm9', 'seventh'], beats: [2, 2, 2, 2], labels: ["IVmaj9", "V11", "iii7", "vi7"] },
                    { degrees: [0, 3, 2, 5], voicings: ['ninth', 'ninth', 'm9', 'seventh'], beats: [2, 2, 2, 2], labels: ["Imaj9", "IV9", "iii9", "vi7"] },
                    { degrees: [2, 5, 0, 0], voicings: ['m9', 'seventh', 'ninth', 'ninth'], beats: [2, 2, 4, 4], labels: ["iii7", "vi7", "Imaj9", "Imaj9"] },
                    { degrees: [1, 4, 2, 5], voicings: ['ninth', 'seventh', 'm9', 'seventh'], beats: [2, 2, 2, 2], labels: ["ii9", "V7", "iii7", "vi7"] },
                    { degrees: [1, 4, 0, 0], voicings: ['ninth', 'seventh', 'ninth', 'eleventh'], beats: [2, 2, 2, 2], labels: ["ii9", "V7", "Imaj9", "Imaj11"] }
                ]
            },
            'edm_house': {
                pattern: 'fast_pluck',
                templates: [
                    { degrees: [5, 3, 0, 4], voicings: ['sus2', 'triad', 'triad', 'sus4'], beats: [1, 1, 1, 1], labels: ["vi", "IV", "I", "V"] },
                    { degrees: [0, 5, 3, 4], voicings: ['power', 'sus2', 'triad', 'triad'], beats: [2, 2, 2, 2], labels: ["I", "vi", "IV", "V"] },
                    { degrees: [3, 0, 4, 5], voicings: ['sus2', 'triad', 'sus4', 'sus2'], beats: [1, 1, 1, 1], labels: ["IV", "I", "V", "vi"] },
                    { degrees: [5, 4, 3, 4], voicings: ['sus2', 'triad', 'sus2', 'triad'], beats: [2, 2, 2, 2], labels: ["vi", "V", "IV", "V"] },
                    { degrees: [1, 3, 0, 4], voicings: ['m9', 'add9', 'add9', 'sus4'], beats: [2, 2, 2, 2], labels: ["ii", "IV", "I", "V"] },
                    { degrees: [0, 3, 5, 4], voicings: ['sus2', 'sus2', 'triad', 'sus4'], beats: [2, 2, 2, 2], labels: ["I", "IV", "vi", "V"] }
                ]
            }
        };

        const ALL_PATTERNS = ['block_bass', 'fingerpick', 'fast_pluck', 'syncopated', 'roll_arpeggio'];

        let currentMode = 'scale'; 
        let currentBlobUrl = null;
        let playTimeouts = [];
        let progressionHistory = [];
        let historyIndex = -1;

        const sampler = new Tone.Sampler({
            urls: {
                "C3": "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3", "A3": "A3.mp3",
                "C4": "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", "A4": "A4.mp3"
            },
            release: 1.5,
            baseUrl: "https://tonejs.github.io/audio/salamander/",
            onload: () => {
                document.getElementById('btn-generate').disabled = false;
                buildPiano();
            }
        }).toDestination();
        sampler.volume.value = -3;

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');
            document.getElementById('group-style').style.display = mode === 'scale' ? 'none' : 'flex';
        }

        function buildPiano() {
            const piano = document.getElementById('piano');
            piano.innerHTML = ''; 
            const isBlack = [false, true, false, true, false, false, true, false, true, false, true, false];
            let whiteIndex = 0;
            for (let i = 36; i <= 96; i++) {
                const noteIdx = i % 12;
                const el = document.createElement('div');
                el.className = 'key ' + (isBlack[noteIdx] ? 'black' : 'white');
                el.id = 'note-' + i;
                if (!isBlack[noteIdx]) { el.style.left = `${whiteIndex * 36}px`; whiteIndex++; } 
                else { el.style.left = `${(whiteIndex * 36) - 11}px`; }
                piano.appendChild(el);
            }
        }

        function getVexFlowKeySignature(rootIdx, scaleType) {
            const offsets = { 'major': 0, 'minor': 3, 'harmonic_minor': 3, 'melodic_minor': 3, 'dorian': -2, 'phrygian': -4, 'lydian': -5, 'mixolydian': 5, 'locrian': 1 };
            let relMajorIdx = (rootIdx + offsets[scaleType] + 12) % 12;
            return VEX_KEYS[relMajorIdx];
        }

        function getDiatonicVoicing(scaleIntervals, rootDegree, voicingType) {
            const getInterval = (offset) => {
                const idx = (rootDegree + offset) % 7;
                const octave = Math.floor((rootDegree + offset) / 7);
                return scaleIntervals[idx] + (octave * 12);
            };
            const r = getInterval(0), s = getInterval(1), t = getInterval(2), f = getInterval(3), fi = getInterval(4), se = getInterval(6), n = getInterval(8), el = getInterval(10);
            switch(voicingType) {
                case 'power': return [r, fi, r + 12];
                case 'sus2': return [r, s, fi];
                case 'sus4': return [r, f, fi];
                case 'add9': return [r, t, fi, n];
                case 'seventh': return [r, t, fi, se];
                case 'ninth': return [r, t, fi, se, n];
                case 'eleventh': return [r, t, fi, se, n, el];
                case 'm9': return [r, t, fi, se, n]; // Treat standard extension contextually
                case 'triad': default: return [r, t, fi];
            }
        }

        function renderScale(rootIdx, scaleIntervals) {
            const container = document.getElementById('scale-display');
            container.innerHTML = `<span style="color:var(--text-muted); font-size: 11px; font-weight:bold; letter-spacing:0.5px; padding-top:4px;">ESCALA ATIVA:</span>`;
            scaleIntervals.forEach(interv => {
                const absNote = (rootIdx + interv) % 12;
                const pill = document.createElement('div');
                pill.className = 'scale-note-pill';
                pill.style.backgroundColor = NOTE_COLORS[absNote];
                pill.innerText = NOTES[absNote];
                container.appendChild(pill);
            });
        }

        // --- PARTITURA BLOCO LIMPO ---
        function renderScore(progressionData, keySignatureString) {
            const div = document.getElementById("score");
            div.innerHTML = ""; 
            const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
            renderer.resize(780, 240);
            const context = renderer.getContext();
            
            const topStave = new VF.Stave(30, 20, 710).addClef("treble").addKeySignature(keySignatureString).setContext(context).draw();
            const bottomStave = new VF.Stave(30, 110, 710).addClef("bass").addKeySignature(keySignatureString).setContext(context).draw();

            new VF.StaveConnector(topStave, bottomStave).setType(VF.StaveConnector.type.BRACE).setContext(context).draw();
            new VF.StaveConnector(topStave, bottomStave).setType(VF.StaveConnector.type.SINGLE_LEFT).setContext(context).draw();

            let trebleNotes = [], bassNotes = [];
            const keysMap = ['c', 'c', 'd', 'e', 'e', 'f', 'f', 'g', 'a', 'a', 'b', 'b'];

            progressionData.forEach(chord => {
                let tKeys = [], bKeys = [], tAcc = [], bAcc = [];
                let tColors = [], bColors = [];

                chord.midiNotes.forEach(m => {
                    const noteIdx = m % 12;
                    const oct = Math.floor(m / 12) - 1;
                    const key = `${keysMap[noteIdx]}/${oct}`;
                    const color = NOTE_COLORS[noteIdx];

                    if (m >= 60) {
                        tKeys.push(key); tColors.push(color);
                        if (ACC_MAP[noteIdx]) tAcc.push({ index: tKeys.length - 1, type: ACC_MAP[noteIdx], color });
                    } else {
                        bKeys.push(key); bColors.push(color);
                        if (ACC_MAP[noteIdx]) bAcc.push({ index: bKeys.length - 1, type: ACC_MAP[noteIdx], color });
                    }
                });

                // Duração baseada nos Beats da Harmonia
                const bDur = chord.beats >= 4 ? "w" : chord.beats === 2 ? "h" : "q";

                // Clave de Sol
                if (tKeys.length === 0) { 
                    trebleNotes.push(new VF.StaveNote({ keys: ["b/4"], duration: bDur+"r", clef: "treble" })); 
                } else {
                    let tn = new VF.StaveNote({ keys: tKeys, duration: bDur, clef: "treble" });
                    tAcc.forEach(a => { let acc = new VF.Accidental(a.type); acc.setStyle({fillStyle: a.color, strokeStyle: a.color}); tn.addModifier(acc, a.index); });
                    tn.keyProps.forEach((_, idx) => tn.setKeyStyle(idx, { fillStyle: tColors[idx], strokeStyle: tColors[idx] }));
                    trebleNotes.push(tn);
                }

                // Clave de Fá
                if (bKeys.length === 0) { 
                    bassNotes.push(new VF.StaveNote({ keys: ["d/3"], duration: bDur+"r", clef: "bass" })); 
                } else {
                    let bn = new VF.StaveNote({ keys: bKeys, duration: bDur, clef: "bass" });
                    bAcc.forEach(a => { let acc = new VF.Accidental(a.type); acc.setStyle({fillStyle: a.color, strokeStyle: a.color}); bn.addModifier(acc, a.index); });
                    bn.keyProps.forEach((_, idx) => bn.setKeyStyle(idx, { fillStyle: bColors[idx], strokeStyle: bColors[idx] }));
                    bassNotes.push(bn);
                }
            });

            const trebleVoice = new VF.Voice({ num_beats: 32, beat_value: 4 }).setStrict(false);
            const bassVoice = new VF.Voice({ num_beats: 32, beat_value: 4 }).setStrict(false);
            trebleVoice.addTickables(trebleNotes); bassVoice.addTickables(bassNotes);

            new VF.Formatter().joinVoices([trebleVoice]).joinVoices([bassVoice]).format([trebleVoice, bassVoice], 600);
            trebleVoice.draw(context, topStave); bassVoice.draw(context, bottomStave);
        }

        // MOTOR DE ÁUDIO/MIDI
        function generateScheduledNotes(progressionData, patternType) {
            let scheduledNotes = []; 
            let currentBeat = 0;

            progressionData.forEach(chord => {
                const chordDuration = chord.beats;
                const notes = chord.midiNotes.sort((a,b) => a-b);
                const bassNote = notes[0] - 12; 

                if (patternType === 'block_bass' || patternType === 'none') {
                    scheduledNotes.push({ midi: bassNote, timeOffset: currentBeat, duration: chordDuration, velocity: 90 });
                    notes.forEach((n, i) => { scheduledNotes.push({ midi: n, timeOffset: currentBeat + (i * 0.03), duration: chordDuration, velocity: 75 }); });
                } 
                else if (patternType === 'fingerpick') {
                    let step = 0;
                    while (step < chordDuration) {
                        const noteToPlay = step === 0 ? bassNote : notes[Math.floor(step * 2) % notes.length];
                        scheduledNotes.push({ midi: noteToPlay, timeOffset: currentBeat + step, duration: 1.0, velocity: 80 });
                        step += 0.5; 
                    }
                }
                else if (patternType === 'syncopated') {
                    scheduledNotes.push({ midi: bassNote, timeOffset: currentBeat, duration: chordDuration, velocity: 95 });
                    for(let b=0; b < chordDuration; b+=2) {
                        notes.forEach(n => scheduledNotes.push({ midi: n, timeOffset: currentBeat+b, duration: 1.5, velocity: 70 }));
                        if(chordDuration >= 2) notes.forEach(n => scheduledNotes.push({ midi: n, timeOffset: currentBeat + b + 1.5, duration: 1.0, velocity: 80 }));
                    }
                }
                else if (patternType === 'fast_pluck') {
                    let step = 0;
                    scheduledNotes.push({ midi: bassNote, timeOffset: currentBeat, duration: chordDuration, velocity: 90 });
                    while (step < chordDuration) {
                        const n = notes[Math.floor(step * 4) % notes.length];
                        scheduledNotes.push({ midi: n, timeOffset: currentBeat + step, duration: 0.25, velocity: 85 });
                        step += 0.25;
                    }
                }
                else if (patternType === 'roll_arpeggio') {
                    scheduledNotes.push({ midi: bassNote, timeOffset: currentBeat, duration: chordDuration, velocity: 85 });
                    notes.forEach((n, i) => {
                        scheduledNotes.push({ midi: n, timeOffset: currentBeat + (i * 0.1), duration: chordDuration - (i * 0.1), velocity: 70 });
                    });
                }
                currentBeat += chordDuration;
            });
            return { notes: scheduledNotes, totalBeats: currentBeat };
        }

        function createMidiBlob(scheduledNotesArr, totalBeats) {
            const track = [];
            track.push(0x00, 0xFF, 0x51, 0x03, 0x07, 0xA1, 0x20); 

            function vlq(n) {
                if (n === 0) return [0]; let res = [];
                while (n > 0) { res.unshift(n & 0x7F); n >>= 7; }
                for (let i = 0; i < res.length - 1; i++) res[i] |= 0x80;
                return res;
            }

            let events = [];
            scheduledNotesArr.forEach(n => {
                events.push({ type: 0x90, midi: n.midi, ticks: Math.round(n.timeOffset * 480), velocity: n.velocity });
                events.push({ type: 0x80, midi: n.midi, ticks: Math.round((n.timeOffset + n.duration) * 480), velocity: 0 });
            });
            events.sort((a,b) => a.ticks - b.ticks);

            let lastTicks = 0;
            events.forEach(e => {
                const delta = e.ticks - lastTicks;
                track.push(...vlq(delta)); track.push(e.type, e.midi, e.velocity); lastTicks = e.ticks;
            });

            const endDelta = Math.max(0, (totalBeats * 480) - lastTicks);
            track.push(...vlq(endDelta)); track.push(0xFF, 0x2F, 0x00);
            
            const header = [0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x01, 0xE0];
            const mtrk = [0x4D, 0x54, 0x72, 0x6B];
            const len = track.length;
            mtrk.push((len >> 24) & 0xFF, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF);
            
            const midiBytes = new Uint8Array(header.length + mtrk.length + track.length);
            midiBytes.set(header, 0); midiBytes.set(mtrk, header.length); midiBytes.set(track, header.length + mtrk.length);
            return new Blob([midiBytes], { type: 'audio/midi' });
        }

        function updateHistoryButtons() {
            document.getElementById('btn-prev').disabled = historyIndex <= 0;
            document.getElementById('btn-repeat').disabled = historyIndex < 0;
            document.getElementById('btn-generate').disabled = false;
        }

        async function generateNew() {
            if (Tone.context.state !== 'running') await Tone.start();
            document.getElementById('btn-generate').disabled = true;

            const rootIdx = parseInt(document.getElementById('root-note').value);
            const scaleType = document.getElementById('scale-type').value;
            const baseOctaveMidi = parseInt(document.getElementById('octave-select').value);
            const rhythmOverride = document.getElementById('rhythm-control').value;
            const scaleIntervals = SCALES[scaleType];
            
            const progressionData = [];
            let patternType = 'block_bass';

            if (currentMode === 'scale') {
                const voicings = ['triad', 'add9', 'seventh', 'ninth', 'sus2', 'power'];
                const numChords = Math.random() > 0.4 ? 4 : (Math.random() > 0.5 ? 3 : 5); 
                
                // Escolhe um padrão aleatório se não houver
                patternType = ALL_PATTERNS[Math.floor(Math.random()*ALL_PATTERNS.length)];

                for (let i = 0; i < numChords; i++) {
                    const degree = Math.floor(Math.random() * 7);
                    const voicing = voicings[Math.floor(Math.random() * voicings.length)];
                    const intervals = getDiatonicVoicing(scaleIntervals, degree, voicing);
                    
                    let beats = 4;
                    if (['fingerpick', 'fast_pluck'].includes(patternType)) beats = 2;
                    else if (patternType === 'syncopated') beats = 4;
                    else beats = (Math.random() > 0.6 ? 4 : 2);
                    
                    const rootName = NOTES[(rootIdx + intervals[0]) % 12];
                    const midiNotes = intervals.map(interv => baseOctaveMidi + rootIdx + interv);
                    progressionData.push({ chordName: rootName, midiNotes, functionLabel: `Grau ${degree+1}`, voicing, beats });
                }
            } else {
                let styleId = document.getElementById('music-style').value;
                if (styleId === 'random') {
                    const keys = Object.keys(STYLES_CONFIG);
                    styleId = keys[Math.floor(Math.random() * keys.length)];
                }
                
                const config = STYLES_CONFIG[styleId];
                patternType = rhythmOverride === 'auto' ? config.pattern : 'block_bass'; 
                
                // Pega template aleatório da lista ampliada
                const template = config.templates[Math.floor(Math.random() * config.templates.length)];

                for (let i = 0; i < template.degrees.length; i++) {
                    const degree = template.degrees[i];
                    const voicing = template.voicings[i];
                    const intervals = getDiatonicVoicing(scaleIntervals, degree, voicing);
                    
                    let beats = template.beats[i];
                    
                    let chordName = NOTES[(rootIdx + intervals[0]) % 12];
                    if (voicing === 'power') chordName += '5';
                    if (voicing === 'sus2') chordName += 'sus2';

                    const midiNotes = intervals.map(interv => baseOctaveMidi + rootIdx + interv);
                    progressionData.push({ chordName, midiNotes, functionLabel: template.labels[i], voicing, beats });
                }
            }

            const state = {
                progressionData, patternType, rootIdx, scaleIntervals,
                keySigString: getVexFlowKeySignature(rootIdx, scaleType)
            };

            historyIndex++;
            progressionHistory = progressionHistory.slice(0, historyIndex);
            progressionHistory.push(state);

            executeState(state);
            updateHistoryButtons();
        }

        function playPrevious() {
            if (historyIndex > 0) { historyIndex--; executeState(progressionHistory[historyIndex]); updateHistoryButtons(); }
        }

        function repeatCurrent() {
            if (historyIndex >= 0) executeState(progressionHistory[historyIndex]);
        }

        function executeState(state) {
            playTimeouts.forEach(clearTimeout); playTimeouts = [];
            document.querySelectorAll('.key').forEach(k => k.classList.remove('active'));

            const container = document.getElementById('progression-display');
            container.innerHTML = '';

            renderScale(state.rootIdx, state.scaleIntervals);
            renderScore(state.progressionData, state.keySigString);

            state.progressionData.forEach((data, i) => {
                const durText = data.beats === 4 ? 'Semibreve (4T)' : data.beats === 2 ? 'Mínima (2T)' : 'Semínima (1T)';
                const box = document.createElement('div');
                box.className = 'chord-box';
                box.id = `chord-box-${i}`;
                box.innerHTML = `
                    <div class="chord-duration">${durText}</div>
                    <div class="chord-name">${data.chordName}</div>
                    <div class="chord-voicing">${data.voicing}</div>
                    <div class="chord-function">${data.functionLabel}</div>
                `;
                container.appendChild(box);
            });

            const schedule = generateScheduledNotes(state.progressionData, state.patternType);
            const now = Tone.now();
            const beatToSeconds = 0.5; // 120 BPM

            schedule.notes.forEach(noteData => {
                const freq = Tone.Frequency(noteData.midi, "midi").toNote();
                const time = now + (noteData.timeOffset * beatToSeconds);
                const dur = noteData.duration * beatToSeconds;
                sampler.triggerAttackRelease(freq, dur, time, noteData.velocity / 127);
                
                playTimeouts.push(setTimeout(() => {
                    const keyEl = document.getElementById(`note-${noteData.midi}`);
                    if(keyEl) keyEl.classList.add('active');
                }, noteData.timeOffset * beatToSeconds * 1000));
                
                playTimeouts.push(setTimeout(() => {
                    const keyEl = document.getElementById(`note-${noteData.midi}`);
                    if(keyEl) keyEl.classList.remove('active');
                }, (noteData.timeOffset + noteData.duration) * beatToSeconds * 1000));
            });

            let cumulativeBeats = 0;
            state.progressionData.forEach((chord, index) => {
                const delayMs = cumulativeBeats * beatToSeconds * 1000;
                playTimeouts.push(setTimeout(() => {
                    document.querySelectorAll('.chord-box').forEach(b => b.classList.remove('playing'));
                    document.getElementById(`chord-box-${index}`).classList.add('playing');
                }, delayMs));
                cumulativeBeats += chord.beats;
            });
            
            playTimeouts.push(setTimeout(() => {
                document.querySelectorAll('.chord-box').forEach(b => b.classList.remove('playing'));
                document.getElementById('btn-generate').disabled = false;
            }, schedule.totalBeats * beatToSeconds * 1000));

            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            const blob = createMidiBlob(schedule.notes, schedule.totalBeats);
            currentBlobUrl = URL.createObjectURL(blob);
            const fileString = state.progressionData.map(d => d.chordName.replace(/#/g, 's')).join('-');
            
            const dragPad = document.getElementById('drag-pad');
            dragPad.style.display = 'block';
            dragPad.setAttribute('data-downloadurl', `audio/midi:Progressao_${fileString}.mid:${currentBlobUrl}`);
        }

        document.getElementById('drag-pad').addEventListener('dragstart', function(e) {
            const url = this.getAttribute('data-downloadurl');
            if (url) e.dataTransfer.setData('DownloadURL', url);
        });
    </script>
