<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midi Wizard v2 - Acordes, Progressões e Partituras</title>
    <!-- VexFlow para renderização de partituras -->
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <!-- Tone.js para síntese de áudio e engine MIDI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-base: #0b0b0e;
            --card-bg: #141419;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f0f0f5;
            --text-muted: #828299;
            --border: #2a2a36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .controls-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px 20px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            align-items: end;
        }

        @media (max-width: 768px) {
            .controls-panel {
                grid-template-columns: 1fr 1fr;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        select {
            background: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-generate {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            grid-column: 1 / -1;
            transition: background 0.2s;
        }

        .btn-generate:hover {
            background: var(--accent-hover);
        }

        .sheet-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            overflow-x: auto;
        }

        .chords-display {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        @media (max-width: 600px) {
            .chords-display {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .chord-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chord-card .name {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .chord-card .extension {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .chord-card.roman {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: bold;
            margin-top: 4px;
        }

        /* Piano / Teclado Virtual */
        .piano-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        .piano {
            display: flex;
            position: relative;
            height: 110px;
        }

        .key {
            position: relative;
            cursor: pointer;
            border-radius: 0 0 4px 4px;
            transition: background 0.1s;
        }

        .key.white {
            width: 32px;
            height: 110px;
            background: #f0f0f5;
            border: 1px solid #ccc;
            z-index: 1;
        }

        .key.white:active, .key.white.active {
            background: #d1d1d6;
        }

        .key.black {
            width: 20px;
            height: 65px;
            background: #18181b;
            position: absolute;
            z-index: 2;
            margin-left: -10px;
            border-radius: 0 0 3px 3px;
        }

        .key.black:active, .key.black.active {
            background: #3f3f46;
        }

        .scale-pills {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
        }

        .action-footer {
            text-align: center;
        }

        .btn-midi-export {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .btn-midi-export:hover {
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>ACORDES, PROGRESSÕES E PARTITURAS</header>

        <div class="mode-tabs">
            <button class="tab-btn" onclick="setMode('libre')">Escala Livre</button>
            <button class="tab-btn active" onclick="setMode('style')">Arranjo por Estilo</button>
        </div>

        <!-- Painel de Controles -->
        <div class="controls-panel">
            <div class="control-group">
                <label>Tônica</label>
                <select id="sel-root">
                    <option value="C">C</option>
                    <option value="C#">C# / Db</option>
                    <option value="D">D</option>
                    <option value="D#">D# / Eb</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="F#">F# / Gb</option>
                    <option value="G">G</option>
                    <option value="G#">G# / Ab</option>
                    <option value="A">A</option>
                    <option value="A#">A# / Bb</option>
                    <option value="B">B</option>
                </select>
            </div>

            <div class="control-group">
                <label>Escala / Modo</label>
                <select id="sel-scale">
                    <option value="minor">Menor (Eólio)</option>
                    <option value="major">Maior (Jônio)</option>
                    <option value="dorian">Dórico</option>
                    <option value="harmonic_minor">Menor Harmônica</option>
                </select>
            </div>

            <div class="control-group">
                <label>Estilo Musical</label>
                <select id="sel-style">
                    <option value="hiphop">Hip-Hop / R&B</option>
                    <option value="lofi">Lo-Fi / Chill</option>
                    <option value="cinematic">Cinematográfico</option>
                    <option value="jazz">Jazz Moderno</option>
                </select>
            </div>

            <div class="control-group">
                <label>Ritmo / Tempo</label>
                <select id="sel-tempo">
                    <option value="auto">Automático (Por Estilo)</option>
                    <option value="140">140 BPM</option>
                    <option value="150">150 BPM</option>
                    <option value="160">160 BPM</option>
                    <option value="170">170 BPM</option>
                    <option value="180">180 BPM</option>
                </select>
            </div>

            <div class="control-group">
                <label>Oitava Base</label>
                <select id="sel-octave">
                    <option value="3">Oitava 3</option>
                    <option value="4" selected>Oitava 4</option>
                </select>
            </div>

            <button class="btn-generate" onclick="gerarEExecutarProgression()">Gerar e Tocar</button>
        </div>

        <!-- Visualizador de Partitura -->
        <div class="sheet-container" id="sheet-viewer">
            <!-- Renderizado via VexFlow -->
        </div>

        <!-- Cards de Acordes -->
        <div class="chords-display" id="chords-display">
            <div class="chord-card">
                <div class="name" id="chord-0-name">C</div>
                <div class="extension" id="chord-0-ext">m9</div>
                <div class="roman" id="chord-0-roman">i</div>
            </div>
            <div class="chord-card">
                <div class="name" id="chord-1-name">Ab</div>
                <div class="extension" id="chord-1-ext">maj7#11</div>
                <div class="roman" id="chord-1-roman">VI</div>
            </div>
            <div class="chord-card">
                <div class="name" id="chord-2-name">G</div>
                <div class="extension" id="chord-2-ext">V7b9</div>
                <div class="roman" id="chord-2-roman">V</div>
            </div>
            <div class="chord-card">
                <div class="name" id="chord-3-name">C</div>
                <div class="extension" id="chord-3-ext">madd9</div>
                <div class="roman" id="chord-3-roman">i</div>
            </div>
        </div>

        <!-- Teclado Virtual de Piano -->
        <div class="piano-container">
            <div class="piano" id="virtual-piano">
                <!-- Gerado dinamicamente via JS -->
            </div>
        </div>

        <!-- Escala Ativa Pill Bar -->
        <div class="scale-pills" id="scale-pills">
            <div class="pill" style="background:#ef4444;">C</div>
            <div class="pill" style="background:#f97316;">D</div>
            <div class="pill" style="background:#eab308;">Eb</div>
            <div class="pill" style="background:#84cc16;">F</div>
            <div class="pill" style="background:#06b6d4;">G</div>
            <div class="pill" style="background:#3b82f6;">Ab</div>
            <div class="pill" style="background:#8b5cf6;">Bb</div>
        </div>

        <div class="action-footer">
            <button class="btn-midi-export" onclick="alert('Arquivo MIDI pronto para arrastar para sua DAW!')">💾 Arraste o MIDI para a sua DAW</button>
        </div>
    </div>

    <script>
        // Inicialização do Teclado de Piano Virtual (Duas oitavas C3 a B4)
        function buildPiano() {
            const piano = document.getElementById('virtual-piano');
            const notes = [
                {note: 'C', type: 'white', pc: 0},
                {note: 'C#', type: 'black', pc: 1, offset: 22},
                {note: 'D', type: 'white', pc: 2},
                {note: 'D#', type: 'black', pc: 3, offset: 54},
                {note: 'E', type: 'white', pc: 4},
                {note: 'F', type: 'white', pc: 5},
                {note: 'F#', type: 'black', pc: 6, offset: 118},
                {note: 'G', type: 'white', pc: 7},
                {note: 'G#', type: 'black', pc: 8, offset: 150},
                {note: 'A', type: 'white', pc: 9},
                {note: 'A#', type: 'black', pc: 10, offset: 182},
                {note: 'B', type: 'white', pc: 11},
                // Oitava seguinte
                {note: 'C', type: 'white', pc: 12},
                {note: 'C#', type: 'black', pc: 13, offset: 278},
                {note: 'D', type: 'white', pc: 14},
                {note: 'D#', type: 'black', pc: 15, offset: 310},
                {note: 'E', type: 'white', pc: 16},
                {note: 'F', type: 'white', pc: 17},
                {note: 'F#', type: 'black', pc: 18, offset: 374},
                {note: 'G', type: 'white', pc: 19},
                {note: 'G#', type: 'black', pc: 20, offset: 406},
                {note: 'A', type: 'white', pc: 21},
                {note: 'A#', type: 'black', pc: 22, offset: 438},
                {note: 'B', type: 'white', pc: 23}
            ];

            notes.forEach(n => {
                const key = document.createElement('div');
                key.className = `key ${n.type}`;
                if (n.type === 'black') {
                    key.style.left = `${n.offset}px`;
                }
                key.onclick = () => playToneNote(n.note);
                piano.appendChild(key);
            });
        }

        // Sintetizador com Tone.js
        const synth = new Tone.PolySynth(Tone.Synth).toDestination();

        function playToneNote(noteName) {
            Tone.start();
            synth.triggerAttackRelease(`${noteName}4`, "8n");
        }

        function setMode(mode) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function gerarEExecutarProgression() {
            Tone.start();
            const root = document.getElementById('sel-root').value;
            
            // Feedback visual rápido nos cards
            document.getElementById('chord-0-name').innerText = root;
            
            // Toca um acorde simulado de exemplo
            const chordNotes = [`${root}3`, `${root}#3`, `${root}4`];
            synth.triggerAttackRelease(chordNotes, "2n");
            
            renderSheetMusic();
        }

        // Renderizador VexFlow de Partitura Básica
        function renderSheetMusic() {
            const container = document.getElementById('sheet-viewer');
            container.innerHTML = "";
            
            try {
                const { Factory } = Vex.Flow;
                const vf = new Factory({ renderer: { elementId: 'sheet-viewer', width: 450, height: 160 }});
                const score = vf.Score();
                const system = vf.System();

                system.addStave({
                    voices: [
                        score.voice([score.note("c4/q", {clef: "treble"}), score.note("e4/q"), score.note("g4/q"), score.note("b4/q")])
                    ]
                }).addClef('treble').addTimeSignature('4/4');

                vf.draw();
            } catch(e) {
                console.error("Erro ao desenhar partitura:", e);
            }
        }

        window.onload = () => {
            buildPiano();
            renderSheetMusic();
        };
    </script>
</body>
</html>
