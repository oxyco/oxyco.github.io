<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CALCULADORA DE RESISTORES</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; margin: 0; padding-bottom: 80px; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 900px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
        .band-selector { margin-bottom: 25px; background: #334155; padding: 15px; border-radius: 8px; display: inline-block; }
        .band-selector label { font-weight: bold; font-size: 16px; margin: 0 15px; cursor: pointer; color: #bae6fd; }
        .band-selector input[type="radio"] { transform: scale(1.2); margin-right: 5px; }
        .resistor-display { margin: 20px 0 40px 0; display: flex; justify-content: center; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; text-align: left; }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-weight: bold; font-size: 14px; color: #94a3b8; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #0f172a; color: white; font-size: 15px; outline: none; border: 1px solid #475569; }
        .results { margin-top: 30px; padding: 25px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
        .results h2 { margin: 0 0 5px 0; color: #38bdf8; font-size: 28px; }
        .ppm-result { color: #94a3b8; font-size: 16px; margin-bottom: 15px; min-height: 20px; }
        .ohmmeter-btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%; transition: background 0.2s; }
        .ohmmeter-btn:hover { background: #059669; }
        #ohmmeter-display { font-family: monospace; font-size: 24px; color: #a7f3d0; margin-top: 15px; background: #022c22; padding: 10px; border-radius: 6px; border: 1px solid #047857; }
        .download-section { margin-top: 50px; padding-top: 30px; border-top: 2px dashed #334155; }
        .download-section h3 { color: #cbd5e1; margin-bottom: 20px; font-size: 22px; }
        .guide-preview { max-width: 100%; margin: 0 auto 20px auto; background: #f8fafc; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 2px solid #475569; }
        .download-btn { display: inline-block; background: #0284c7; color: white; border: none; padding: 14px 28px; border-radius: 6px; font-weight: bold; font-size: 16px; transition: background 0.2s; cursor: pointer; box-shadow: 0 4px 12px rgba(2,132,199,0.4); }
        .download-btn:hover { background: #0369a1; }

        /* Link do GitHub Limpo (Fica abaixo da linha pontilhada) */
        .github-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.2s;
            margin-top: 25px;
        }
        .github-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CALCULADORA DE RESISTORES</h1>
    <div class="band-selector">
        <label><input type="radio" name="bandCount" value="4" onchange="updateMode()" checked> 4 Faixas</label>
        <label><input type="radio" name="bandCount" value="5" onchange="updateMode()"> 5 Faixas</label>
        <label><input type="radio" name="bandCount" value="6" onchange="updateMode()"> 6 Faixas</label>
    </div>
    <div class="resistor-display">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100">
            <defs>
                <clipPath id="body-clip"><rect x="91" y="16" width="218" height="68" rx="19"/></clipPath>
            </defs>
            <line x1="20" y1="50" x2="380" y2="50" stroke="#64748b" stroke-width="8"/>
            <rect x="90" y="15" width="220" height="70" rx="20" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
            <g clip-path="url(#body-clip)">
                <rect id="svg-b1" x="110" y="15" width="14" height="70" fill="#78350f"/>
                <rect id="svg-b2" x="160" y="15" width="14" height="70" fill="#18181b"/>
                <rect id="svg-b3" x="185" y="15" width="14" height="70" fill="#18181b" display="none"/>
                <rect id="svg-mul" x="210" y="15" width="14" height="70" fill="#dc2626"/>
                <rect id="svg-tol" x="270" y="15" width="14" height="70" fill="#d97706"/>
                <rect id="svg-ppm" x="285" y="15" width="14" height="70" fill="#78350f" display="none"/>
            </g>
        </svg>
    </div>
    <div class="controls">
        <div class="control-group">
            <label>1º Dígito</label>
            <select id="sel-d1" onchange="calculate()">
                <optgroup label="PMV (0, 1, 2)"><option value="0" data-color="#18181b">Preto (0)</option><option value="1" data-color="#78350f" selected>Marrom (1)</option><option value="2" data-color="#dc2626">Vermelho (2)</option></optgroup>
                <optgroup label="LAVA (3, 4, 5, 6)"><option value="3" data-color="#ea580c">Laranja (3)</option><option value="4" data-color="#eab308">Amarelo (4)</option><option value="5" data-color="#16a34a">Verde (5)</option><option value="6" data-color="#2563eb">Azul (6)</option></optgroup>
                <optgroup label="RCB (7, 8, 9)"><option value="7" data-color="#7e22ce">Roxo (7)</option><option value="8" data-color="#64748b">Cinza (8)</option><option value="9" data-color="#ffffff">Branco (9)</option></optgroup>
            </select>
        </div>
        <div class="control-group">
            <label>2º Dígito</label>
            <select id="sel-d2" onchange="calculate()">
                <optgroup label="PMV (0, 1, 2)"><option value="0" data-color="#18181b" selected>Preto (0)</option><option value="1" data-color="#78350f">Marrom (1)</option><option value="2" data-color="#dc2626">Vermelho (2)</option></optgroup>
                <optgroup label="LAVA (3, 4, 5, 6)"><option value="3" data-color="#ea580c">Laranja (3)</option><option value="4" data-color="#eab308">Amarelo (4)</option><option value="5" data-color="#16a34a">Verde (5)</option><option value="6" data-color="#2563eb">Azul (6)</option></optgroup>
                <optgroup label="RCB (7, 8, 9)"><option value="7" data-color="#7e22ce">Roxo (7)</option><option value="8" data-color="#64748b">Cinza (8)</option><option value="9" data-color="#ffffff">Branco (9)</option></optgroup>
            </select>
        </div>
        <div class="control-group" id="container-d3" style="display: none;">
            <label>3º Dígito</label>
            <select id="sel-d3" onchange="calculate()">
                <optgroup label="PMV (0, 1, 2)"><option value="0" data-color="#18181b" selected>Preto (0)</option><option value="1" data-color="#78350f">Marrom (1)</option><option value="2" data-color="#dc2626">Vermelho (2)</option></optgroup>
                <optgroup label="LAVA (3, 4, 5, 6)"><option value="3" data-color="#ea580c">Laranja (3)</option><option value="4" data-color="#eab308">Amarelo (4)</option><option value="5" data-color="#16a34a">Verde (5)</option><option value="6" data-color="#2563eb">Azul (6)</option></optgroup>
                <optgroup label="RCB (7, 8, 9)"><option value="7" data-color="#7e22ce">Roxo (7)</option><option value="8" data-color="#64748b">Cinza (8)</option><option value="9" data-color="#ffffff">Branco (9)</option></optgroup>
            </select>
        </div>
        <div class="control-group">
            <label>Multiplicador</label>
            <select id="sel-mul" onchange="calculate()">
                <optgroup label="PMV"><option value="1" data-color="#18181b">Preto (x1)</option><option value="10" data-color="#78350f">Marrom (x10)</option><option value="100" data-color="#dc2626" selected>Vermelho (x100)</option></optgroup>
                <optgroup label="LAVA"><option value="1000" data-color="#ea580c">Laranja (x1k)</option><option value="10000" data-color="#eab308">Amarelo (x10k)</option><option value="100000" data-color="#16a34a">Verde (x100k)</option><option value="1000000" data-color="#2563eb">Azul (x1M)</option></optgroup>
                <optgroup label="RCB"><option value="10000000" data-color="#7e22ce">Roxo (x10M)</option><option value="100000000" data-color="#64748b">Cinza (x100M)</option><option value="1000000000" data-color="#ffffff">Branco (x1G)</option></optgroup>
                <optgroup label="Especiais"><option value="0.1" data-color="#d97706">Ouro (x0.1)</option><option value="0.01" data-color="#94a3b8">Prata (x0.01)</option></optgroup>
            </select>
        </div>
        <div class="control-group">
            <label>Tolerância</label>
            <select id="sel-tol" onchange="calculate()">
                <option value="1" data-color="#78350f">Marrom (±1%)</option>
                <option value="2" data-color="#dc2626">Vermelho (±2%)</option>
                <option value="0.5" data-color="#16a34a">Verde (±0.5%)</option>
                <option value="0.25" data-color="#2563eb">Azul (±0.25%)</option>
                <option value="0.1" data-color="#7e22ce">Roxo (±0.1%)</option>
                <option value="0.05" data-color="#64748b">Cinza (±0.05%)</option>
                <option value="5" data-color="#d97706" selected>Ouro (±5%)</option>
                <option value="10" data-color="#94a3b8">Prata (±10%)</option>
            </select>
        </div>
        <div class="control-group" id="container-ppm" style="display: none;">
            <label>Coef. Temp. (PPM)</label>
            <select id="sel-ppm" onchange="calculate()">
                <option value="100" data-color="#78350f" selected>Marrom (100 ppm/K)</option>
                <option value="50" data-color="#dc2626">Vermelho (50 ppm/K)</option>
                <option value="15" data-color="#ea580c">Laranja (15 ppm/K)</option>
                <option value="25" data-color="#eab308">Amarelo (25 ppm/K)</option>
                <option value="10" data-color="#2563eb">Azul (10 ppm/K)</option>
                <option value="5" data-color="#7e22ce">Roxo (5 ppm/K)</option>
            </select>
        </div>
    </div>
    <div class="results">
        <h2><span id="nominal-value">1 kΩ</span> <span id="tolerance-value">±5%</span></h2>
        <div class="ppm-result" id="ppm-display"></div>
        <button class="ohmmeter-btn" onclick="simulateOhmmeter()">Simular Leitura no Ohmímetro</button>
        <div id="ohmmeter-display">--- Ω</div>
    </div>

<script>
    let currentResistance = 1000;
    let currentTolerance = 5;
    let currentBands = 4;
    function updateMode() {
        const radios = document.getElementsByName('bandCount');
        for (let radio of radios) { if (radio.checked) { currentBands = parseInt(radio.value); break; } }
        const d3Container = document.getElementById('container-d3');
        const ppmContainer = document.getElementById('container-ppm');
        const svgB1 = document.getElementById('svg-b1');
        const svgB2 = document.getElementById('svg-b2');
        const svgB3 = document.getElementById('svg-b3');
        const svgMul = document.getElementById('svg-mul');
        const svgTol = document.getElementById('svg-tol');
        const svgPpm = document.getElementById('svg-ppm');

        if (currentBands === 4) {
            d3Container.style.display = 'none'; ppmContainer.style.display = 'none';
            svgB1.setAttribute('x', '110'); svgB2.setAttribute('x', '160'); svgB3.setAttribute('display', 'none');
            svgMul.setAttribute('x', '210'); svgTol.setAttribute('x', '270'); svgPpm.setAttribute('display', 'none');
        } else if (currentBands === 5) {
            d3Container.style.display = 'flex'; ppmContainer.style.display = 'none';
            svgB1.setAttribute('x', '105'); svgB2.setAttribute('x', '145'); svgB3.setAttribute('display', 'block');
            svgB3.setAttribute('x', '185'); svgMul.setAttribute('x', '225'); svgTol.setAttribute('x', '275'); svgPpm.setAttribute('display', 'none');
        } else if (currentBands === 6) {
            d3Container.style.display = 'flex'; ppmContainer.style.display = 'flex';
            svgB1.setAttribute('x', '100'); svgB2.setAttribute('x', '135'); svgB3.setAttribute('display', 'block');
            svgB3.setAttribute('x', '170'); svgMul.setAttribute('x', '205'); svgTol.setAttribute('x', '240');
            svgPpm.setAttribute('display', 'block'); svgPpm.setAttribute('x', '280');
        }
        calculate();
    }

    function formatResistance(ohms) {
        if (ohms >= 1000000000) return (ohms / 1000000000).toFixed(2).replace(/\.00$/, '') + ' GΩ';
        if (ohms >= 1000000) return (ohms / 1000000).toFixed(2).replace(/\.00$/, '') + ' MΩ';
        if (ohms >= 1000) return (ohms / 1000).toFixed(2).replace(/\.00$/, '') + ' kΩ';
        return ohms.toFixed(2).replace(/\.00$/, '') + ' Ω';
    }

    function calculate() {
        const b1 = document.getElementById("sel-d1"); const b2 = document.getElementById("sel-d2");
        const b3 = document.getElementById("sel-d3"); const mul = document.getElementById("sel-mul");
        const tol = document.getElementById("sel-tol"); const ppm = document.getElementById("sel-ppm");
        document.getElementById("svg-b1").setAttribute("fill", b1.options[b1.selectedIndex].dataset.color);
        document.getElementById("svg-b2").setAttribute("fill", b2.options[b2.selectedIndex].dataset.color);
        document.getElementById("svg-b3").setAttribute("fill", b3.options[b3.selectedIndex].dataset.color);
        document.getElementById("svg-mul").setAttribute("fill", mul.options[mul.selectedIndex].dataset.color);
        document.getElementById("svg-tol").setAttribute("fill", tol.options[tol.selectedIndex].dataset.color);
        document.getElementById("svg-ppm").setAttribute("fill", ppm.options[ppm.selectedIndex].dataset.color);
        const d1_val = parseFloat(b1.value); const d2_val = parseFloat(b2.value);
        const d3_val = parseFloat(b3.value); const mul_val = parseFloat(mul.value);
        currentTolerance = parseFloat(tol.value);
        if (currentBands === 4) {
            currentResistance = ((d1_val * 10) + d2_val) * mul_val;
            document.getElementById("ppm-display").innerText = "";
        } else {
            currentResistance = ((d1_val * 100) + (d2_val * 10) + d3_val) * mul_val;
            if (currentBands === 6) document.getElementById("ppm-display").innerText = "Coeficiente de Temperatura: " + ppm.value + " ppm/K";
            else document.getElementById("ppm-display").innerText = "";
        }
        document.getElementById("nominal-value").innerText = formatResistance(currentResistance);
        document.getElementById("tolerance-value").innerText = "±" + currentTolerance + "%";
        document.getElementById("ohmmeter-display").innerText = "--- Ω";
    }

    function simulateOhmmeter() {
        const maxVariation = currentTolerance / 100;
        const randomNoise = (Math.random() * 2 - 1) * maxVariation; 
        let measured = currentResistance + (currentResistance * randomNoise);
        document.getElementById("ohmmeter-display").innerText = formatResistance(measured) + " (Medido)";
    }

    document.getElementById('btnDownloadGuia').addEventListener('click', function() {
        const btn = this;
        btn.innerText = "⏳ Gerando Arquivo...";
        btn.disabled = true;

        const svg = document.getElementById('resistorSvg');
        const svgData = new XMLSerializer().serializeToString(svg);
        const canvas = document.createElement('canvas'); 
        const ctx = canvas.getContext('2d'); 
        const img = new Image();

        canvas.width = 2400; 
        canvas.height = 1512;

        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window; 
        const blobURL = URL.createObjectURL(svgBlob);

        img.onload = function() {
            ctx.fillStyle = '#f8fafc'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height); 
            URL.revokeObjectURL(blobURL);

            const dataUrl = canvas.toDataURL('image/png');

            const a = document.createElement('a'); 
            a.download = 'guia_cores_resistores_pmv_lava_rcb.png';
            a.href = dataUrl; 
            document.body.appendChild(a); 
            a.click(); 
            document.body.removeChild(a);

            btn.innerText = "📥 Baixar Guia em Alta Resolução (PNG)";
            btn.disabled = false;
        }; 
        img.src = blobURL;
    });
    updateMode();
</script>
