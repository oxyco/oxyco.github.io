<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACORDES E PROGRESSÕES</title>
    <script src="../js/global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        :root { --bg: #09090b; --surface: #18181b; --border: #27272a; --text: #f4f4f5; --text-muted: #a1a1aa; --accent: #10b981; --chord-bg: #064e3b; }
        body { font-family: sans-serif; text-align: center; padding: 20px; background: var(--bg); color: var(--text); }
        h1 { margin-bottom: 20px; }
        .controls { background: var(--surface); padding: 20px; border-radius: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; border: 1px solid var(--border); max-width: 900px; margin: 0 auto 20px; }
        .control-group { display: flex; flex-direction: column; text-align: left; }
        select { padding: 10px; border-radius: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
        .primary-btn { background: var(--accent); color: white; }
        .stop-btn { background: #ef4444; color: white; }
        .nav-back { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body onload="checkReady()">
    <a href="../index.html" class="nav-back" data-i18n="back" style="display:inline-block; margin-bottom:20px; color:var(--accent); text-decoration:none; font-weight:bold; font-size:16px;">← Voltar / Back</a>
    <h1 data-i18n="title">ACORDES E PROGRESSÕES</h1>
    
    <div class="controls">
        <div class="control-group">
            <label data-i18n="root">Tônica</label>
            <select id="root-note"><option value="0">C</option><option value="2">D</option><option value="4">E</option><option value="5">F</option><option value="7">G</option><option value="9">A</option><option value="11">B</option></select>
        </div>
        <div class="control-group">
            <label data-i18n="scale">Tonalidade</label>
            <select id="scale-type">
                <option value="major">Maior (Major)</option>
                <option value="minor" selected>Menor (Minor)</option>
                <option value="dorian">Dorian</option>
                <option value="phrygian">Phrygian</option>
            </select>
        </div>
        <div class="control-group">
            <label data-i18n="arr">Arranjo / Ritmo</label>
            <select id="arrangement-pattern">
                <option value="block_bass">Blocos Pop</option>
                <option value="fingerpick">Arpejo</option>
                <option value="bossa_nova">Bossa Nova</option>
            </select>
        </div>
        <div class="control-group">
            <button id="btn-generate" class="primary-btn" onclick="generateNew()" disabled data-i18n="gen">Carregando...</button>
            <button id="btn-stop" class="stop-btn" onclick="stopPlayback()" disabled>Stop</button>
        </div>
    </div>
    
    <div class="score-header" data-i18n="score">Leitura Harmônica Simplificada</div>
    <div id="score-container"><div id="score"></div></div>
    
    <script>
        const VF = Vex.Flow;
        const i18n = {
            pt: { back: "← Voltar", title: "ACORDES E PROGRESSÕES", tab1: "Escala Livre", tab2: "Composição por Estilo", root: "Tônica", scale: "Tonalidade", style: "Gênero Base", arr: "Arranjo / Ritmo", bass: "Baixo", oct: "Oitava Central", gen: "Gerar Progressão", score: "Leitura Harmônica Simplificada" },
            en: { back: "← Back", title: "CHORDS & PROGRESSIONS", tab1: "Free Scale", tab2: "Style Composition", root: "Root Note", scale: "Key / Scale", style: "Base Genre", arr: "Arrangement / Rhythm", bass: "Bass", oct: "Center Octave", gen: "Generate Progression", score: "Simplified Harmonic Reading" },
            es: { back: "← Volver", title: "ACORDES Y PROGRESIONES", tab1: "Escala Libre", tab2: "Composición por Estilo", root: "Tónica", scale: "Tonalidad", style: "Género Base", arr: "Arreglo / Ritmo", bass: "Bajo", oct: "Octava Central", gen: "Generar Progresión", score: "Lectura Armónica Simplificada" }
        };
        function applyLang() {
            const lang = getGlobalLang();
            document.querySelectorAll('[data-i18n]').forEach(el => { 
                if(i18n[lang][el.getAttribute('data-i18n')]) el.innerText = i18n[lang][el.getAttribute('data-i18n')]; 
            });
            const btn = document.getElementById('btn-generate');
            if(!btn.disabled) btn.innerText = i18n[lang].gen;
        }
        window.addEventListener('idiomaMudou', applyLang);

        const synth = new Tone.PolySynth().toDestination();
        synth.volume.value = -8;
        let playTimeouts = [];

        function checkReady() {
            const btn = document.getElementById('btn-generate');
            btn.disabled = false;
            btn.innerText = i18n[getGlobalLang()].gen; applyLang();
        }
        
        function stopPlayback() {
            playTimeouts.forEach(clearTimeout);
            playTimeouts = [];
            synth.releaseAll();
            document.getElementById('btn-stop').disabled = true;
            document.getElementById('btn-generate').disabled = false;
        }

        async function generateNew() {
            if (Tone.context.state !== 'running') await Tone.start();
            stopPlayback();
            document.getElementById('btn-stop').disabled = false;
            document.getElementById('btn-generate').disabled = true;

            const baseRoot = parseInt(document.getElementById('root-note').value) + 48; // C3
            // Progressão simples para demonstração
            const chords = [ [0, 4, 7], [5, 9, 12], [7, 11, 14], [0, 4, 7] ]; 
            
            chords.forEach((chord, index) => {
                const freqs = chord.map(interval => Tone.Frequency(baseRoot + interval, "midi").toFrequency());
                playTimeouts.push(setTimeout(() => {
                    synth.triggerAttackRelease(freqs, "1n");
                }, index * 2000));
            });
            
            playTimeouts.push(setTimeout(() => {
                stopPlayback();
            }, chords.length * 2000));
        }
    </script>
</body>
</html>
