<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA PROMPTS | OXYLABZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../js/global.js"></script>
    <style>
        /* TEMA OXYLABZ */
        :root {
            --bg-main: #13111c; 
            --bg-card: #1c1a27; 
            --bg-card-hover: #242136;
            --text-primary: #f8fafc; 
            --text-secondary: #a39eb5;
            --accent: #a78bfa; 
            --accent-glow: rgba(167, 139, 250, 0.25);
            --border: #35314d;
            
            /* Cores específicas por IA (Suaves) */
            --gemini: #a78bfa;
            --claude: #f59e0b;
            --grok: #ef4444;
            --deepseek: #0ea5e9;
            --agentes: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); padding-bottom: 60px; position: relative; }

        /* BOTÃO VOLTAR */
        .back-btn { position: absolute; top: 24px; left: 24px; display: flex; align-items: center; gap: 8px; color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: color 0.2s ease; z-index: 100; }
        .back-btn:hover { color: var(--accent); }
        .back-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

        header { text-align: center; padding: 60px 20px 30px; }
        h1 { font-size: 2.6rem; font-weight: 800; background: linear-gradient(180deg, #ffffff 0%, var(--text-secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; margin-bottom: 8px; }
        p.subtitle { color: var(--text-secondary); font-size: 1.05rem; }

        .controls-container { max-width: 1200px; margin: 0 auto 30px; padding: 0 20px; }
        .controls { display: flex; flex-wrap: wrap; gap: 16px; background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .control-item { display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px; }
        .control-item label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .controls input, .controls select { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-primary); padding: 12px 14px; border-radius: 8px; font-size: 0.95rem; outline: none; transition: 0.2s; }
        .controls input:focus, .controls select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; transition: all 0.2s; position: relative; }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 12px 24px rgba(0,0,0, 0.3); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .badge { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-cat { background: rgba(167, 139, 250, 0.15); color: var(--accent); border: 1px solid rgba(167, 139, 250, 0.25); }
        
        .badge-gemini { background: rgba(167, 139, 250, 0.1); color: var(--gemini); border: 1px solid rgba(167, 139, 250, 0.3); }
        .badge-claude { background: rgba(245, 158, 11, 0.1); color: var(--claude); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-grok { background: rgba(239, 68, 68, 0.1); color: var(--grok); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-deepseek { background: rgba(14, 165, 233, 0.1); color: var(--deepseek); border: 1px solid rgba(14, 165, 233, 0.3); }
        .badge-generic { background: rgba(16, 185, 129, 0.1); color: var(--agentes); border: 1px solid rgba(16, 185, 129, 0.3); }

        .prompt-title { font-size: 1.15rem; color: #ffffff; font-weight: 600; margin-bottom: 10px; word-break: break-word; line-height: 1.3; }
        .prompt-desc { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; flex-grow: 1; margin-bottom: 20px; }

        .actions { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
        .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        
        .btn-copy { background: rgba(255,255,255,0.05); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-copy:hover { background: rgba(255,255,255,0.1); border-color: var(--text-secondary); }
        .btn-send { background: var(--accent); color: #13111c; }
        .btn-send:hover { background: #bba2ff; transform: scale(1.02); }
        
        .btn-export { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #10b981; flex: 1 1 45%; }
        .btn-export:hover { background: rgba(16, 185, 129, 0.2); }

        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: #13111c; padding: 14px 24px; border-radius: 8px; font-weight: 600; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 768px) {
            .back-btn { top: 16px; left: 16px; }
            header { padding: 60px 20px 20px; }
        }
    </style>
</head>
<body>

    <a href="../index.html" class="back-btn" id="ui-back">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Voltar
    </a>

    <header>
        <h1>MEGA PROMPTS</h1>
        <p class="subtitle" id="ui-subtitle">Biblioteca Avançada de Comandos e Contextos</p>
    </header>

    <div class="controls-container">
        <div class="controls">
            <div class="control-item">
                <label id="lbl-search">Pesquisa</label>
                <input type="text" id="searchInput" placeholder="Pesquisar prompt..." onkeyup="renderGrid()">
            </div>
            
            <div class="control-item">
                <label id="lbl-cat">Categoria</label>
                <select id="categoryFilter" onchange="renderGrid()">
                    <option value="" id="ui-cat-all">Todas as Áreas</option>
                </select>
            </div>

            <div class="control-item">
                <label id="lbl-ai">Filtrar por IA</label>
                <select id="aiFilter" onchange="renderGrid()">
                    <option value="">Todas as IAs</option>
                    <option value="gemini">Gemini</option>
                    <option value="claude">Claude</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="grok">Grok</option>
                    <option value="agentes">Agentes Autônomos</option>
                </select>
            </div>

            <div class="control-item">
                <label id="lbl-send">Enviar para</label>
                <select id="platformSelect">
                    <option value="chatgpt">ChatGPT (Abre Direto)</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="claude">Claude</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="grok">Grok</option>
                </select>
            </div>
        </div>
    </div>

    <div class="grid" id="gridContainer"></div>
    <div id="toast" class="toast">Copiado! Cole no seu ecrã da IA.</div>

    <script>
        let promptsDB = [];
        let currentLang = (typeof getGlobalLang === 'function') ? getGlobalLang() : 'pt';

        const uiTexts = {
            pt: { subtitle: "Biblioteca Avançada de Comandos", search: "Pesquisar prompt ou palavra-chave...", allCats: "Todas as Áreas", copy: "Copiar", send: "Enviar à IA", lblSearch: "Pesquisa", lblCat: "Categoria", lblAi: "Filtrar por IA", lblSend: "Enviar para", back: "Voltar" },
            en: { subtitle: "Advanced Command Library", search: "Search prompt or keyword...", allCats: "All Areas", copy: "Copy", send: "Send to AI", lblSearch: "Search", lblCat: "Category", lblAi: "Filter by AI", lblSend: "Send to", back: "Back" },
            es: { subtitle: "Biblioteca Avanzada de Comandos", search: "Buscar prompt o palabra clave...", allCats: "Todas las Áreas", copy: "Copiar", send: "Enviar a la IA", lblSearch: "Búsqueda", lblCat: "Categoría", lblAi: "Filtrar por IA", lblSend: "Enviar a", back: "Volver" }
        };

        async function loadPrompts() {
            try {
                const response = await fetch('prompts.json');
                promptsDB = await response.json();
                updateUI();
            } catch (error) {
                console.error("Erro ao carregar prompts.json:", error);
            }
        }

        function getAiBadgeClass(aiString) {
            if (!aiString) return "badge-generic";
            const str = aiString.toLowerCase();
            if (str.includes("gemini")) return "badge-gemini";
            if (str.includes("claude")) return "badge-claude";
            if (str.includes("grok")) return "badge-grok";
            if (str.includes("deepseek")) return "badge-deepseek";
            return "badge-generic";
        }

        function updateUI() {
            currentLang = (typeof getGlobalLang === 'function') ? getGlobalLang() : 'pt';
            document.getElementById('ui-subtitle').innerText = uiTexts[currentLang].subtitle;
            document.getElementById('searchInput').placeholder = uiTexts[currentLang].search;
            document.getElementById('ui-cat-all').innerText = uiTexts[currentLang].allCats;
            
            document.getElementById('lbl-search').innerText = uiTexts[currentLang].lblSearch;
            document.getElementById('lbl-cat').innerText = uiTexts[currentLang].lblCat;
            document.getElementById('lbl-ai').innerText = uiTexts[currentLang].lblAi;
            document.getElementById('lbl-send').innerText = uiTexts[currentLang].lblSend;
            
            document.getElementById('ui-back').innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> ${uiTexts[currentLang].back}`;
            
            populateCategories();
            renderGrid();
        }

        function populateCategories() {
            const select = document.getElementById('categoryFilter');
            const catKey = 'cat_' + currentLang;
            const uniqueCats = [...new Set(promptsDB.map(p => p[catKey]))].filter(Boolean).sort();
            
            select.innerHTML = `<option value="" id="ui-cat-all">${uiTexts[currentLang].allCats}</option>`;
            uniqueCats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filterCat = document.getElementById('categoryFilter').value;
            const filterAi = document.getElementById('aiFilter').value.toLowerCase();
            
            const catKey = 'cat_' + currentLang;
            const descKey = 'Description_' + currentLang;
            const titleKey = 'Code_' + currentLang;

            container.innerHTML = '';

            const filtered = promptsDB.filter(p => {
                const cat = p[catKey] || "";
                const desc = p[descKey] || "";
                const code = p[titleKey] || p.Code || "";
                const ai = p.AI_Tool || "";
                
                const matchesCat = (filterCat === "" || cat === filterCat);
                const matchesAi = (filterAi === "" || ai.toLowerCase().includes(filterAi));
                const matchesQuery = desc.toLowerCase().includes(query) || code.toLowerCase().includes(query) || ai.toLowerCase().includes(query);
                
                return matchesCat && matchesAi && matchesQuery;
            });

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const displayTitle = (p[titleKey] && p[titleKey] !== p.Code_pt) ? p[titleKey] : (p.Code_pt || p.Code || "");
                const descText = p[descKey] || "";
                const fullText = `${displayTitle}\\n\\n${descText}`;
                
                const safeText = encodeURIComponent(fullText);
                const safeTitle = encodeURIComponent(displayTitle);
                const safeDesc = encodeURIComponent(descText);
                
                const aiBadgeHTML = p.AI_Tool ? `<span class="badge ${getAiBadgeClass(p.AI_Tool)}">${p.AI_Tool}</span>` : '';

                let agentExports = '';
                if (p.AI_Tool && p.AI_Tool.toLowerCase().includes('agente')) {
                    agentExports = `
                        <div class="actions" style="margin-top: 10px;">
                            <button class="btn btn-export" onclick="exportFile('${safeTitle}', '${safeDesc}', 'md')">
                                Export .MD
                            </button>
                            <button class="btn btn-export" onclick="exportFile('${safeTitle}', '${safeDesc}', 'skill')">
                                Export Skill
                            </button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge badge-cat">${p[catKey] || 'Geral'}</span>
                        ${aiBadgeHTML}
                    </div>
                    <div class="prompt-title">${displayTitle}</div>
                    <div class="prompt-desc">${descText}</div>
                    <div class="actions">
                        <button class="btn btn-copy" onclick="copyAction('${safeText}')">
                            ${uiTexts[currentLang].copy}
                        </button>
                        <button class="btn btn-send" onclick="sendToTool('${safeText}')">
                            ${uiTexts[currentLang].send}
                        </button>
                    </div>
                    ${agentExports}
                `;
                container.appendChild(card);
            });
        }

        async function copyAction(encodedText) {
            const text = decodeURIComponent(encodedText);
            try {
                await navigator.clipboard.writeText(text);
                showToast();
            } catch (err) {
                alert("Erro ao copiar.");
            }
        }

        async function sendToTool(encodedText) {
            const text = decodeURIComponent(encodedText);
            const platform = document.getElementById('platformSelect').value;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            try { await navigator.clipboard.writeText(text); } catch(e) {}
            showToast();

            let url = "";
            switch (platform) {
                case 'chatgpt': url = `https://chatgpt.com/?q=${encodeURIComponent(text)}`; break;
                case 'gemini': url = 'https://gemini.google.com/app'; break;
                case 'claude': url = 'https://claude.ai/new'; break;
                case 'deepseek': url = 'https://chat.deepseek.com/'; break;
                case 'grok': url = 'https://grok.com/'; break;
            }
            
            setTimeout(() => {
                if (isMobile) {
                    window.location.href = url;
                } else {
                    window.open(url, '_blank');
                }
            }, 300);
        }

        function exportFile(encTitle, encDesc, type) {
            const title = decodeURIComponent(encTitle);
            const desc = decodeURIComponent(encDesc);
            let content, filename, mimeType;
            
            if (type === 'md') {
                content = `# ${title}\\n\\n${desc}`;
                filename = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
                mimeType = 'text/markdown;charset=utf-8';
            } else if (type === 'skill') {
                const skillObj = {
                    name: title,
                    description: "Skill exportada via OXYLABZ",
                    instructions: desc,
                    version: "1.0"
                };
                content = JSON.stringify(skillObj, null, 2);
                filename = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_skill.json`;
                mimeType = 'application/json;charset=utf-8';
            }
            
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        window.addEventListener('idiomaMudou', updateUI);
        loadPrompts();

    </script>
</body>
</html>
