<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA PROMPTS | OXYLABZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../js/global.js"></script>
    <style>
        :root {
            --bg-main: #0b0914; 
            --bg-card: #151124; 
            --bg-card-hover: #1e1735;
            --text-primary: #f8fafc; 
            --text-secondary: #a39eb5;
            --accent: #9d4edd; 
            --border: #2d2442;
            
            --gemini: #8b5cf6;
            --claude: #d97706;
            --grok: #ef4444;
            --deepseek: #0ea5e9;
            --agentes: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); padding-bottom: 40px; }

        header { text-align: center; padding: 40px 20px 20px; }
        h1 { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #e0aaff, #9d4edd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: var(--text-secondary); margin-top: 8px; font-size: 1rem; }

        .controls-container { max-width: 1200px; margin: 0 auto 30px; padding: 0 20px; }
        .controls { display: flex; flex-wrap: wrap; gap: 12px; background: var(--bg-card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
        .controls > input, .controls > select { flex: 1 1 200px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; outline: none; }
        .controls > input:focus, .controls > select:focus { border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; transition: all 0.2s; }
        .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(157, 78, 221, 0.15); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .badge { font-size: 0.7rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-cat { background: rgba(157, 78, 221, 0.15); color: #e0aaff; border: 1px solid rgba(157, 78, 221, 0.3); }
        
        .badge-gemini { background: rgba(139, 92, 246, 0.15); color: var(--gemini); border: 1px solid rgba(139, 92, 246, 0.3); }
        .badge-claude { background: rgba(217, 119, 6, 0.15); color: var(--claude); border: 1px solid rgba(217, 119, 6, 0.3); }
        .badge-grok { background: rgba(239, 68, 68, 0.15); color: var(--grok); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-deepseek { background: rgba(14, 165, 233, 0.15); color: var(--deepseek); border: 1px solid rgba(14, 165, 233, 0.3); }
        .badge-generic { background: rgba(16, 185, 129, 0.15); color: var(--agentes); border: 1px solid rgba(16, 185, 129, 0.3); }

        .prompt-title { font-family: monospace; font-size: 1.1rem; color: #fff; font-weight: 600; margin-bottom: 8px; word-break: break-word; }
        .prompt-desc { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; flex-grow: 1; margin-bottom: 16px; }

        .actions { display: flex; gap: 8px; width: 100%; }
        .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .btn-copy { background: var(--bg-main); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-copy:hover { background: #2d2442; }
        .btn-send { background: var(--accent); color: #fff; }
        .btn-send:hover { background: #7b2cbf; }
        
        .btn-export { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #10b981; }
        .btn-export:hover { background: rgba(16, 185, 129, 0.2); }

        .toast { position: fixed; bottom: 20px; right: 20px; background: #3c096c; color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 1000; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <header>
        <h1>MEGA PROMPTS</h1>
        <p class="subtitle" id="ui-subtitle">Biblioteca Avançada de Comandos e Contextos</p>
    </header>

    <div class="controls-container">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Pesquisar prompt..." onkeyup="renderGrid()">
            
            <select id="categoryFilter" onchange="renderGrid()">
                <option value="" id="ui-cat-all">Todas as Áreas</option>
            </select>

            <select id="aiFilter" onchange="renderGrid()">
                <option value="">Todas as IAs</option>
                <option value="gemini">Gemini</option>
                <option value="claude">Claude</option>
                <option value="deepseek">DeepSeek</option>
                <option value="grok">Grok</option>
                <option value="agentes">Agentes Autônomos</option>
            </select>

            <select id="platformSelect">
                <option value="chatgpt">ChatGPT (Abre Direto)</option>
                <option value="gemini">Google Gemini</option>
                <option value="claude">Claude</option>
                <option value="deepseek">DeepSeek App</option>
                <option value="grok">Grok (X)</option>
            </select>
        </div>
    </div>

    <div class="grid" id="gridContainer"></div>
    <div id="toast" class="toast">✔️ Copiado! (Pressione Ctrl+V na IA)</div>

    <script>
        let promptsDB = [];
        let currentLang = (typeof getGlobalLang === 'function') ? getGlobalLang() : 'pt';

        const uiTexts = {
            pt: { subtitle: "Biblioteca Avançada de Comandos", search: "Pesquisar prompt ou palavra-chave...", allCats: "Todas as Áreas", copy: "Copiar", send: "Enviar" },
            en: { subtitle: "Advanced Command Library", search: "Search prompt or keyword...", allCats: "All Areas", copy: "Copy", send: "Send" },
            es: { subtitle: "Biblioteca Avanzada de Comandos", search: "Buscar prompt o palabra clave...", allCats: "Todas las Áreas", copy: "Copiar", send: "Enviar" }
        };

        async function loadPrompts() {
            try {
                const response = await fetch('prompts.json');
                promptsDB = await response.json();
                updateUI();
            } catch (error) {
                console.error("Erro ao carregar prompts.json:", error);
            }
        }

        function getAiBadgeClass(aiString) {
            if (!aiString) return "badge-generic";
            const str = aiString.toLowerCase();
            if (str.includes("gemini")) return "badge-gemini";
            if (str.includes("claude")) return "badge-claude";
            if (str.includes("grok")) return "badge-grok";
            if (str.includes("deepseek")) return "badge-deepseek";
            return "badge-generic";
        }

        function updateUI() {
            currentLang = (typeof getGlobalLang === 'function') ? getGlobalLang() : 'pt';
            document.getElementById('ui-subtitle').innerText = uiTexts[currentLang].subtitle;
            document.getElementById('searchInput').placeholder = uiTexts[currentLang].search;
            document.getElementById('ui-cat-all').innerText = uiTexts[currentLang].allCats;
            populateCategories();
            renderGrid();
        }

        function populateCategories() {
            const select = document.getElementById('categoryFilter');
            const catKey = 'cat_' + currentLang;
            const uniqueCats = [...new Set(promptsDB.map(p => p[catKey]))].filter(Boolean).sort();
            
            select.innerHTML = `<option value="" id="ui-cat-all">${uiTexts[currentLang].allCats}</option>`;
            uniqueCats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filterCat = document.getElementById('categoryFilter').value;
            const filterAi = document.getElementById('aiFilter').value.toLowerCase();
            
            const catKey = 'cat_' + currentLang;
            const descKey = 'Description_' + currentLang;
            // Busca o título no idioma atual, se não existir, usa o original
            const titleKey = 'Code_' + currentLang;

            container.innerHTML = '';

            const filtered = promptsDB.filter(p => {
                const cat = p[catKey] || "";
                const desc = p[descKey] || "";
                const code = p[titleKey] || p.Code || "";
                const ai = p.AI_Tool || "";
                
                const matchesCat = (filterCat === "" || cat === filterCat);
                const matchesAi = (filterAi === "" || ai.toLowerCase().includes(filterAi));
                const matchesQuery = desc.toLowerCase().includes(query) || code.toLowerCase().includes(query) || ai.toLowerCase().includes(query);
                
                return matchesCat && matchesAi && matchesQuery;
            });

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const displayTitle = p[titleKey] || p.Code || "";
                const descText = p[descKey] || "";
                const fullText = `${displayTitle}\\n\\n${descText}`;
                
                const safeText = encodeURIComponent(fullText);
                const safeTitle = encodeURIComponent(displayTitle);
                const safeDesc = encodeURIComponent(descText);
                
                const aiBadgeHTML = p.AI_Tool ? `<span class="badge ${getAiBadgeClass(p.AI_Tool)}">${p.AI_Tool}</span>` : '';

                // Botões de Exportação aparecem apenas se for Agente
                let agentExports = '';
                if (p.AI_Tool && p.AI_Tool.toLowerCase().includes('agente')) {
                    agentExports = `
                        <div class="actions" style="margin-top: 8px;">
                            <button class="btn btn-export" onclick="exportFile('${safeTitle}', '${safeDesc}', 'md')">📄 .MD</button>
                            <button class="btn btn-export" onclick="exportFile('${safeTitle}', '${safeDesc}', 'skill')">⚙️ Skill</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge badge-cat">${p[catKey] || 'Geral'}</span>
                        ${aiBadgeHTML}
                    </div>
                    <div class="prompt-title">${displayTitle}</div>
                    <div class="prompt-desc">${descText}</div>
                    <div class="actions">
                        <button class="btn btn-copy" onclick="copyAction('${safeText}')">
                            📋 ${uiTexts[currentLang].copy}
                        </button>
                        <button class="btn btn-send" onclick="sendToTool('${safeText}')">
                            🚀 ${uiTexts[currentLang].send}
                        </button>
                    </div>
                    ${agentExports}
                `;
                container.appendChild(card);
            });
        }

        async function copyAction(encodedText) {
            const text = decodeURIComponent(encodedText);
            try {
                await navigator.clipboard.writeText(text);
                showToast();
            } catch (err) {
                alert("Erro ao copiar.");
            }
        }

        async function sendToTool(encodedText) {
            const text = decodeURIComponent(encodedText);
            const platform = document.getElementById('platformSelect').value;
            const isAndroid = /Android/i.test(navigator.userAgent);
            
            try { await navigator.clipboard.writeText(text); } catch(e) {}
            showToast();

            let url = "";
            switch (platform) {
                case 'chatgpt': url = `https://chatgpt.com/?q=${encodeURIComponent(text)}`; break;
                case 'gemini': url = 'https://gemini.google.com/app'; break;
                case 'claude': url = 'https://claude.ai/new'; break;
                case 'deepseek': 
                    // No Android, o "intent" força a abertura do app nativo. 
                    url = isAndroid ? 'intent://chat.deepseek.com/#Intent;scheme=https;package=com.deepseek.chat;end' : 'https://chat.deepseek.com/';
                    break;
                case 'grok': url = 'https://x.com/i/grok'; break;
            }
            
            setTimeout(() => {
                if (platform === 'deepseek' && isAndroid) {
                    window.location.href = url; // No mobile, redireciona a própria página para invocar o app
                } else {
                    window.open(url, '_blank'); // Abre nova aba nos demais
                }
            }, 300);
        }

        // Função de Exportação de Agentes
        function exportFile(encTitle, encDesc, type) {
            const title = decodeURIComponent(encTitle);
            const desc = decodeURIComponent(encDesc);
            let content, filename, mimeType;
            
            if (type === 'md') {
                content = `# ${title}\\n\\n${desc}`;
                filename = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.md`;
                mimeType = 'text/markdown;charset=utf-8';
            } else if (type === 'skill') {
                const skillObj = {
                    name: title,
                    description: "Skill exportada via OXYLABZ",
                    instructions: desc,
                    version: "1.0"
                };
                content = JSON.stringify(skillObj, null, 2);
                filename = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_skill.json`;
                mimeType = 'application/json;charset=utf-8';
            }
            
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        window.addEventListener('idiomaMudou', updateUI);
        loadPrompts();

    </script>
</body>
</html>
