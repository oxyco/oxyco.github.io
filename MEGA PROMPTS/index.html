<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA PROMPTS | OXYLABZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../js/global.js"></script>
    <style>
        /* TEMA OFICIAL OXYLABZ */
        :root {
            --bg-main: #13111c; 
            --bg-card: #1c1a27; 
            --bg-card-hover: #242136;
            --text-primary: #f8fafc; 
            --text-secondary: #a39eb5;
            --accent: #a78bfa; 
            --accent-glow: rgba(167, 139, 250, 0.25);
            --border: #35314d;
            
            /* Cores das IAs */
            --gemini: #a78bfa;
            --claude: #f59e0b;
            --grok: #ef4444;
            --deepseek: #0ea5e9;
            --agentes: #10b981;
        }

        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-main); color: var(--text-primary); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 60px; }

        header { text-align: center; padding: 60px 20px 30px; width: 100%; max-width: 1000px; }
        h1 { font-size: 2.8rem; font-weight: 800; margin: 0 0 12px 0; letter-spacing: -1px; background: linear-gradient(180deg, #ffffff 0%, var(--text-secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: var(--text-secondary); font-size: 1.1rem; margin: 0; font-weight: 400; }

        /* CONTROLES E FILTROS */
        .controls-wrapper { width: 100%; max-width: 1000px; padding: 0 20px; box-sizing: border-box; margin-bottom: 40px; }
        .controls { display: flex; gap: 16px; background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        
        .control-item { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .control-item label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .controls input, .controls select { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-primary); padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; outline: none; transition: all 0.2s ease; width: 100%; box-sizing: border-box; }
        .controls input:focus, .controls select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        /* GRID DE CARDS */
        .container { width: 100%; max-width: 1000px; padding: 0 20px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        
        /* CARD COM ESTÉTICA OXYLABZ */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; transition: all 0.2s ease-in-out; position: relative; }
        .card:hover { background: var(--bg-card-hover); transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 12px 24px rgba(0,0,0, 0.3); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 8px; flex-wrap: wrap; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-cat { background: rgba(167, 139, 250, 0.15); color: var(--accent); border: 1px solid rgba(167, 139, 250, 0.25); }
        
        .badge-gemini { background: rgba(167, 139, 250, 0.1); color: var(--gemini); border: 1px solid rgba(167, 139, 250, 0.3); }
        .badge-claude { background: rgba(245, 158, 11, 0.1); color: var(--claude); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-grok { background: rgba(239, 68, 68, 0.1); color: var(--grok); border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-deepseek { background: rgba(14, 165, 233, 0.1); color: var(--deepseek); border: 1px solid rgba(14, 165, 233, 0.3); }
        .badge-agentes { background: rgba(16, 185, 129, 0.1); color: var(--agentes); border: 1px solid rgba(16, 185, 129, 0.3); }

        .prompt-title { font-size: 1.15rem; font-weight: 600; color: #ffffff; margin-bottom: 10px; line-height: 1.3; }
        .prompt-desc { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; flex-grow: 1; }

        /* AÇÕES */
        .actions { display: flex; gap: 12px; }
        .btn { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; }
        .btn-copy { background: rgba(255,255,255,0.05); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-copy:hover { background: rgba(255,255,255,0.1); border-color: var(--text-secondary); }
        .btn-send { background: var(--accent); color: #13111c; }
        .btn-send:hover { background: #bba2ff; transform: scale(1.02); }

        /* TOAST E ESTADOS */
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent); color: #13111c; padding: 14px 24px; border-radius: 8px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .error-msg { text-align: center; padding: 40px; color: var(--grok); background: rgba(239, 68, 68, 0.1); border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* RESPONSIVO MOBILE */
        @media (max-width: 768px) {
            .controls { flex-direction: column; gap: 16px; padding: 16px; }
            .control-item { width: 100%; }
            header { padding: 40px 20px 20px; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>MEGA PROMPTS</h1>
        <p class="subtitle" id="ui-subtitle">Biblioteca Avançada de Comandos e Contextos</p>
    </header>

    <div class="controls-wrapper">
        <div class="controls">
            <div class="control-item">
                <label id="lbl-search">Pesquisa</label>
                <input type="text" id="searchInput" placeholder="Palavra-chave ou título..." onkeyup="renderGrid()">
            </div>
            
            <div class="control-item">
                <label id="lbl-cat">Categoria</label>
                <select id="categoryFilter" onchange="renderGrid()">
                    <option value="" id="ui-cat-all">Todas as Áreas</option>
                </select>
            </div>

            <div class="control-item">
                <label id="lbl-ai">Plataforma</label>
                <select id="platformSelect">
                    <option value="chatgpt">ChatGPT (Abre Direto)</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="claude">Claude</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="grok">Grok (X)</option>
                </select>
            </div>
        </div>
    </div>

    <main class="container">
        <div class="grid" id="gridContainer"></div>
    </main>

    <div id="toast" class="toast">✔️ Copiado! Pressione Ctrl+V na IA.</div>

    <script>
        let promptsDB = [];
        let currentLang = (typeof getGlobalLang === 'function') ? getGlobalLang() : 'pt';

        const uiTexts = {
            pt: { subtitle: "Biblioteca Avançada de Contextos", search: "Palavra-chave ou título...", allCats: "Todas as Áreas", copy: "Copiar", send: "Enviar à IA", lblSearch: "Pesquisa", lblCat: "Categoria", lblAi: "Enviar para" },
            en: { subtitle: "Advanced Context Library", search: "Keyword or title...", allCats: "All Areas", copy: "Copy", send: "Send to AI", lblSearch: "Search", lblCat: "Category", lblAi: "Send to" },
            es: { subtitle: "Biblioteca Avanzada de Contextos", search: "Palabra clave o título...", allCats: "Todas las Áreas", copy: "Copiar", send: "Enviar a la IA", lblSearch: "Búsqueda", lblCat: "Categoría", lblAi: "Enviar a" }
        };

        // Carrega o JSON garantindo o nome correto. 
        // IMPORTANTE: Certifique-se de que o arquivo salvo se chama "prompts.json" na mesma pasta.
        async function loadPrompts() {
            try {
                const response = await fetch('prompts.json');
                if (!response.ok) throw new Error("Arquivo prompts.json não encontrado.");
                promptsDB = await response.json();
                updateUI();
            } catch (error) {
                console.error("Erro no fetch:", error);
                document.getElementById('gridContainer').innerHTML = `
                    <div class="error-msg">
                        <h3>⚠️ Banco de dados não carregado</h3>
                        <p>O arquivo <b>prompts.json</b> não foi encontrado ou foi bloqueado pelo navegador (comum ao abrir arquivos locais com dois cliques).<br>No GitHub Pages isso funcionará normalmente.</p>
                    </div>`;
            }
        }

        function getAiBadgeClass(aiString) {
            if (!aiString) return "badge-agentes";
            const str = aiString.toLowerCase();
            if (str.includes("gemini")) return "badge-gemini";
            if (str.includes("claude")) return "badge-claude";
            if (str.includes("grok")) return "badge-grok";
            if (str.includes("deepseek")) return "badge-deepseek";
            return "badge-agentes";
        }

        function updateUI() {
            currentLang = (typeof getGlobalLang === 'function') ? getGlobalLang() : 'pt';
            document.getElementById('ui-subtitle').innerText = uiTexts[currentLang].subtitle;
            document.getElementById('searchInput').placeholder = uiTexts[currentLang].search;
            document.getElementById('ui-cat-all').innerText = uiTexts[currentLang].allCats;
            document.getElementById('lbl-search').innerText = uiTexts[currentLang].lblSearch;
            document.getElementById('lbl-cat').innerText = uiTexts[currentLang].lblCat;
            document.getElementById('lbl-ai').innerText = uiTexts[currentLang].lblAi;
            populateCategories();
            renderGrid();
        }

        function populateCategories() {
            const select = document.getElementById('categoryFilter');
            const catKey = 'cat_' + currentLang;
            
            // Filtra e organiza categorias únicas do JSON
            const uniqueCats = [...new Set(promptsDB.map(p => p[catKey]))].filter(Boolean).sort();
            
            select.innerHTML = `<option value="" id="ui-cat-all">${uiTexts[currentLang].allCats}</option>`;
            uniqueCats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filterCat = document.getElementById('categoryFilter').value;
            
            const catKey = 'cat_' + currentLang;
            const descKey = 'Description_' + currentLang;

            container.innerHTML = '';

            const filtered = promptsDB.filter(p => {
                const cat = p[catKey] || "";
                const desc = p[descKey] || "";
                const code = p.Code || "";
                const ai = p.AI_Tool || "";
                
                const matchesCat = (filterCat === "" || cat === filterCat);
                const matchesQuery = desc.toLowerCase().includes(query) || code.toLowerCase().includes(query) || ai.toLowerCase().includes(query);
                
                return matchesCat && matchesQuery;
            });

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Monta o texto que será copiado/enviado
                const fullText = `${p.Code}\\n\\n${p[descKey]}`;
                const safeText = encodeURIComponent(fullText);
                
                const aiBadgeHTML = p.AI_Tool ? `<span class="badge ${getAiBadgeClass(p.AI_Tool)}">${p.AI_Tool}</span>` : '';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge badge-cat">${p[catKey] || 'Geral'}</span>
                        ${aiBadgeHTML}
                    </div>
                    <div class="prompt-title">${p.Code}</div>
                    <div class="prompt-desc">${p[descKey]}</div>
                    <div class="actions">
                        <button class="btn btn-copy" onclick="copyAction('${safeText}')">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            ${uiTexts[currentLang].copy}
                        </button>
                        <button class="btn btn-send" onclick="sendToTool('${safeText}')">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                            ${uiTexts[currentLang].send}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function copyAction(encodedText) {
            const text = decodeURIComponent(encodedText);
            try {
                await navigator.clipboard.writeText(text);
                showToast();
            } catch (err) {
                alert("Erro ao copiar.");
            }
        }

        async function sendToTool(encodedText) {
            const text = decodeURIComponent(encodedText);
            const platform = document.getElementById('platformSelect').value;
            
            // Copia silenciosamente antes de abrir a aba
            try { await navigator.clipboard.writeText(text); } catch (e) {}
            showToast();

            let url = "";
            switch (platform) {
                case 'chatgpt': url = `https://chatgpt.com/?q=${encodeURIComponent(text)}`; break;
                case 'gemini': url = 'https://gemini.google.com/app'; break;
                case 'claude': url = 'https://claude.ai/new'; break;
                case 'deepseek': url = 'https://chat.deepseek.com/'; break;
                case 'grok': url = 'https://x.com/i/grok'; break;
            }
            // Pequeno delay para garantir que o Toast seja visto
            setTimeout(() => window.open(url, '_blank'), 300);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Intercepta mudança de idioma global
        window.addEventListener('idiomaMudou', updateUI);
        
        // Dispara o carregamento inicial
        loadPrompts();

    </script>
</body>
</html>
