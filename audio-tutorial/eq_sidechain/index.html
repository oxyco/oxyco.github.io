<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<title>EQ & Sidechain Masterclass — OXYLABZ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root{
  --bg:#121418; --panel:#1a1d24; --border:#2c313a;
  --txt:#d7dae0; --muted:#7f848e; --dim:#5a5f6a;
  --accent:#5c8ce6; --violet:#b072ff; --input:#0b0c0f;
  --ok:#5cc971; --warn:#e0a85c; --bad:#e05561;
  --kick:#e8ecf2; --snare:#e0a85c; --hat:#c8a06c; --crash:#d8b880;
  --bass:#8ea4ff; --keys:#5cc971; --vocal:#ffb8d0; --pad:#b072ff;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",-apple-system,sans-serif;}
body{padding:8px;padding-bottom:env(safe-area-inset-bottom);min-height:100vh;-webkit-font-smoothing:antialiased;}

.hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 12px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.logo{font-size:1.15rem;font-weight:800;letter-spacing:1px;}
.logo .d{color:var(--accent);}
.logo small{display:block;font-size:0.55rem;color:var(--muted);letter-spacing:2px;font-weight:400;margin-top:2px;}
.hdr-acts{display:flex;gap:6px;}
.icon-btn{background:var(--panel);color:var(--txt);border:1px solid var(--border);width:34px;height:34px;border-radius:var(--r);font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all 0.15s;}
.icon-btn:hover,.icon-btn:active{border-color:var(--accent);color:var(--accent);}
.lang-sel{background:var(--panel);color:var(--txt);border:1px solid var(--border);height:34px;padding:0 8px;border-radius:var(--r);font-size:0.75rem;outline:none;cursor:pointer;}

.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px;}

.lesson-pick{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px;}
.lesson-pick label{display:block;font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.lesson-pick select{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--border);padding:10px 12px;border-radius:6px;font-size:0.85rem;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;gap:10px;}
.panel-head h2{font-size:0.85rem;font-weight:600;color:var(--txt);letter-spacing:0.2px;}
.panel-head .tag{font-size:0.55rem;color:var(--violet);letter-spacing:1.5px;text-transform:uppercase;font-weight:500;}
.panel-head .chev{font-size:0.7rem;color:var(--muted);transition:transform 0.2s;}
.panel.collapsed .chev{transform:rotate(-90deg);}
.panel-body{padding:0 14px 14px;}
.panel.collapsed .panel-body{display:none;}

.goal{font-size:0.78rem;color:var(--muted);line-height:1.6;}
.goal b{color:var(--txt);}
.badge{display:inline-block;font-size:0.55rem;letter-spacing:1.2px;text-transform:uppercase;padding:3px 8px;border-radius:3px;font-weight:700;border:1px solid;margin-bottom:8px;}
.badge.low{color:var(--ok);border-color:var(--ok);}
.badge.mid{color:var(--accent);border-color:var(--accent);}
.badge.high{color:var(--violet);border-color:var(--violet);}
.badge.mix{color:var(--warn);border-color:var(--warn);}

.transport{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--input);border:1px solid var(--border);border-radius:var(--r);}
.transport .play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all 0.15s;}
.transport .play:active{transform:scale(0.94);}
.transport .play.on{background:var(--violet);}
.transport .pos{font-size:0.7rem;color:var(--muted);font-family:Consolas,monospace;min-width:44px;}
.transport .spacer{flex:1;}
.transport .stop{background:transparent;border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:6px;font-size:0.8rem;cursor:pointer;}
.transport .stop:hover{border-color:var(--bad);color:var(--bad);}

.visual{position:relative;width:100%;height:150px;background:#08060a;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
@media(min-width:600px){.visual{height:220px;}}
.visual canvas{width:100%;height:100%;display:block;}

.fmap{position:relative;width:100%;height:48px;background:var(--input);border:1px solid var(--border);border-radius:var(--r);margin-top:8px;overflow:hidden;}
.fmap .ax{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:0 8px 3px;font-size:0.55rem;color:var(--dim);font-family:Consolas,monospace;}
.fmap .band{position:absolute;height:18px;border-radius:2px;opacity:0.7;}
.fmap .lbl{position:absolute;font-size:0.55rem;color:var(--txt);font-weight:600;top:2px;transform:translateX(2px);}

.ctrl{background:var(--input);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;}
.ctrl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
.ctrl-head label{font-size:0.72rem;color:var(--muted);font-weight:500;flex:1;line-height:1.3;}
.ctrl-head .val{font-size:0.72rem;color:var(--txt);font-weight:700;font-family:Consolas,monospace;white-space:nowrap;}

input[type="range"]{width:100%;-webkit-appearance:none;background:transparent;height:24px;cursor:pointer;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;height:22px;width:22px;border-radius:50%;background:var(--accent);cursor:pointer;margin-top:-9px;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--border);}
input[type="range"]::-moz-range-thumb{height:22px;width:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--bg);}
input[type="range"]::-webkit-slider-runnable-track{width:100%;height:4px;background:var(--border);border-radius:2px;}
input[type="range"]::-moz-range-track{width:100%;height:4px;background:var(--border);border-radius:2px;}
input[type="range"].violet::-webkit-slider-thumb{background:var(--violet);}
input[type="range"].ok::-webkit-slider-thumb{background:var(--ok);}
input[type="range"].warn::-webkit-slider-thumb{background:var(--warn);}
input[type="range"].violet::-moz-range-thumb{background:var(--violet);}
input[type="range"].ok::-moz-range-thumb{background:var(--ok);}
input[type="range"].warn::-moz-range-thumb{background:var(--warn);}

.ab{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
.ab button{padding:11px;border-radius:6px;border:1px solid var(--border);background:var(--input);color:var(--muted);font-size:0.72rem;font-weight:700;cursor:pointer;transition:all 0.15s;}
.ab button.on.a{background:var(--bad);border-color:var(--bad);color:#fff;}
.ab button.on.b{background:var(--ok);border-color:var(--ok);color:#fff;}

.mixer-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.mixer-scroll::-webkit-scrollbar{height:5px;}
.mixer-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.ch{background:var(--input);border:1px solid var(--border);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:88px;flex-shrink:0;}
.ch .nm{font-size:0.6rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;text-align:center;}
.ch .nm.kick{color:var(--kick)} .ch .nm.snare{color:var(--snare)}
.ch .nm.hat,.ch .nm.crash{color:var(--hat)} .ch .nm.bass{color:var(--bass)}
.ch .nm.keys{color:var(--keys)} .ch .nm.vocal{color:var(--vocal)}
.ch .nm.pad{color:var(--pad)}
.ch .btns{display:flex;gap:3px;}
.ch .btns button{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:0.58rem;padding:4px 0;border-radius:3px;cursor:pointer;font-weight:700;transition:all 0.12s;}
.ch .btns button:active{transform:scale(0.95);}
.ch .btns button.solo.on{background:var(--warn);border-color:var(--warn);color:#000;}
.ch .btns button.mute.on{background:var(--bad);border-color:var(--bad);color:#fff;}
.ch .mt{height:5px;background:var(--panel);border-radius:3px;overflow:hidden;border:1px solid var(--border);}
.ch .mt i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));}
.ch .gr{height:3px;background:var(--panel);border-radius:2px;overflow:hidden;}
.ch .gr i{display:block;height:100%;width:0;background:var(--violet);}

.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:0.65rem;color:var(--muted);margin-top:8px;}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}

.ov{position:fixed;inset:0;background:rgba(18,20,24,0.97);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;transition:opacity 0.3s;}
.ov.hide{opacity:0;pointer-events:none;}
.ov .brand-big{font-size:2.4rem;font-weight:800;letter-spacing:2px;}
.ov .brand-big .d{color:var(--accent);}
.ov .hint{font-size:0.78rem;color:var(--muted);max-width:340px;line-height:1.6;}
.ov .start-btn{padding:16px 40px;font-size:1rem;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;transition:all 0.15s;box-shadow:0 8px 24px rgba(92,140,230,0.35);}
.ov .start-btn:active{transform:scale(0.96);}
.ov .start-btn:disabled{opacity:0.5;cursor:wait;}
.ov .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;display:none;}
.ov.loading .spinner{display:block;}
.ov.loading .start-btn{display:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.foot{text-align:center;padding:24px 0 12px;font-size:0.65rem;color:var(--dim);}
.foot a{color:var(--dim);text-decoration:none;}

@media(min-width:600px){
  body{padding:16px;}
  .wrap{gap:14px;}
  .ctrl{padding:12px 14px;}
  .ctrl-head label{font-size:0.78rem;}
  .ctrl-head .val{font-size:0.78rem;}
  .panel-head h2{font-size:0.92rem;}
  .ch{min-width:100px;}
}
</style>
</head>
<body>

<div class="ov" id="ov">
  <div class="brand-big">EQ<span class="d">.</span>MIX</div>
  <div class="hint" id="ovHint">Carregando…</div>
  <div class="spinner" id="ovSpin"></div>
  <button class="start-btn" id="startBtn">LIGAR MASTERCLASS</button>
</div>

<div class="wrap">
  <header class="hdr">
    <div class="logo">EQ<span class="d">.</span>MIX<small>MASTERCLASS</small></div>
    <div class="hdr-acts">
      <a class="icon-btn" href="../../index.html" title="Voltar">←</a>
      <select class="lang-sel" id="langSel">
        <option value="pt">🇧🇷 PT</option>
        <option value="en">🇺🇸 EN</option>
        <option value="es">🇪🇸 ES</option>
      </select>
    </div>
  </header>

  <div class="lesson-pick">
    <label id="lblLesson">Módulo</label>
    <select id="lessonSel"></select>
  </div>

  <div class="transport">
    <button class="play" id="playBtn">▶</button>
    <span class="pos" id="pos">00:00</span>
    <span class="spacer"></span>
    <button class="stop" id="stopBtn" title="Parar">■</button>
  </div>

  <div class="panel">
    <div class="panel-head" data-toggle="info">
      <h2 id="lessonTitle">—</h2>
      <span class="chev">▼</span>
    </div>
    <div class="panel-body">
      <span class="badge" id="lessonBadge">—</span>
      <p class="goal" id="lessonGoal">—</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head" data-toggle="viz">
      <h2 id="lblViz">Espectro ao vivo</h2>
      <span class="tag">LIVE</span>
    </div>
    <div class="panel-body">
      <div class="visual"><canvas id="viz"></canvas></div>
      <div class="fmap" id="fmap"></div>
      <div class="legend" id="legend"></div>
      <div class="ab">
        <button id="abA">Antes</button>
        <button id="abB" class="on b">Depois</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head" data-toggle="ctrl">
      <h2 id="lblCtrl">Controles</h2>
      <span class="chev">▼</span>
    </div>
    <div class="panel-body" id="ctrlBox"></div>
  </div>

  <div class="panel">
    <div class="panel-head" data-toggle="mix">
      <h2 id="lblMix">Mixer</h2>
      <span class="chev">▼</span>
    </div>
    <div class="panel-body">
      <div class="mixer-scroll" id="mixer"></div>
    </div>
  </div>

  <footer class="foot">
    <a href="https://github.com/oxyco" target="_blank" id="footLink">OXYLABZ</a>
  </footer>
</div>

<script>
/* ============================================================
   OXYLABZ · EQ & Sidechain Masterclass
   Áudio via Tone.js (mesma stack do synth que já funciona)
   ============================================================ */

const $ = id => document.getElementById(id);

/* ---------- Estado ---------- */
const State = {
  ready:false, playing:false,
  loop:null, master:null, limiter:null,
  analyserMaster:null, analyserLow:null, analyserMid:null, analyserHigh:null,
  channels:{}, sidechain:{ amount:5, release:0.12, bypass:false },
  bypassEQ:false, soloSet:new Set(), muteSet:new Set()
};

const INSTRUMENTS = ['kick','snare','hat','crash','bass','keys','vocal','pad'];

/* ---------- Init (mesmo padrão do synth) ---------- */
async function startAudio(){
  if (State.ready) return;

  await Tone.start();

  // Master
  State.master = new Tone.Gain(0.75);
  State.limiter = new Tone.Limiter(-1);
  State.analyserMaster = new Tone.Analyser('fft', 1024);
  State.analyserLow  = new Tone.Analyser('fft', 512);
  State.analyserMid  = new Tone.Analyser('fft', 512);
  State.analyserHigh = new Tone.Analyser('fft', 512);

  const splitLow  = new Tone.Filter(250, 'lowpass');
  const splitMid  = new Tone.Filter({ type:'bandpass', frequency:1200, Q:0.5 });
  const splitHigh = new Tone.Filter(4000, 'highpass');

  State.master.connect(State.limiter);
  State.limiter.connect(State.analyserMaster);
  State.limiter.toDestination();
  State.limiter.connect(splitLow);  splitLow.connect(State.analyserLow);
  State.limiter.connect(splitMid);  splitMid.connect(State.analyserMid);
  State.limiter.connect(splitHigh); splitHigh.connect(State.analyserHigh);

  // Canais
  INSTRUMENTS.forEach(name=>{
    const hp = new Tone.Filter({ type:'highpass', frequency:20, Q:0.7 });
    const eq = new Tone.Filter({ type:'peaking', frequency:1000, Q:1.2, gain:0 });
    eq._userGain = 0;
    const duck = new Tone.Gain(1);
    const gain = new Tone.Gain(1);
    const pan = new Tone.Panner(0);
    const meter = new Tone.Meter({ smoothing:0.85 });
    hp.connect(eq); eq.connect(duck); duck.connect(gain);
    gain.connect(pan); pan.connect(meter); meter.connect(State.master);
    State.channels[name] = { hp, eq, duck, gain, pan, meter };
  });

  // Sidechain (ducking real)
  State.sidechain.trigger = (t)=>{
    if (State.sidechain.bypass) return;
    const ch = State.channels.bass; if (!ch) return;
    const duckDb = -State.sidechain.amount;
    const g = ch.duck.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(Math.pow(10, duckDb/20), t+0.005);
    g.setValueAtTime(Math.pow(10, duckDb/20), t+0.03);
    g.linearRampToValueAtTime(1, t+0.03+State.sidechain.release);
  };

  /* ---------- Instrumentos via Tone ---------- */

  // Kick: MembraneSynth (Tone) — soa como kick
  const kick = new Tone.MembraneSynth({
    pitchDecay:0.05, octaves:6, volume:-4,
    envelope:{ attack:0.001, decay:0.35, sustain:0 }
  }).connect(State.channels.kick.hp);

  // Snare: NoiseSynth + corpo tonal
  const snareNoise = new Tone.NoiseSynth({
    noise:{ type:'white' }, volume:-12,
    envelope:{ attack:0.001, decay:0.15, sustain:0 }
  }).connect(State.channels.snare.hp);

  // Hat: NoiseSynth curto
  const hat = new Tone.NoiseSynth({
    noise:{ type:'white' }, volume:-20,
    envelope:{ attack:0.001, decay:0.04, sustain:0 }
  }).connect(State.channels.hat.hp);

  // Crash: NoiseSynth longo
  const crash = new Tone.NoiseSynth({
    noise:{ type:'white' }, volume:-24,
    envelope:{ attack:0.001, decay:1.2, sustain:0 }
  }).connect(State.channels.crash.hp);

  // Bass: MonoSynth
  const bass = new Tone.MonoSynth({
    volume:-6,
    oscillator:{ type:'sawtooth' },
    filter:{ Q:2, type:'lowpass', rolloff:-24 },
    envelope:{ attack:0.005, decay:0.25, sustain:0.7, release:0.3 },
    filterEnvelope:{ attack:0.005, decay:0.15, sustain:0.3, release:0.3, baseFrequency:80, octaves:3 }
  }).connect(State.channels.bass.hp);

  // Keys: PolySynth triangle
  const keys = new Tone.PolySynth(Tone.Synth, {
    volume:-14, oscillator:{ type:'triangle' },
    envelope:{ attack:0.005, decay:0.4, sustain:0.3, release:0.6 }
  }).connect(State.channels.keys.hp);

  // Voice: PolySynth triangle + envelope vocal
  const voice = new Tone.PolySynth(Tone.Synth, {
    volume:-18, oscillator:{ type:'triangle' },
    envelope:{ attack:0.05, decay:0.3, sustain:0.6, release:0.4 }
  }).connect(State.channels.vocal.hp);

  // Pad: PolySynth fatsaw
  const pad = new Tone.PolySynth(Tone.Synth, {
    volume:-24, oscillator:{ type:'fatsawtooth', count:2, spread:18 },
    envelope:{ attack:0.6, decay:1, sustain:0.7, release:1.5 }
  }).connect(State.channels.pad.hp);

  /* ---------- Sequência Am–F–C–G ---------- */
  const bassSeq = [45,45, 41,41, 48,48, 43,43, 45,45, 41,41, 48,48, 43,43];
  const chordSeq = [
    ['A3','C4','E4'],['A3','C4','E4'],
    ['F3','A3','C4'],['F3','A3','C4'],
    ['C4','E4','G4'],['C4','E4','G4'],
    ['G3','B3','D4'],['G3','B3','D4'],
    ['A3','C4','E4'],['A3','C4','E4'],
    ['F3','A3','C4'],['F3','A3','C4'],
    ['C4','E4','G4'],['C4','E4','G4'],
    ['G3','B3','D4'],['G3','B3','D4']
  ];
  const melody = [76,72,74,76,81,79,76,74, 76,72,74,76,81,79,76,74];

  const loop = new Tone.Sequence((time, i)=>{
    if (i % 4 === 0 || i % 4 === 2){
      kick.triggerAttackRelease('C1', '8n', time);
      State.sidechain.trigger(time);
    }
    if (i % 4 === 1 || i % 4 === 3) snareNoise.triggerAttackRelease('8n', time);
    hat.triggerAttackRelease('32n', time);
    if (i === 0) crash.triggerAttackRelease('2n', time);

    bass.triggerAttackRelease(Tone.Frequency(bassSeq[i], 'midi').toFrequency(), '4n', time);
    keys.triggerAttackRelease(chordSeq[i].slice(0,3), '4n', time + 0.01);
    if (i % 8 === 0) pad.triggerAttackRelease(chordSeq[i], '2n', time);
    voice.triggerAttackRelease(Tone.Frequency(melody[i], 'midi').toNote(), '8n', time + 0.03);
  }, Array.from({length:16},(_,i)=>i), '4n');
  loop.loop = true;

  State.loop = loop;
  State.ready = true;
}

/* ---------- Play / Pause / Stop ---------- */
function play(){
  if (!State.ready) return;
  if (State.playing) return;
  State.loop.start(0);
  Tone.Transport.start();
  State.playing = true;
}
function pause(){
  if (!State.playing) return;
  Tone.Transport.pause();
  State.playing = false;
}
function stop(){
  if (!State.ready) return;
  Tone.Transport.stop();
  try { State.loop.stop(); } catch(_){}
  State.playing = false;
}

/* ---------- Controles ---------- */
function setEQ(name, { freq, Q, gain }){
  const ch = State.channels[name]; if (!ch) return;
  if (freq != null) ch.eq.frequency.rampTo(freq, 0.05);
  if (Q != null)    ch.eq.Q.rampTo(Q, 0.05);
  if (gain != null){
    ch.eq._userGain = gain;
    ch.eq.gain.rampTo(State.bypassEQ ? 0 : gain, 0.05);
  }
}
function setHP(name, freq){
  const ch = State.channels[name]; if (!ch) return;
  ch.hp.frequency.rampTo(freq, 0.05);
}
function setPan(name, v){
  const ch = State.channels[name]; if (!ch) return;
  ch.pan.pan.rampTo(v, 0.05);
}
function muteChannel(name, on){
  const ch = State.channels[name]; if (!ch) return;
  ch.gain.gain.rampTo(on ? 0 : 1, 0.05);
}
function setSoloSet(list){
  State.soloSet = new Set(list);
  const solo = State.soloSet.size > 0;
  INSTRUMENTS.forEach(n=>{
    const ch = State.channels[n]; if (!ch) return;
    const audible = solo ? State.soloSet.has(n) : !State.muteSet.has(n);
    ch.gain.gain.rampTo(audible ? 1 : 0, 0.05);
  });
}
function bypassEQ(on){
  State.bypassEQ = on;
  INSTRUMENTS.forEach(n=>{
    const ch = State.channels[n]; if (!ch) return;
    ch.eq.gain.rampTo(on ? 0 : (ch.eq._userGain || 0), 0.05);
  });
}
function bypassSidechain(on){ State.sidechain.bypass = on; }
function setSidechain({ amount, release }){
  if (amount != null) State.sidechain.amount = amount;
  if (release != null) State.sidechain.release = release;
}

/* ---------- Métricas ---------- */
function getMeters(){
  const out = {};
  INSTRUMENTS.forEach(n=>{
    const ch = State.channels[n];
    if (ch && ch.meter){
      const v = ch.meter.getValue();
      out[n] = Math.max(0, (v + 60) / 60);
    } else out[n] = 0;
  });
  return out;
}
function getGR(){
  const g = State.channels.bass?.duck.gain.value ?? 1;
  return { gain:g };
}
function getFFT(which){
  const map = { master:State.analyserMaster, low:State.analyserLow, mid:State.analyserMid, high:State.analyserHigh };
  const a = map[which]; if (!a) return null;
  return a.getValue();
}

function fmtVal(c, v){
  v = +v;
  if (['panHar','voicePan','padPan','hatPan'].includes(c.id)){
    return v === 0 ? 'C' : (v<0 ? Math.abs(v)+' L' : v+' R');
  }
  if (c.unit === 'dB') return (c.invert?'−':'') + Math.abs(v).toFixed(1) + ' dB';
  if (c.unit === '%')  return v + ' %';
  if (c.unit === 'ms') return v + ' ms';
  if (c.unit === 'Hz') return v + ' Hz';
  return v + (c.unit ? ' '+c.unit : '');
}

      <div class="mt"><i id="m_${name}"></i></div>
      <div class="gr"><i id="g_${name}"></i></div>

    b.onclick = ()=>{
      const ch = b.dataset.ch;

      if (b.classList.contains('mute')){
        muteChannel(ch, on);
      }
    };
  });

function logPos(f){
  const fmin=20, fmax=20000;
  return (Math.log10(f) - Math.log10(fmin)) / (Math.log10(fmax) - Math.log10(fmin)) * 100;
}
function renderFreqMap(lesson){
  const box = $('fmap');
  const active = new Set(lesson.instruments);
  let html = `<div class="ax"><span>20</span><span>100</span><span>500</span><span>2k</span><span>8k</span><span>20k</span></div>`;
  BAND_MAP.filter(b=>active.has(b.ch) || (b.ch==='hat'&&active.has('crash'))).forEach((b,i)=>{
    const x = logPos(b.lo);
    const w = logPos(b.hi) - x;
    const y = 6 + (i % 2) * 16;
    html += `<div class="band" style="left:${x}%;width:${w}%;top:${y}px;background:${b.color};"></div>`;
    html += `<div class="lbl" style="left:${x}%;top:${y-2}px;">${b.name}</div>`;
  });
  box.innerHTML = html;
}
function renderLegend(lesson){
  const active = new Set(lesson.instruments);
  const items = [];
  if (active.has('kick'))  items.push(['Kick','#e8ecf2']);
  if (active.has('snare')) items.push(['Snare','#e0a85c']);
  if (active.has('hat')||active.has('crash')) items.push(['Pratos','#c8a06c']);
  if (active.has('bass'))  items.push(['Bass','#8ea4ff']);
  if (active.has('keys'))  items.push(['Keys','#5cc971']);
  if (active.has('vocal')) items.push(['Voz','#ffb8d0']);
  if (active.has('pad'))   items.push(['Pad','#b072ff']);
  $('legend').innerHTML = items.map(([n,c])=>
    `<span><i class="dot" style="background:${c}"></i>${n}</span>`
  ).join('');
}

const VIZ = { cv:null, cx:null, w:0, h:0 };
function ensureCanvas(){
  const cv = $('viz'); if (!cv) return null;
  const cx = cv.getContext('2d');
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * devicePixelRatio){
    cv.width = w * devicePixelRatio;
    cv.height = h * devicePixelRatio;
    cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  VIZ.cv = cv; VIZ.cx = cx; VIZ.w = w; VIZ.h = h;
  return cx;
}
function freqToX(f, w){
  const fmin = 20, fmax = 20000;
  return (Math.log10(f) - Math.log10(fmin)) / (Math.log10(fmax) - Math.log10(fmin)) * w;
}
function drawLoop(){
  UI.raf = requestAnimationFrame(drawLoop);
  const cx = ensureCanvas();
  if (!cx) return;
  const w = VIZ.w, h = VIZ.h;
  cx.clearRect(0,0,w,h);
  drawGrid(cx,w,h);

  const lesson = LESSONS[UI.current];
  if (lesson.viz === 'heatmap') drawHeatmap(cx,w,h);
  else drawSpectrum(cx,w,h);

  if (State.ready){
    const meters = getMeters();
    Object.entries(meters).forEach(([n,v])=>{
      const el = $('m_'+n);
      if (el) el.style.width = Math.min(100, v*140) + '%';
    });
    const gr = getGR();
    const grPct = Math.max(0, (1-gr.gain)) * 100 * 3;
    const gBass = $('g_bass');
    if (gBass) gBass.style.width = Math.min(100, grPct) + '%';

    if (State.playing){
      const pos = Tone.Transport.seconds;
      const m = String(Math.floor(pos/60)).padStart(2,'0');
      const s = String(Math.floor(pos%60)).padStart(2,'0');
      $('pos').textContent = m+':'+s;
    }
  }
}
function drawGrid(cx,w,h){
  cx.strokeStyle = 'rgba(44,49,58,0.55)';
  cx.fillStyle = 'rgba(127,132,142,0.7)';
  cx.font = '9px "Segoe UI", sans-serif';
  [30,60,120,250,500,1000,2000,4000,8000,16000].forEach(f=>{
    const x = freqToX(f, w);
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, h-12); cx.stroke();
    cx.fillText(f>=1000?(f/1000)+'k':f, x-7, h-2);
  });
}
function drawSpectrum(cx,w,h){
  const data = getFFT('master');
  if (!data) return;
  const sr = Tone.context.sampleRate;
  const bins = data.length;
  const binHz = (sr/2) / bins;
  cx.beginPath();
  let first = true;
  for (let i=0;i<bins;i++){
    const f = i * binHz;
    if (f < 20 || f > 20000) continue;
    const x = freqToX(f, w);
    const db = data[i];
    const v = Math.max(0, Math.min(1, (db + 100) / 100));
    const y = h - 12 - v * (h-20);
    if (first){ cx.moveTo(x,y); first=false; } else cx.lineTo(x,y);
  }
  const grad = cx.createLinearGradient(0,0,w,0);
  grad.addColorStop(0, '#5cc971');
  grad.addColorStop(0.4, '#5c8ce6');
  grad.addColorStop(0.75, '#b072ff');
  grad.addColorStop(1, '#e6ccff');
  cx.strokeStyle = grad;
  cx.lineWidth = 1.6;
  cx.shadowBlur = 10;
  cx.shadowColor = '#b072ff';
  cx.stroke();
  cx.shadowBlur = 0;
}
function drawHeatmap(cx,w,h){
  const overlap = (UI.overlap ?? 70) / 100;
  const mu = Math.log10(60);
  const sigma = 0.14 * (0.5 + overlap);
  function curve(color){
    cx.beginPath();
    for (let i=0;i<w;i++){
      const f = 20 * Math.pow(1000, i/w);
      const v = Math.exp(-0.5 * Math.pow((Math.log10(f)-mu)/sigma, 2));
      const y = h - 12 - v * (h-24);
      if (i===0) cx.moveTo(i,y); else cx.lineTo(i,y);
    }
    cx.strokeStyle = color;
    cx.lineWidth = 2;
    cx.stroke();
  }
  cx.beginPath();
  for (let i=0;i<w;i++){
    const f = 20 * Math.pow(1000, i/w);
    const v = Math.exp(-0.5 * Math.pow((Math.log10(f)-mu)/sigma, 2));
    const y = h - 12 - v * (h-24);
    if (i===0) cx.moveTo(i,y); else cx.lineTo(i,y);
  }
  for (let i=w-1;i>=0;i--){
    const f = 20 * Math.pow(1000, i/w);
    const v = Math.exp(-0.5 * Math.pow((Math.log10(f)-mu)/sigma, 2));
    const y = h - 12 - v * (h-24);
    cx.lineTo(i,y);
  }
  cx.closePath();
  cx.fillStyle = 'rgba(224,85,97,' + (0.15 + 0.45*overlap) + ')';
  cx.fill();
  curve('#e8ecf2');
  curve('#8ea4ff');
}

document.querySelectorAll('[data-toggle]').forEach(head=>{

    const panel = head.closest('.panel');

  };

/* ---------- Transport ---------- */
$('playBtn').onclick = ()=>{
  if (!State.ready) return;
  if (UI.playing){
    pause();
    $('playBtn').textContent = '▶';
    $('playBtn').classList.remove('on');
    UI.playing = false;
  } else {
    play();
    $('playBtn').textContent = '❚❚';
    $('playBtn').classList.add('on');
    UI.playing = true;
  }
};
$('stopBtn').onclick = ()=>{
  stop();
  $('playBtn').textContent = '▶';
  $('playBtn').classList.remove('on');
  UI.playing = false;
  $('pos').textContent = '00:00';
};

window.addEventListener('load', ()=>{
  if (typeof getGlobalLang === 'function'){
    try { LANG = getGlobalLang(); } catch(_){}
  }
  render();

  const overlay = $('ov');
  const startBtn = $('startBtn');

  // handler ÚNICO, sem flag, sem timeout, sem pointerup
  startBtn.addEventListener('click', async () => {
    try {
      startBtn.disabled = true;
      startBtn.textContent = 'INICIANDO…';

      await startAudio();       // await Tone.start() + build graph + sequence
      play();                    // dispara o loop

      overlay.style.display = 'none';
      $('playBtn').textContent = '❚❚';
      $('playBtn').classList.add('on');
      UI.playing = true;

      // aplica o estado da lição atual agora que existe áudio
      LESSONS[UI.current].apply && LESSONS[UI.current].apply();

      requestAnimationFrame(drawLoop);
    } catch (err){
      console.error('Erro init:', err);
      startBtn.disabled = false;
      startBtn.textContent = t('start');
      alert('Erro: ' + err.message);
    }
  });
});
