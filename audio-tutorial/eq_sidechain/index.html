<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<title>EQ & Sidechain Masterclass — OXYLABZ</title>
<style>
:root{
  --bg:#121418; --panel:#1a1d24; --border:#2c313a;
  --txt:#d7dae0; --muted:#7f848e; --dim:#5a5f6a;
  --accent:#5c8ce6; --violet:#b072ff; --input:#0b0c0f;
  --ok:#5cc971; --warn:#e0a85c; --bad:#e05561;
  --kick:#e8ecf2; --snare:#e0a85c; --hat:#c8a06c; --crash:#d8b880;
  --bass:#8ea4ff; --keys:#5cc971; --vocal:#ffb8d0; --pad:#b072ff;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",-apple-system,sans-serif;}
body{padding:8px;min-height:100vh;-webkit-font-smoothing:antialiased;}

.ov{position:fixed;inset:0;background:#121418;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity 0.3s;}
.ov.hide{opacity:0;pointer-events:none;}
.ov .brand-big{font-size:2.6rem;font-weight:800;letter-spacing:3px;}
.ov .brand-big .d{color:var(--accent);}
.ov .hint{font-size:0.8rem;color:var(--muted);max-width:360px;line-height:1.6;}
.ov .start-btn{padding:18px 44px;font-size:1rem;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;box-shadow:0 8px 24px rgba(92,140,230,0.35);transition:all 0.15s;}
.ov .start-btn:active{transform:scale(0.97);}
.ov .start-btn:disabled{opacity:0.5;cursor:wait;}

.hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 12px;border-bottom:1px solid var(--border);margin-bottom:12px;max-width:720px;margin-left:auto;margin-right:auto;}
.logo{font-size:1.15rem;font-weight:800;letter-spacing:1px;}
.logo .d{color:var(--accent);}
.logo small{display:block;font-size:0.55rem;color:var(--muted);letter-spacing:2px;font-weight:400;margin-top:2px;}
.hdr-acts{display:flex;gap:6px;}
.icon-btn{background:var(--panel);color:var(--txt);border:1px solid var(--border);width:34px;height:34px;border-radius:var(--r);font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.lang-sel{background:var(--panel);color:var(--txt);border:1px solid var(--border);height:34px;padding:0 8px;border-radius:var(--r);font-size:0.75rem;outline:none;cursor:pointer;}

.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px;}

.lesson-pick{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px;}
.lesson-pick label{display:block;font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.lesson-pick select{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--border);padding:10px 12px;border-radius:6px;font-size:0.85rem;outline:none;cursor:pointer;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;user-select:none;}
.panel-head h2{font-size:0.85rem;font-weight:600;color:var(--txt);}
.panel-head .tag{font-size:0.55rem;color:var(--violet);letter-spacing:1.5px;text-transform:uppercase;}
.panel-head .chev{font-size:0.7rem;color:var(--muted);transition:transform 0.2s;}
.panel.collapsed .chev{transform:rotate(-90deg);}
.panel-body{padding:0 14px 14px;}
.panel.collapsed .panel-body{display:none;}

.goal{font-size:0.78rem;color:var(--muted);line-height:1.6;}
.badge{display:inline-block;font-size:0.55rem;letter-spacing:1.2px;text-transform:uppercase;padding:3px 8px;border-radius:3px;font-weight:700;border:1px solid;margin-bottom:8px;}
.badge.low{color:var(--ok);border-color:var(--ok);}
.badge.mid{color:var(--accent);border-color:var(--accent);}
.badge.high{color:var(--violet);border-color:var(--violet);}
.badge.mix{color:var(--warn);border-color:var(--warn);}

.transport{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--input);border:1px solid var(--border);border-radius:var(--r);}
.transport .play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:1rem;cursor:pointer;}
.transport .play.on{background:var(--violet);}
.transport .pos{font-size:0.7rem;color:var(--muted);font-family:Consolas,monospace;min-width:44px;}
.transport .spacer{flex:1;}
.transport .stop{background:transparent;border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:6px;cursor:pointer;}

.visual{position:relative;width:100%;height:150px;background:#08060a;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
@media(min-width:600px){.visual{height:220px;}}
.visual canvas{width:100%;height:100%;display:block;}

.fmap{position:relative;width:100%;height:48px;background:var(--input);border:1px solid var(--border);border-radius:var(--r);margin-top:8px;overflow:hidden;}
.fmap .ax{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:0 8px 3px;font-size:0.55rem;color:var(--dim);font-family:Consolas,monospace;}
.fmap .band{position:absolute;height:18px;border-radius:2px;opacity:0.7;}
.fmap .lbl{position:absolute;font-size:0.55rem;color:var(--txt);font-weight:600;top:2px;}

.ctrl{background:var(--input);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;}
.ctrl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
.ctrl-head label{font-size:0.72rem;color:var(--muted);font-weight:500;flex:1;}
.ctrl-head .val{font-size:0.72rem;color:var(--txt);font-weight:700;font-family:Consolas,monospace;}

input[type="range"]{width:100%;-webkit-appearance:none;background:transparent;height:24px;cursor:pointer;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;height:22px;width:22px;border-radius:50%;background:var(--accent);cursor:pointer;margin-top:-9px;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--border);}
input[type="range"]::-webkit-slider-runnable-track{width:100%;height:4px;background:var(--border);border-radius:2px;}
input[type="range"].violet::-webkit-slider-thumb{background:var(--violet);}
input[type="range"].ok::-webkit-slider-thumb{background:var(--ok);}
input[type="range"].warn::-webkit-slider-thumb{background:var(--warn);}

.ab{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
.ab button{padding:11px;border-radius:6px;border:1px solid var(--border);background:var(--input);color:var(--muted);font-size:0.72rem;font-weight:700;cursor:pointer;}
.ab button.on.a{background:var(--bad);border-color:var(--bad);color:#fff;}
.ab button.on.b{background:var(--ok);border-color:var(--ok);color:#fff;}

.mixer-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
.ch{background:var(--input);border:1px solid var(--border);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:88px;flex-shrink:0;}
.ch .nm{font-size:0.6rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;text-align:center;}
.ch .nm.kick{color:var(--kick)} .ch .nm.snare{color:var(--snare)}
.ch .nm.hat,.ch .nm.crash{color:var(--hat)} .ch .nm.bass{color:var(--bass)}
.ch .nm.keys{color:var(--keys)} .ch .nm.vocal{color:var(--vocal)}
.ch .nm.pad{color:var(--pad)}
.ch .btns{display:flex;gap:3px;}
.ch .btns button{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:0.58rem;padding:4px 0;border-radius:3px;cursor:pointer;font-weight:700;}
.ch .btns button.solo.on{background:var(--warn);border-color:var(--warn);color:#000;}
.ch .btns button.mute.on{background:var(--bad);border-color:var(--bad);color:#fff;}
.ch .mt{height:5px;background:var(--panel);border-radius:3px;overflow:hidden;border:1px solid var(--border);}
.ch .mt i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));}
.ch .gr{height:3px;background:var(--panel);border-radius:2px;overflow:hidden;}
.ch .gr i{display:block;height:100%;width:0;background:var(--violet);}

.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:0.65rem;color:var(--muted);margin-top:8px;}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}

.foot{text-align:center;padding:24px 0 12px;font-size:0.65rem;color:var(--dim);}
</style>
</head>
<body>

<div class="ov" id="ov">
  <div class="brand-big">EQ<span class="d">.</span>MIX</div>
  <div class="hint" id="ovHint">Lo-fi interativo: kick, bass, voz, keys, pad, drums.</div>
  <button class="start-btn" id="startBtn">LIGAR MASTERCLASS</button>
</div>

<header class="hdr">
  <div class="logo">EQ<span class="d">.</span>MIX<small>MASTERCLASS</small></div>
  <div class="hdr-acts">
    <a class="icon-btn" href="../../index.html">←</a>
    <select class="lang-sel" id="langSel">
      <option value="pt">🇧🇷 PT</option>
      <option value="en">🇺🇸 EN</option>
      <option value="es">🇪🇸 ES</option>
    </select>
  </div>
</header>

<div class="wrap">
  <div class="lesson-pick">
    <label id="lblLesson">Módulo</label>
    <select id="lessonSel"></select>
  </div>

  <div class="transport">
    <button class="play" id="playBtn">▶</button>
    <span class="pos" id="pos">00:00</span>
    <span class="spacer"></span>
    <button class="stop" id="stopBtn">■</button>
  </div>

  <div class="panel">
    <div class="panel-head" data-toggle>
      <h2 id="lessonTitle">—</h2>
      <span class="chev">▼</span>
    </div>
    <div class="panel-body">
      <span class="badge" id="lessonBadge">—</span>
      <p class="goal" id="lessonGoal">—</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head" data-toggle>
      <h2 id="lblViz">Espectro</h2>
      <span class="tag">LIVE</span>
    </div>
    <div class="panel-body">
      <div class="visual"><canvas id="viz"></canvas></div>
      <div class="fmap" id="fmap"></div>
      <div class="legend" id="legend"></div>
      <div class="ab">
        <button id="abA">Antes</button>
        <button id="abB" class="on b">Depois</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head" data-toggle>
      <h2 id="lblCtrl">Controles</h2>
      <span class="chev">▼</span>
    </div>
    <div class="panel-body" id="ctrlBox"></div>
  </div>

  <div class="panel">
    <div class="panel-head" data-toggle>
      <h2 id="lblMix">Mixer</h2>
      <span class="chev">▼</span>
    </div>
    <div class="panel-body">
      <div class="mixer-scroll" id="mixer"></div>
    </div>
  </div>

  <footer class="foot"><a href="https://github.com/oxyco" style="color:var(--dim);text-decoration:none;">OXYLABZ</a></footer>
</div>

<script>
/* ============================================================
   OXYLABZ · EQ & Sidechain Masterclass
   Web Audio API pura — sem Tone.js, sem alocação no scheduler
   ============================================================ */

const $ = id => document.getElementById(id);
const AC = window.AudioContext || window.webkitAudioContext;

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
const S = {
  ctx:null, master:null, comp:null, analyser:null, fft:null,
  lowAnalyser:null, midAnalyser:null, highAnalyser:null,
  lowArr:null, midArr:null, highArr:null,
  channels:{},
  ready:false, playing:false, timer:null,
  nextNoteTime:0, current16th:0,
  bpm:82, sixteenth: 60/82/4,
  bar:0,
  sidechain:{ amount:5, release:0.12, bypass:false },
  bypassEQ:false,
  soloSet:new Set(),
  muteSet:new Set()
};

const CHANNELS = ['kick','snare','hat','crash','bass','keys','vocal','pad'];

/* ============================================================
   PADRÕES PRÉ-COMPUTADOS (zero alocação no scheduler)
   ============================================================ */
// Cada seção = 8 compassos. 32 compassos = 4 seções.
// intro / corpo / clímax / break
const SECTIONS = ['intro','corpo','climax','break'];

// Progressão: Am7, Fmaj7, Cmaj7, G7 (MIDI)
const CHORDS_MIDI = [
  [57, 60, 64, 67],
  [53, 57, 60, 64],
  [48, 52, 55, 59],
  [55, 59, 62, 65]
];
const CHORD_HZ = CHORDS_MIDI.map(ch => ch.map(m => 440 * Math.pow(2, (m - 69) / 12)));

const BASS_MIDI = [45, 41, 48, 43];
const BASS_HZ = BASS_MIDI.map(m => 440 * Math.pow(2, (m - 69) / 12));
const BASS_FIFTH_HZ = BASS_MIDI.map(m => 440 * Math.pow(2, ((m + 7) - 69) / 12));

// Melodia em MIDI (notas do Am pentatônica, com silêncios)
const MELODY_MIDI = [
  76, 0, 74, 72, 0, 69, 72, 0,
  76, 0, 74, 76, 0, 79, 76, 0,
  72, 0, 74, 76, 0, 72, 69, 0,
  67, 0, 69, 71, 0, 74, 72, 0
];
const MELODY_HZ = MELODY_MIDI.map(m => m === 0 ? 0 : 440 * Math.pow(2, (m - 69) / 12));

// Pad: acordes uma oitava acima
const PAD_HZ = CHORDS_MIDI.map(ch => ch.map(m => 440 * Math.pow(2, ((m + 12) - 69) / 12)));

/* ============================================================
   INICIALIZAÇÃO DO ÁUDIO
   ============================================================ */
function initAudio(){
  const ctx = new AC({ latencyHint: 'interactive' });
  S.ctx = ctx;

  // Master limiter + compressor
  S.comp = ctx.createDynamicsCompressor();
  S.comp.threshold.value = -14;
  S.comp.knee.value = 6;
  S.comp.ratio.value = 3;
  S.comp.attack.value = 0.01;
  S.comp.release.value = 0.25;

  S.master = ctx.createGain();
  S.master.gain.value = 0.85;
  S.master.connect(S.comp);
  S.comp.connect(ctx.destination);

  // Analyser master
  S.analyser = ctx.createAnalyser();
  S.analyser.fftSize = 1024;
  S.fft = new Uint8Array(S.analyser.frequencyBinCount);
  S.master.connect(S.analyser);

  // 3 bandas para o visualizador
  function makeBand(type, freq, q){
    const f = ctx.createBiquadFilter();
    f.type = type;
    if (freq) f.frequency.value = freq;
    if (q) f.Q.value = q;
    const a = ctx.createAnalyser();
    a.fftSize = 256;
    const arr = new Uint8Array(a.frequencyBinCount);
    S.master.connect(f);
    f.connect(a);
    return { a, arr };
  }
  const lo = makeBand('lowpass', 250);
  const mi = makeBand('bandpass', 1200, 0.5);
  const hi = makeBand('highpass', 4000);
  S.lowAnalyser = lo.a; S.lowArr = lo.arr;
  S.midAnalyser = mi.a; S.midArr = mi.arr;
  S.highAnalyser = hi.a; S.highArr = hi.arr;

  // Canais: hp → eq → duck → gain → pan → meter → master
  CHANNELS.forEach(name=>{
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 20;
    hp.Q.value = 0.7;

    const eq = ctx.createBiquadFilter();
    eq.type = 'peaking';
    eq.frequency.value = 1000;
    eq.Q.value = 1.2;
    eq.gain.value = 0;
    eq._userGain = 0;

    const duck = ctx.createGain();
    duck.gain.value = 1;

    const gain = ctx.createGain();
    gain.gain.value = 1;

    const pan = ctx.createStereoPanner();
    pan.pan.value = 0;

    const meter = ctx.createAnalyser();
    meter.fftSize = 128;
    const meterArr = new Uint8Array(meter.frequencyBinCount);

    hp.connect(eq);
    eq.connect(duck);
    duck.connect(gain);
    gain.connect(pan);
    pan.connect(meter);
    meter.connect(S.master);

    S.channels[name] = { hp, eq, duck, gain, pan, meter, meterArr };
  });

  S.ready = true;
}

/* ============================================================
   INSTRUMENTOS — síntese pura, zero alocação desnecessária
   ============================================================ */

/* --- KICK: sine sweep 120→45 Hz + click --- */
function playKick(time, vel){
  if (!S.ready) return;
  vel = vel == null ? 1 : vel;
  const ctx = S.ctx;
  const ch = S.channels.kick;
  const now = time;

  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, now);
  o.frequency.exponentialRampToValueAtTime(45, now + 0.08);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.9 * vel, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
  o.connect(g);
  g.connect(ch.hp);
  o.start(now);
  o.stop(now + 0.4);

  // click de ataque
  const c = ctx.createOscillator();
  const cg = ctx.createGain();
  c.type = 'triangle';
  c.frequency.value = 1600;
  cg.gain.setValueAtTime(0.15 * vel, now);
  cg.gain.exponentialRampToValueAtTime(0.0001, now + 0.008);
  c.connect(cg);
  cg.connect(ch.hp);
  c.start(now);
  c.stop(now + 0.012);

  // dispara o sidechain
  triggerSidechain(now);
}

/* --- SNARE: corpo tonal + ruído --- */
function playSnare(time, vel){
  if (!S.ready) return;
  vel = vel == null ? 1 : vel;
  const ctx = S.ctx;
  const ch = S.channels.snare;
  const now = time;

  // corpo tonal
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(180, now);
  o.frequency.exponentialRampToValueAtTime(120, now + 0.08);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.35 * vel, now + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
  o.connect(g);
  g.connect(ch.hp);
  o.start(now);
  o.stop(now + 0.16);

  // ruído
  const len = Math.floor(ctx.sampleRate * 0.2);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const nf = ctx.createBiquadFilter();
  nf.type = 'bandpass';
  nf.frequency.value = 3200;
  nf.Q.value = 0.8;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.0001, now);
  ng.gain.exponentialRampToValueAtTime(0.5 * vel, now + 0.002);
  ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
  src.connect(nf);
  nf.connect(ng);
  ng.connect(ch.hp);
  src.start(now);
  src.stop(now + 0.2);
}

/* --- HAT: ruído HPF curto --- */
function playHat(time, open, vel){
  if (!S.ready) return;
  vel = vel == null ? 1 : vel;
  const ctx = S.ctx;
  const ch = S.channels.hat;
  const now = time;
  const dur = open ? 0.25 : 0.04;
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 8000;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.22 * vel, now + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(hp);
  hp.connect(g);
  g.connect(ch.hp);
  src.start(now);
  src.stop(now + dur + 0.02);
}

/* --- CRASH: ruído longo HPF --- */
function playCrash(time){
  if (!S.ready) return;
  const ctx = S.ctx;
  const ch = S.channels.crash;
  const now = time;
  const dur = 1.6;
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){
    const decay = Math.pow(1 - i / len, 1.6);
    d[i] = (Math.random() * 2 - 1) * decay;
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 5000;
  const g = ctx.createGain();
  g.gain.value = 0.22;
  src.connect(hp);
  hp.connect(g);
  g.connect(ch.hp);
  src.start(now);
  src.stop(now + dur);
}

/* --- BASS: saw + sub + filtro ressonante --- */
function playBass(time, freq, dur){
  if (!S.ready) return;
  const ctx = S.ctx;
  const ch = S.channels.bass;
  const now = time;

  const o1 = ctx.createOscillator();
  o1.type = 'sawtooth';
  o1.frequency.value = freq;

  const o2 = ctx.createOscillator();
  o2.type = 'sine';
  o2.frequency.value = freq / 2;

  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(500, now);
  lp.frequency.exponentialRampToValueAtTime(180, now + dur * 0.6);
  lp.Q.value = 3;

  const g1 = ctx.createGain();
  g1.gain.value = 0.28;
  const g2 = ctx.createGain();
  g2.gain.value = 0.32;

  const env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, now);
  env.gain.linearRampToValueAtTime(0.55, now + 0.012);
  env.gain.setValueAtTime(0.55, now + dur * 0.65);
  env.gain.exponentialRampToValueAtTime(0.0001, now + dur);

  o1.connect(g1);
  o2.connect(g2);
  g1.connect(lp);
  g2.connect(lp);
  lp.connect(env);
  env.connect(ch.hp);

  o1.start(now);
  o2.start(now);
  o1.stop(now + dur + 0.05);
  o2.stop(now + dur + 0.05);
}

/* --- KEYS: FM Rhodes-like --- */
function playKeys(time, freqs, dur){
  if (!S.ready) return;
  const ctx = S.ctx;
  const ch = S.channels.keys;
  const now = time;

  for (let i = 0; i < freqs.length; i++){
    const freq = freqs[i];
    const carrier = ctx.createOscillator();
    carrier.type = 'sine';
    carrier.frequency.value = freq;

    const modulator = ctx.createOscillator();
    modulator.type = 'sine';
    modulator.frequency.value = freq * 2;

    const modGain = ctx.createGain();
    modGain.gain.setValueAtTime(freq * 1.5, now);
    modGain.gain.exponentialRampToValueAtTime(1, now + 0.3);

    modulator.connect(modGain);
    modGain.connect(carrier.frequency);

    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, now);
    env.gain.linearRampToValueAtTime(0.12, now + 0.005);
    env.gain.exponentialRampToValueAtTime(0.05, now + dur * 0.4);
    env.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    carrier.connect(env);
    env.connect(ch.hp);

    carrier.start(now);
    modulator.start(now);
    carrier.stop(now + dur + 0.05);
    modulator.stop(now + dur + 0.05);
  }
}

/* --- VOICE: formantes via 2 filtros peaking --- */
function playVoice(time, freq, dur){
  if (!S.ready || !freq) return;
  const ctx = S.ctx;
  const ch = S.channels.vocal;
  const now = time;

  const f1 = ctx.createBiquadFilter();
  f1.type = 'peaking';
  f1.frequency.value = 800;
  f1.Q.value = 4;
  f1.gain.value = 10;

  const f2 = ctx.createBiquadFilter();
  f2.type = 'peaking';
  f2.frequency.value = 1200;
  f2.Q.value = 5;
  f2.gain.value = 8;

  const env = ctx.createGain();
  env.gain.setValueAtTime(0.0001, now);
  env.gain.linearRampToValueAtTime(0.18, now + 0.06);
  env.gain.setValueAtTime(0.18, now + dur * 0.7);
  env.gain.exponentialRampToValueAtTime(0.0001, now + dur);

  // 4 harmônicos
  const harm = [1, 2, 3, 4];
  const amps = [0.6, 0.25, 0.12, 0.06];
  for (let i = 0; i < harm.length; i++){
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq * harm[i];
    const g = ctx.createGain();
    g.gain.value = amps[i];
    o.connect(g);
    g.connect(f1);
    o.start(now);
    o.stop(now + dur + 0.05);
  }

  f1.connect(f2);
  f2.connect(env);
  env.connect(ch.hp);
}

/* --- PAD: 2 saw detune + lowpass --- */
function playPad(time, freqs, dur){
  if (!S.ready) return;
  const ctx = S.ctx;
  const ch = S.channels.pad;
  const now = time;

  for (let i = 0; i < freqs.length; i++){
    const freq = freqs[i];
    // 2 osciladores detune
    for (let d = -1; d <= 1; d += 2){
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = freq;
      o.detune.value = d * 7;

      const env = ctx.createGain();
      env.gain.setValueAtTime(0.0001, now);
      env.gain.linearRampToValueAtTime(0.04, now + dur * 0.3);
      env.gain.setValueAtTime(0.04, now + dur * 0.7);
      env.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 1800;

      o.connect(lp);
      lp.connect(env);
      env.connect(ch.hp);

      o.start(now);
      o.stop(now + dur + 0.05);
    }
  }
}

/* --- SIDECHAIN: ducking no bass --- */
function triggerSidechain(time){
  if (S.sidechain.bypass) return;
  const ch = S.channels.bass;
  if (!ch) return;
  const duck = Math.pow(10, -S.sidechain.amount / 20);
  const g = ch.duck.gain;
  g.cancelScheduledValues(time);
  g.setValueAtTime(g.value, time);
  g.linearRampToValueAtTime(duck, time + 0.005);
  g.setValueAtTime(duck, time + 0.03);
  g.linearRampToValueAtTime(1, time + 0.03 + S.sidechain.release);
}

/* ============================================================
   SCHEDULER — 16th notes, sem alocação
   ============================================================ */
function scheduler(){
  if (!S.playing) return;
  const ctx = S.ctx;
  while (S.nextNoteTime < ctx.currentTime + 0.12){
    scheduleNote(S.current16th, S.nextNoteTime);
    S.nextNoteTime += S.sixteenth;
    S.current16th = (S.current16th + 1) % 512; // 32 compassos × 16 = 512
    if (S.current16th % 16 === 0) S.bar++;
  }
  S.timer = setTimeout(scheduler, 25);
}

function scheduleNote(step, time){
  const barIdx = Math.floor(step / 16) % 2;       // 0 ou 1 (2 compassos por acorde)
  const pos = step % 16;                          // 0-15
  const globalBar = Math.floor(step / 16);        // 0-31
  const section = Math.floor(globalBar / 8);      // 0-3
  const chordIdx = Math.floor(globalBar / 2) % 4; // 0-3 (cada acorde dura 2 compassos)

  const intro    = section === 0;
  const corpo    = section === 1;
  const climax   = section === 2;
  const breakSec = section === 3;

  const playDrums = !breakSec;
  const playSnare = corpo || climax;
  const playKeys  = corpo || climax;
  const playVoice = climax || breakSec;
  const playPad   = section >= 1;

  // ---- KICK (boom-bap) ----
  if (playDrums){
    if (pos === 0)  playKick(time, 1.0);
    if (pos === 6)  playKick(time, 0.85);
    if (pos === 10) playKick(time, 0.55); // ghost
    if (pos === 12) playKick(time, 0.9);
  }

  // ---- SNARE (2 e 4 + ghosts) ----
  if (playSnare){
    if (pos === 4 || pos === 12) playSnare(time, 1.0);
    if (pos === 7)  playSnare(time, 0.3);
    if (pos === 14) playSnare(time, 0.4);
  }

  // ---- HAT (8ths com swing) ----
  if (playDrums){
    const swing = (pos % 2 === 1) ? 0.018 : 0;
    if (pos % 2 === 0) playHat(time + swing, false, 0.9);
    if (pos % 2 === 1) playHat(time + swing, false, 0.55);
    if (pos === 14 && globalBar % 2 === 0) playHat(time, true, 0.7);
  }

  // ---- CRASH no início de cada seção ----
  if (pos === 0 && globalBar % 8 === 0 && globalBar > 0){
    playCrash(time);
  }

  // ---- BASS ----
  if (!breakSec){
    if (pos === 0)  playBass(time, BASS_HZ[chordIdx], S.sixteenth * 6);
    if (pos === 6)  playBass(time, BASS_FIFTH_HZ[chordIdx], S.sixteenth * 2);
    if (pos === 10) playBass(time, BASS_HZ[chordIdx], S.sixteenth * 3);
  }

  // ---- KEYS ----
  if (playKeys){
    if (pos === 0) playKeys(time, CHORD_HZ[chordIdx], S.sixteenth * 8);
    if (pos === 8) playKeys(time, CHORD_HZ[chordIdx].slice(0, 3), S.sixteenth * 4);
  }

  // ---- VOICE ----
  if (playVoice){
    if (pos % 4 === 0){
      const melIdx = (globalBar * 4 + pos / 4) % MELODY_HZ.length;
      const f = MELODY_HZ[melIdx];
      if (f > 0) playVoice(time, f, S.sixteenth * 4);
    }
  }

  // ---- PAD ----
  if (playPad && pos === 0 && barIdx === 0){
    playPad(time, PAD_HZ[chordIdx], S.sixteenth * 32);
  }
}

/* ============================================================
   TRANSPORT
   ============================================================ */
function startLoop(){
  if (!S.ready) return;
  S.nextNoteTime = S.ctx.currentTime + 0.1;
  S.current16th = 0;
  S.bar = 0;
  S.playing = true;
  scheduler();
}
function pauseLoop(){
  S.playing = false;
  if (S.timer) clearTimeout(S.timer);
}
function stopLoop(){
  pauseLoop();
  S.current16th = 0;
  S.bar = 0;
}

/* ============================================================
   CONTROLES DE MIX
   ============================================================ */
function setEQ(name, { freq, Q, gain }){
  const ch = S.channels[name];
  if (!ch) return;
  if (freq != null) ch.eq.frequency.value = freq;
  if (Q != null)    ch.eq.Q.value = Q;
  if (gain != null){
    ch.eq._userGain = gain;
    ch.eq.gain.value = S.bypassEQ ? 0 : gain;
  }
}
function setHP(name, freq){
  const ch = S.channels[name];
  if (!ch) return;
  ch.hp.frequency.value = freq;
}
function setPan(name, v){
  const ch = S.channels[name];
  if (!ch) return;
  ch.pan.pan.value = v;
}
function muteChannel(name, on){
  const ch = S.channels[name];
  if (!ch) return;
  ch.gain.gain.value = on ? 0 : 1;
}
function setSoloSet(list){
  S.soloSet = new Set(list);
  const solo = S.soloSet.size > 0;
  CHANNELS.forEach(n=>{
    const ch = S.channels[n];
    const audible = solo ? S.soloSet.has(n) : !S.muteSet.has(n);
    ch.gain.gain.value = audible ? 1 : 0;
  });
}
function bypassEQ(on){
  S.bypassEQ = on;
  CHANNELS.forEach(n=>{
    const ch = S.channels[n];
    ch.eq.gain.value = on ? 0 : (ch.eq._userGain || 0);
  });
}
function bypassSidechain(on){ S.sidechain.bypass = on; }
function setSidechain({ amount, release }){
  if (amount != null) S.sidechain.amount = amount;
  if (release != null) S.sidechain.release = release;
}

function getMeters(){
  const out = {};
  for (let i = 0; i < CHANNELS.length; i++){
    const n = CHANNELS[i];
    const ch = S.channels[n];
    ch.meter.getByteTimeDomainData(ch.meterArr);
    let peak = 0;
    for (let j = 0; j < ch.meterArr.length; j++){
      const v = Math.abs(ch.meterArr[j] - 128) / 128;
      if (v > peak) peak = v;
    }
    out[n] = peak;
  }
  return out;
}
function getGR(){
  const g = S.channels.bass ? S.channels.bass.duck.gain.value : 1;
  return { gain: g };
}

function fmtVal(c, v){
  v = +v;
  if (['panHar','voicePan','padPan','hatPan'].includes(c.id)){
    return v === 0 ? 'C' : (v<0 ? Math.abs(v)+' L' : v+' R');
  }
  if (c.unit === 'dB') return (c.invert?'−':'') + Math.abs(v).toFixed(1) + ' dB';
  if (c.unit === '%')  return v + ' %';
  if (c.unit === 'ms') return v + ' ms';
  if (c.unit === 'Hz') return v + ' Hz';
  return v + (c.unit ? ' '+c.unit : '');
}

function render(){
  const sel = $('lessonSel');
  sel.innerHTML = LESSONS.map((l,i)=>`<option value="${i}">${t(l.key)}</option>`).join('');
  sel.value = UI.current;
  sel.onchange = ()=>{ UI.current = +sel.value; renderLesson(); };

  $('langSel').value = LANG;
  $('langSel').onchange = e =>{ LANG = e.target.value; render(); };

  $('lblLesson').textContent = t('lesson');
  $('lblViz').textContent = t('viz');
  $('lblCtrl').textContent = t('ctrl');
  $('lblMix').textContent = t('mixer');
  $('abA').textContent = t('before');
  $('abB').textContent = t('after');
  $('ovHint').textContent = t('overlay_hint');
  $('startBtn').textContent = t('start');

  renderLesson();
}

function renderLesson(){
  const lesson = LESSONS[UI.current];
  $('lessonTitle').textContent = t(lesson.titleKey);
  $('lessonBadge').textContent = t(lesson.key);
  $('lessonBadge').className = 'badge ' + lesson.badge;
  $('lessonGoal').textContent = t(lesson.goalKey);

  const box = $('ctrlBox');
  box.innerHTML = lesson.controls.map(c=>`
    <div class="ctrl">
      <div class="ctrl-head">
        <label>${t(c.labelKey)}</label>
        <span class="val" id="v_${c.id}">${fmtVal(c, c.value)}</span>
      </div>
      <input type="range" id="c_${c.id}" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${c.value}" class="${c.color||''}">
    </div>
  `).join('');
  lesson.controls.forEach(c=>{
    const input = $('c_'+c.id);
    input.oninput = e =>{
      const v = +e.target.value;
      $('v_'+c.id).textContent = fmtVal(c, v);
      if (S.ready) lesson.onControl(c.id, v);
    };
  });

  $('abA').onclick = ()=>{
    UI.abMode='before';
    if (S.ready){ bypassEQ(true); bypassSidechain(true); }
    $('abA').classList.add('on','a');
    $('abB').classList.remove('on','b');
  };
  $('abB').onclick = ()=>{
    UI.abMode='after';
    if (S.ready){ bypassEQ(false); bypassSidechain(false); }
    $('abB').classList.add('on','b');
    $('abA').classList.remove('on','a');
    if (S.ready) lesson.apply && lesson.apply();
  };

  renderMixer(lesson);
  renderFreqMap(lesson);
  renderLegend(lesson);
  if (S.ready) lesson.apply && lesson.apply();

  if (UI.raf) cancelAnimationFrame(UI.raf);
  UI.raf = requestAnimationFrame(drawLoop);
}

function renderMixer(lesson){
  const box = $('mixer');
  box.innerHTML = lesson.instruments.map(name=>`
    <div class="ch">
      <div class="nm ${name}">${name}</div>
      <div class="btns">
        <button class="solo" data-ch="${name}">S</button>
        <button class="mute" data-ch="${name}">M</button>
      </div>
      <div class="mt"><i id="m_${name}"></i></div>
      <div class="gr"><i id="g_${name}"></i></div>
    </div>
  `).join('');
  box.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      const ch = b.dataset.ch;
      const on = !b.classList.contains('on');
      b.classList.toggle('on', on);
      if (!S.ready) return;
      if (b.classList.contains('solo')){
        on ? S.soloSet.add(ch) : S.soloSet.delete(ch);
        setSoloSet(S.soloSet.size > 0 ? Array.from(S.soloSet) : lesson.instruments);
      }
      if (b.classList.contains('mute')){
        muteChannel(ch, on);
      }
    };
  });
}

const BAND_MAP = [
  { name:'Kick',  lo:40,  hi:100,  color:'#e8ecf2', ch:'kick' },
  { name:'Bass',  lo:60,  hi:250,  color:'#8ea4ff', ch:'bass' },
  { name:'Snare', lo:150, hi:400,  color:'#e0a85c', ch:'snare' },
  { name:'Voz',   lo:250, hi:4000, color:'#ffb8d0', ch:'vocal' },
  { name:'Keys',  lo:200, hi:2000, color:'#5cc971', ch:'keys' },
  { name:'Pad',   lo:300, hi:6000, color:'#b072ff', ch:'pad' },
  { name:'Hat',   lo:6000,hi:14000,color:'#c8a06c', ch:'hat' }
];
function logPos(f){
  const fmin=20, fmax=20000;
  return (Math.log10(f) - Math.log10(fmin)) / (Math.log10(fmax) - Math.log10(fmin)) * 100;
}
function renderFreqMap(lesson){
  const box = $('fmap');
  const active = new Set(lesson.instruments);
  let html = `<div class="ax"><span>20</span><span>100</span><span>500</span><span>2k</span><span>8k</span><span>20k</span></div>`;
  BAND_MAP.filter(b=>active.has(b.ch) || (b.ch==='hat'&&active.has('crash'))).forEach((b,i)=>{
    const x = logPos(b.lo);
    const w = logPos(b.hi) - x;
    const y = 6 + (i % 2) * 16;
    html += `<div class="band" style="left:${x}%;width:${w}%;top:${y}px;background:${b.color};"></div>`;
    html += `<div class="lbl" style="left:${x}%;top:${y-2}px;">${b.name}</div>`;
  });
  box.innerHTML = html;
}
function renderLegend(lesson){
  const active = new Set(lesson.instruments);
  const items = [];
  if (active.has('kick'))  items.push(['Kick','#e8ecf2']);
  if (active.has('snare')) items.push(['Snare','#e0a85c']);
  if (active.has('hat')||active.has('crash')) items.push(['Pratos','#c8a06c']);
  if (active.has('bass'))  items.push(['Bass','#8ea4ff']);
  if (active.has('keys'))  items.push(['Keys','#5cc971']);
  if (active.has('vocal')) items.push(['Voz','#ffb8d0']);
  if (active.has('pad'))   items.push(['Pad','#b072ff']);
  $('legend').innerHTML = items.map(([n,c])=>
    `<span><i class="dot" style="background:${c}"></i>${n}</span>`
  ).join('');
}

/* ============================================================
   VISUALIZAÇÃO
   ============================================================ */
const VIZ = { cv:null, cx:null, w:0, h:0 };
function ensureCanvas(){
  const cv = $('viz'); if (!cv) return null;
  const cx = cv.getContext('2d');
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * devicePixelRatio){
    cv.width = w * devicePixelRatio;
    cv.height = h * devicePixelRatio;
    cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  VIZ.cv = cv; VIZ.cx = cx; VIZ.w = w; VIZ.h = h;
  return cx;
}
function freqToX(f, w){
  const fmin = 20, fmax = 20000;
  return (Math.log10(f) - Math.log10(fmin)) / (Math.log10(fmax) - Math.log10(fmin)) * w;
}
function drawLoop(){
  UI.raf = requestAnimationFrame(drawLoop);
  const cx = ensureCanvas();
  if (!cx) return;
  const w = VIZ.w, h = VIZ.h;
  cx.clearRect(0,0,w,h);
  drawGrid(cx,w,h);

  const lesson = LESSONS[UI.current];
  if (lesson.viz === 'heatmap') drawHeatmap(cx,w,h);
  else drawSpectrum(cx,w,h);

  if (S.ready){
    const meters = getMeters();
    Object.entries(meters).forEach(([n,v])=>{
      const el = $('m_'+n);
      if (el) el.style.width = Math.min(100, v*140) + '%';
    });
    const gr = getGR();
    const grPct = Math.max(0, (1-gr.gain)) * 100 * 3;
    const gBass = $('g_bass');
    if (gBass) gBass.style.width = Math.min(100, grPct) + '%';

    if (S.playing){
      const pos = S.current16th * S.sixteenth;
      const m = String(Math.floor(pos/60)).padStart(2,'0');
      const s = String(Math.floor(pos%60)).padStart(2,'0');
      $('pos').textContent = m+':'+s;
    }
  }
}
function drawGrid(cx,w,h){
  cx.strokeStyle = 'rgba(44,49,58,0.55)';
  cx.fillStyle = 'rgba(127,132,142,0.7)';
  cx.font = '9px "Segoe UI", sans-serif';
  [30,60,120,250,500,1000,2000,4000,8000,16000].forEach(f=>{
    const x = freqToX(f, w);
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, h-12); cx.stroke();
    cx.fillText(f>=1000?(f/1000)+'k':f, x-7, h-2);
  });
}
function drawSpectrum(cx,w,h){
  if (!S.analyser) return;
  S.analyser.getByteFrequencyData(S.fft);
  const sr = S.ctx.sampleRate;
  const bins = S.fft.length;
  const binHz = (sr/2) / bins;
  cx.beginPath();
  let first = true;
  for (let i=0;i<bins;i++){
    const f = i * binHz;
    if (f < 20 || f > 20000) continue;
    const x = freqToX(f, w);
    const v = S.fft[i] / 255;
    const y = h - 12 - v * (h-20);
    if (first){ cx.moveTo(x,y); first=false; } else cx.lineTo(x,y);
  }
  const grad = cx.createLinearGradient(0,0,w,0);
  grad.addColorStop(0, '#5cc971');
  grad.addColorStop(0.4, '#5c8ce6');
  grad.addColorStop(0.75, '#b072ff');
  grad.addColorStop(1, '#e6ccff');
  cx.strokeStyle = grad;
  cx.lineWidth = 1.6;
  cx.shadowBlur = 10;
  cx.shadowColor = '#b072ff';
  cx.stroke();
  cx.shadowBlur = 0;
}
function drawHeatmap(cx,w,h){
  const overlap = (UI.overlap ?? 70) / 100;
  const mu = Math.log10(60);
  const sigma = 0.14 * (0.5 + overlap);
  function curve(color){
    cx.beginPath();
    for (let i=0;i<w;i++){
      const f = 20 * Math.pow(1000, i/w);
      const v = Math.exp(-0.5 * Math.pow((Math.log10(f)-mu)/sigma, 2));
      const y = h - 12 - v * (h-24);
      if (i===0) cx.moveTo(i,y); else cx.lineTo(i,y);
    }
    cx.strokeStyle = color;
    cx.lineWidth = 2;
    cx.stroke();
  }
  cx.beginPath();
  for (let i=0;i<w;i++){
    const f = 20 * Math.pow(1000, i/w);
    const v = Math.exp(-0.5 * Math.pow((Math.log10(f)-mu)/sigma, 2));
    const y = h - 12 - v * (h-24);
    if (i===0) cx.moveTo(i,y); else cx.lineTo(i,y);
  }
  for (let i=w-1;i>=0;i--){
    const f = 20 * Math.pow(1000, i/w);
    const v = Math.exp(-0.5 * Math.pow((Math.log10(f)-mu)/sigma, 2));
    const y = h - 12 - v * (h-24);
    cx.lineTo(i,y);
  }
  cx.closePath();
  cx.fillStyle = 'rgba(224,85,97,' + (0.15 + 0.45*overlap) + ')';
  cx.fill();
  curve('#e8ecf2');
  curve('#8ea4ff');
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.querySelectorAll('[data-toggle]').forEach(head=>{
  head.onclick = ()=> head.closest('.panel').classList.toggle('collapsed');
});

$('playBtn').onclick = ()=>{
  if (!S.ready) return;
  if (UI.playing){
    pauseLoop();
    $('playBtn').textContent = '▶';
    $('playBtn').classList.remove('on');
    UI.playing = false;
  } else {
    startLoop();
    $('playBtn').textContent = '❚❚';
    $('playBtn').classList.add('on');
    UI.playing = true;
  }
};
$('stopBtn').onclick = ()=>{
  stopLoop();
  $('playBtn').textContent = '▶';
  $('playBtn').classList.remove('on');
  UI.playing = false;
  $('pos').textContent = '00:00';
};

/* ============================================================
   BOOTSTRAP — igual ao synth
   ============================================================ */
window.addEventListener('load', ()=>{
  if (typeof getGlobalLang === 'function'){
    try { LANG = getGlobalLang(); } catch(_){}
  }
  render();

  const overlay = $('ov');
  const startBtn = $('startBtn');

  startBtn.addEventListener('click', async () => {
    try {
      startBtn.disabled = true;
      startBtn.textContent = 'INICIANDO…';

      initAudio();
      await S.ctx.resume();

      startLoop();

      overlay.classList.add('hide');
      setTimeout(()=>{ overlay.style.display = 'none'; }, 320);

      $('playBtn').textContent = '❚❚';
      $('playBtn').classList.add('on');
      UI.playing = true;

      LESSONS[UI.current].apply && LESSONS[UI.current].apply();
      requestAnimationFrame(drawLoop);
    } catch (err){
      console.error('Erro:', err);
      startBtn.disabled = false;
      startBtn.textContent = t('start');
      alert('Erro: ' + err.message);
    }
  });
});
