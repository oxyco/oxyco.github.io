<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#f8fafc; font-family:Arial, Helvetica, sans-serif;">
  <!-- Título Principal -->
  <rect x="140" y="12" width="720" height="42" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="500" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">GUIA VALOR DE RESISTORES PMV LAVA RCB</text>

  <!-- BLOCO 1: PMV -->
  <rect x="20" y="68" width="300" height="385" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="170" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">P M V (0, 1, 2)</text>

  <!-- Caixas PMV -->
  <rect x="32" y="102" width="80" height="66" rx="6" fill="#18181b"/>
  <text x="72" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">PRETO (P)</text>
  <text x="72" y="138" text-anchor="middle" font-size="11" fill="#e4e4e7">Dígito 0</text>
  <text x="72" y="154" text-anchor="middle" font-size="11" fill="#e4e4e7">x1 (10⁰)</text>

  <rect x="130" y="102" width="80" height="66" rx="6" fill="#78350f"/>
  <text x="170" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">MARROM (M)</text>
  <text x="170" y="138" text-anchor="middle" font-size="11" fill="#fef3c7">Dígito 1</text>
  <text x="170" y="154" text-anchor="middle" font-size="11" fill="#fef3c7">x10 (10¹)</text>

  <rect x="228" y="102" width="80" height="66" rx="6" fill="#dc2626"/>
  <text x="268" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">VERMELHO (V)</text>
  <text x="268" y="138" text-anchor="middle" font-size="11" fill="#fee2e2">Dígito 2</text>
  <text x="268" y="154" text-anchor="middle" font-size="11" fill="#fee2e2">x100 (10²)</text>

  <!-- Resistor 1 kΩ (Marrom, Preto, Vermelho, Ouro) -->
  <line x1="30" y1="230" x2="310" y2="230" stroke="#64748b" stroke-width="4"/>
  <rect x="70" y="210" width="200" height="40" rx="12" fill="#fed7aa" stroke="#d97706" stroke-width="2"/>
  <rect x="95" y="210" width="14" height="40" fill="#78350f"/>
  <rect x="125" y="210" width="14" height="40" fill="#18181b"/>
  <rect x="155" y="210" width="14" height="40" fill="#dc2626"/>
  <rect x="225" y="210" width="14" height="40" fill="#d97706"/>

  <!-- Linhas Bloco 1 -->
  <path d="M 72 168 V 192 H 132 V 210" fill="none" stroke="#18181b" stroke-width="2"/>
  <path d="M 170 168 V 186 H 102 V 210" fill="none" stroke="#78350f" stroke-width="2"/>
  <path d="M 268 168 V 192 H 162 V 210" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">1 kΩ ±5%</text>

  <!-- Legenda Multiplicadores no Bloco 1 -->
  <rect x="28" y="280" width="284" height="164" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="170" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">MULTIPLICADORES</text>
  <text x="36" y="316" font-size="10" font-weight="bold" fill="#18181b">PRETO = x1 (10⁰)</text>
  <text x="36" y="332" font-size="10" font-weight="bold" fill="#78350f">MARROM = x10 (10¹)</text>
  <text x="36" y="348" font-size="10" font-weight="bold" fill="#dc2626">VERMELHO = x100 (10²)</text>
  <text x="36" y="364" font-size="10" font-weight="bold" fill="#ea580c">LARANJA = x1k (10³)</text>
  <text x="36" y="380" font-size="10" font-weight="bold" fill="#ca8a04">AMARELO = x10k (10⁴)</text>
  <text x="36" y="396" font-size="10" font-weight="bold" fill="#16a34a">VERDE = x100k (10⁵)</text>

  <text x="170" y="316" font-size="10" font-weight="bold" fill="#2563eb">AZUL = x1M (10⁶)</text>
  <text x="170" y="332" font-size="10" font-weight="bold" fill="#7e22ce">ROXO = x10M (10⁷)</text>
  <text x="170" y="348" font-size="10" font-weight="bold" fill="#64748b">CINZA = x100M (10⁸)</text>
  <text x="170" y="364" font-size="10" font-weight="bold" fill="#0f172a">BRANCO = x1G (10⁹)</text>
  <text x="170" y="384" font-size="9" font-weight="bold" fill="#b45309">OURO = x0,1 (10⁻¹) [±5%]</text>
  <text x="170" y="400" font-size="9" font-weight="bold" fill="#64748b">PRATA = x0,01 (10⁻²) [±10%]</text>

  <!-- BLOCO 2: LAVA -->
  <rect x="335" y="68" width="330" height="385" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="500" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">L A V A (3, 4, 5, 6)</text>

  <!-- Caixas LAVA -->
  <rect x="345" y="102" width="72" height="66" rx="6" fill="#ea580c"/>
  <text x="381" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">LARANJA (L)</text>
  <text x="381" y="138" text-anchor="middle" font-size="11" fill="#ffedd5">Dígito 3</text>
  <text x="381" y="154" text-anchor="middle" font-size="11" fill="#ffedd5">x1k (10³)</text>

  <rect x="425" y="102" width="72" height="66" rx="6" fill="#eab308"/>
  <text x="461" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">AMARELO (A)</text>
  <text x="461" y="138" text-anchor="middle" font-size="11" fill="#fefce8">Dígito 4</text>
  <text x="461" y="154" text-anchor="middle" font-size="11" fill="#fefce8">x10k (10⁴)</text>

  <rect x="505" y="102" width="72" height="66" rx="6" fill="#16a34a"/>
  <text x="541" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">VERDE (V)</text>
  <text x="541" y="138" text-anchor="middle" font-size="11" fill="#f0fdf4">Dígito 5</text>
  <text x="541" y="154" text-anchor="middle" font-size="11" fill="#f0fdf4">x100k (10⁵)</text>

  <rect x="585" y="102" width="72" height="66" rx="6" fill="#2563eb"/>
  <text x="621" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">AZUL (A)</text>
  <text x="621" y="138" text-anchor="middle" font-size="11" fill="#eff6ff">Dígito 6</text>
  <text x="621" y="154" text-anchor="middle" font-size="11" fill="#eff6ff">x1M (10⁶)</text>

  <!-- Resistor 345 MΩ (Laranja, Amarelo, Verde, Azul, Vermelho) -->
  <line x1="345" y1="230" x2="655" y2="230" stroke="#64748b" stroke-width="4"/>
  <rect x="385" y="210" width="230" height="40" rx="12" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
  <rect x="410" y="210" width="14" height="40" fill="#ea580c"/>
  <rect x="440" y="210" width="14" height="40" fill="#eab308"/>
  <rect x="470" y="210" width="14" height="40" fill="#16a34a"/>
  <rect x="535" y="210" width="14" height="40" fill="#2563eb"/>
  <rect x="580" y="210" width="14" height="40" fill="#dc2626"/>

  <!-- Linhas Bloco 2 -->
  <path d="M 381 168 V 192 H 417 V 210" fill="none" stroke="#ea580c" stroke-width="2"/>
  <path d="M 461 168 V 192 H 447 V 210" fill="none" stroke="#eab308" stroke-width="2"/>
  <path d="M 541 168 V 192 H 477 V 210" fill="none" stroke="#16a34a" stroke-width="2"/>
  <path d="M 621 168 V 192 H 542 V 210" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">345 MΩ ±2%</text>

  <!-- Seta tolerância Bloco 2 -->
  <path d="M 540 300 H 587 V 255" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="530" y="304" text-anchor="end" font-size="11" font-weight="bold" fill="#dc2626">Tolerância: Vermelho = ±2%</text>

  <!-- BLOCO 3: RCB -->
  <rect x="680" y="68" width="300" height="385" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="830" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b21a8">R C B (7, 8, 9)</text>

  <!-- Caixas RCB -->
  <rect x="690" y="102" width="60" height="66" rx="6" fill="#7e22ce"/>
  <text x="720" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ROXO (R)</text>
  <text x="720" y="138" text-anchor="middle" font-size="11" fill="#f3e8ff">Dígito 7</text>
  <text x="720" y="154" text-anchor="middle" font-size="11" fill="#f3e8ff">x10M</text>

  <rect x="760" y="102" width="60" height="66" rx="6" fill="#64748b"/>
  <text x="790" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">CINZA (C)</text>
  <text x="790" y="138" text-anchor="middle" font-size="11" fill="#f1f5f9">Dígito 8</text>
  <text x="790" y="154" text-anchor="middle" font-size="11" fill="#f1f5f9">x100M</text>

  <rect x="830" y="102" width="65" height="66" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="862" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">BRANCO (B)</text>
  <text x="862" y="138" text-anchor="middle" font-size="11" fill="#334155">Dígito 9</text>
  <text x="862" y="154" text-anchor="middle" font-size="11" fill="#334155">x1G</text>

  <!-- Ouro e Prata Box Lateral -->
  <rect x="905" y="102" width="68" height="150" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="939" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">OURO</text>
  <text x="939" y="134" text-anchor="middle" font-size="9" fill="#92400e">x0,1</text>
  <text x="939" y="148" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">±5%</text>
  <line x1="910" y1="160" x2="968" y2="160" stroke="#d97706"/>
  <text x="939" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">PRATA</text>
  <text x="939" y="192" text-anchor="middle" font-size="9" fill="#475569">x0,01</text>
  <text x="939" y="206" text-anchor="middle" font-size="9" font-weight="bold" fill="#475569">±10%</text>

  <!-- Resistor 78 GΩ (Roxo, Cinza, Branco, Ouro) -->
  <line x1="690" y1="230" x2="895" y2="230" stroke="#64748b" stroke-width="4"/>
  <rect x="715" y="210" width="170" height="40" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <rect x="735" y="210" width="14" height="40" fill="#7e22ce"/>
  <rect x="765" y="210" width="14" height="40" fill="#64748b"/>
  <rect x="795" y="210" width="14" height="40" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="850" y="210" width="14" height="40" fill="#d97706"/>

  <!-- Linhas Bloco 3 -->
  <path d="M 720 168 V 192 H 742 V 210" fill="none" stroke="#7e22ce" stroke-width="2"/>
  <path d="M 790 168 V 192 H 772 V 210" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 862 168 V 192 H 802 V 210" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="800" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">78 GΩ ±5%</text>

  <!-- BLOCO INFERIOR: EXEMPLO 56 kΩ E OUTRAS TOLERÂNCIAS -->
  <rect x="20" y="468" width="960" height="152" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Resistor 56 kΩ (Verde, Azul, Preto, Vermelho, Ouro) -->
  <line x1="40" y1="525" x2="310" y2="525" stroke="#64748b" stroke-width="4"/>
  <rect x="70" y="505" width="210" height="40" rx="12" fill="#99f6e4" stroke="#0d9488" stroke-width="2"/>
  <rect x="95" y="505" width="15" height="40" fill="#16a34a"/>
  <rect x="125" y="505" width="15" height="40" fill="#2563eb"/>
  <rect x="155" y="505" width="15" height="40" fill="#18181b"/>
  <rect x="195" y="505" width="15" height="40" fill="#dc2626"/>
  <rect x="245" y="505" width="15" height="40" fill="#d97706"/>

  <!-- Texto 56 kΩ -->
  <text x="320" y="510" font-size="18" font-weight="bold" fill="#0f172a">56 kΩ ±5%</text>
  <text x="320" y="534" font-size="12" fill="#334155">Dígito 1: <tspan font-weight="bold" fill="#16a34a">VERDE = 5</tspan> | Dígito 2: <tspan font-weight="bold" fill="#2563eb">AZUL = 6</tspan> | Dígito 3: <tspan font-weight="bold" fill="#18181b">PRETO = 0</tspan></text>
  <text x="320" y="556" font-size="12" fill="#334155">Multiplicador: <tspan font-weight="bold" fill="#dc2626">VERMELHO = x100 (10²)</tspan> | Tolerância: <tspan font-weight="bold" fill="#d97706">OURO = ±5%</tspan></text>
  <text x="320" y="578" font-size="12" font-weight="bold" fill="#047857">Cálculo: 560 × 100 = 56.000 Ω (56 kΩ)</text>

  <!-- Bloco Outras Tolerâncias -->
  <rect x="710" y="482" width="250" height="124" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="835" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">OUTRAS TOLERÂNCIAS</text>
  <text x="835" y="524" text-anchor="middle" font-size="10" fill="#64748b">(se 5ª faixa)</text>
  <text x="835" y="552" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">MARROM (±1%)</text>
  <text x="835" y="582" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">VERMELHO (±2%)</text>
</svg>